<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alfred QA Multi-Venture Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400;1,6..72,500&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --paper:#F3F6F5; --surface:#FFFFFF; --sunk:#E9EFEE; --ink:#14282D; --muted:#566A6F; --line:#D5DFDE;
  --green:#1D7A52; --green-bg:#E3F2EA; --amber:#A86A12; --amber-bg:#FBF0DC; --red:#B2302A; --red-bg:#FBE6E4;
  --focus:#2563B8; --brand:#1E5AA8; --chart2:#7A8F94;
  --sans:"Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --serif:"Newsreader", Georgia, "Times New Roman", serif;
  --arabic:"Noto Naskh Arabic", "Geeza Pro", "Segoe UI", Tahoma, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E191C; --surface:#152429; --sunk:#1B2D33; --ink:#E4EDEC; --muted:#91A4A8; --line:#29404A;
    --green:#4CC48E; --green-bg:#16362A; --amber:#E2A84A; --amber-bg:#3A2D14; --red:#F0786F; --red-bg:#3D1C1A;
    --focus:#7FB0F0; --chart2:#5E7479; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E191C; --surface:#152429; --sunk:#1B2D33; --ink:#E4EDEC; --muted:#91A4A8; --line:#29404A;
  --green:#4CC48E; --green-bg:#16362A; --amber:#E2A84A; --amber-bg:#3A2D14; --red:#F0786F; --red-bg:#3D1C1A;
  --focus:#7FB0F0; --chart2:#5E7479; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--focus)}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
@media (max-width:960px){.app{grid-template-columns:1fr}}

/* rail */
.rail{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh;overflow:auto}
@media (max-width:960px){.rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px 14px;gap:10px}}
.mark{font-weight:700;font-size:16.5px;letter-spacing:-.01em;line-height:1.2;padding:0 6px}
.mark small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav .grp{font-size:12px;color:var(--muted);padding:12px 10px 4px}
.nav .grp:first-child{padding-top:0}
@media (max-width:960px){.nav{flex-direction:row;overflow-x:auto;gap:2px}.nav .grp{display:none}}
.nav button{all:unset;cursor:pointer;padding:6px 10px;border-radius:7px;color:var(--muted);font-weight:500;font-size:14px;white-space:nowrap;display:flex;justify-content:space-between;gap:8px}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--sunk);color:var(--ink);box-shadow:inset 3px 0 0 var(--brand)}
.nav button:focus-visible{outline:2px solid var(--focus)}
.count{font-size:11.5px;background:var(--red-bg);color:var(--red);border-radius:10px;padding:0 7px;font-weight:600;line-height:18px}
.count.n{background:var(--sunk);color:var(--ink)}
.rail-foot{margin-top:auto;font-size:12.5px;color:var(--muted);padding:0 6px}
@media (max-width:960px){.rail-foot{display:none}}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.whoami{font-size:13px;padding:8px 10px;background:var(--sunk);border-radius:8px}
.whoami b{display:block}

main{padding:26px clamp(16px,3vw,40px) 90px;min-width:0}
h1{font-size:25px;letter-spacing:-.02em;margin:0 0 4px;line-height:1.2}
h2{font-size:16.5px;margin:0;letter-spacing:-.01em}
h3{font-size:15px;margin:0 0 8px}
.lede{color:var(--muted);margin:0 0 20px;max-width:75ch}

/* layout pieces */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:16px}
.sec-h{display:flex;align-items:baseline;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sec-h p{margin:0;color:var(--muted);font-size:13.5px}
.sec-h .end{margin-left:auto;display:flex;gap:8px;align-items:center}
.sec-n{font-weight:700;color:var(--brand);font-size:15px;min-width:18px}
.sec-b{padding:16px 18px}
.sec.dim .sec-b{opacity:.55}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px 16px}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:var(--muted)}
input[type=text],input[type=number],input[type=email],input[type=date],select,textarea{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:7px 10px;color:var(--ink);width:100%}
input:disabled,select:disabled,textarea:disabled{opacity:.7}
textarea{resize:vertical;min-height:80px;line-height:1.5}
textarea.tx{min-height:220px;font-size:14px}
.check{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);font-weight:400}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.good{color:var(--green);border-color:var(--green)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:13px}
.seg-ctl{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg-ctl button{all:unset;cursor:pointer;padding:6px 12px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg-ctl button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg-ctl button:focus-visible{outline:2px solid var(--focus)}
.hint{font-size:13px;color:var(--muted)}
.note{border-left:3px solid var(--line);background:var(--sunk);padding:9px 12px;border-radius:0 7px 7px 0;font-size:13.5px;margin:0 0 10px}
.warn{border-left:3px solid var(--amber);background:var(--amber-bg);padding:9px 12px;border-radius:0 7px 7px 0;font-size:13.5px;margin:0 0 10px}
.err{border-left:3px solid var(--red);background:var(--red-bg);padding:9px 12px;border-radius:0 7px 7px 0;font-size:13.5px;margin:0 0 10px}
.ok{border-left:3px solid var(--green);background:var(--green-bg);padding:9px 12px;border-radius:0 7px 7px 0;font-size:13.5px;margin:0 0 10px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:10px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.g{background:var(--green-bg);color:var(--green)}
.tag.a{background:var(--amber-bg);color:var(--amber)}
.tag.r{background:var(--red-bg);color:var(--red)}
.band{display:inline-block;padding:2px 9px;border-radius:6px;font-weight:600;font-size:13px;white-space:nowrap}
.band.Green{background:var(--green-bg);color:var(--green)}
.band.Amber{background:var(--amber-bg);color:var(--amber)}
.band.Red{background:var(--red-bg);color:var(--red)}
.band.none{background:var(--sunk);color:var(--muted)}

/* tables */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.sec .tablewrap{border:0;border-radius:0}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:12.5px;background:var(--sunk)}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--sunk)}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{font-variant-numeric:tabular-nums;text-align:right}
td.num{font-weight:600}
td.wrap{white-space:normal;min-width:220px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:flex-end}
.toolbar select,.toolbar input{width:auto;min-width:130px}
.toolbar label.f{min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi b{display:block;font-size:24px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi span{font-size:12.5px;color:var(--muted)}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}

/* venture cards */
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:18px}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;border-top:4px solid var(--vc)}
.vcard .big{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.vcard .big span{font-size:18px;color:var(--muted);font-weight:500}
.lobs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}

/* evaluation */
.audit{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}
@media (max-width:1200px){.audit{grid-template-columns:1fr}}
.pillar{border-top:1px solid var(--line);padding:14px 0}
.pillar:first-child{border-top:0;padding-top:0}
.p-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}
.p-name{font-weight:600}
.p-check{font-size:13px;color:var(--muted);margin-top:2px;max-width:62ch}
.p-score{display:flex;align-items:center;gap:8px}
.p-score input[type=range]{width:150px;accent-color:var(--brand)}
.p-score input[type=number]{width:58px;text-align:center;font-weight:700;font-size:16px;padding:4px}
.p-ai{font-size:12px;color:var(--muted);text-align:right;min-height:16px}
.quote,.quote textarea{font-family:var(--serif);font-size:16px;line-height:1.55}
.quote{margin-top:8px}
.override{display:none;margin-top:10px;padding:12px;background:var(--amber-bg);border-radius:8px;gap:8px;flex-direction:column}
.override.on{display:flex}
.override b{font-size:13px;color:var(--amber)}
.needq{display:none;font-size:12.5px;color:var(--red);margin-top:4px}
.needq.on{display:block}
.breach{border:1px solid var(--line);border-left:4px solid var(--sev);border-radius:8px;padding:12px 14px;margin-bottom:10px;background:var(--paper)}
.breach .t{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:600}
.breach .snip{font-size:13.5px;color:var(--muted);margin:6px 0}

/* ledger */
.ledger{position:sticky;top:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
@media (max-width:1200px){.ledger{position:static}}
.total{font-size:54px;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.total span{font-size:21px;color:var(--muted);font-weight:500;letter-spacing:0}
.bar{position:relative;display:flex;height:32px;margin:24px 0 6px;border-radius:6px;background:var(--sunk)}
.bseg{position:relative;height:100%;border-right:2px solid var(--surface)}
.bseg:last-child{border-right:0}
.bseg i{position:absolute;left:0;top:0;bottom:0;background:var(--brand);opacity:.85}
.bseg:first-child i{border-radius:6px 0 0 6px}
.bench{position:absolute;top:-7px;bottom:-7px;width:2px;background:var(--ink)}
.bench::after{content:attr(data-l);position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-size:11.5px;font-weight:600;white-space:nowrap}
.legend{display:grid;grid-template-columns:1fr auto auto;gap:3px 10px;font-size:13px;margin-top:12px;font-variant-numeric:tabular-nums}
.legend .k{color:var(--muted)} .legend .v{text-align:right;font-weight:600} .legend .w{text-align:right;color:var(--muted)}
.ledger hr,.sec hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.meta{font-size:13px;color:var(--muted);display:grid;gap:4px}
.meta b{color:var(--ink);font-weight:600}
.stack{display:grid;gap:8px}

/* dialogue */
.turns{display:grid;gap:2px;max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.turn{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:9px 12px;border-bottom:1px solid var(--line)}
.turn.two{grid-template-columns:96px minmax(0,1fr) minmax(0,1fr)}
@media (max-width:700px){.turn,.turn.two{grid-template-columns:1fr}}
.turn:last-child{border-bottom:0}
.turn.flag-breach{background:var(--red-bg)}
.turn.flag-turn{box-shadow:inset 3px 0 0 var(--green)}
.turn.flag-rep{box-shadow:inset 3px 0 0 var(--amber)}
.who{font-size:12.5px;font-weight:600}
.who.advisor{color:var(--brand)}
.who .ts{display:block;font-weight:500;color:var(--muted)}
.who .ts button{all:unset;cursor:pointer;color:var(--focus);text-decoration:underline}
.ttext{font-size:14.5px}
.ttext[dir=rtl]{font-family:var(--arabic);font-size:16px;line-height:1.7}
.tflags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.colhead{display:grid;grid-template-columns:96px minmax(0,1fr) minmax(0,1fr);gap:12px;padding:8px 12px;font-size:12.5px;color:var(--muted);font-weight:600;background:var(--sunk);position:sticky;top:0;z-index:1}
audio{width:100%;margin-top:10px}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--sans)}
.chart .lbl{fill:var(--ink);font-weight:600}
.chart .grid line{stroke:var(--line)}
.chartbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.chartbox h3{margin-bottom:10px}

/* misc */
.thinking{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--sunk);border-radius:8px;margin-top:12px;flex-wrap:wrap}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:s 1s linear infinite;flex-shrink:0}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:8px;font-weight:500;z-index:30;max-width:90vw}
.modal-back{position:fixed;inset:0;background:rgba(10,20,22,.45);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:calc(40px + env(safe-area-inset-top,0px)) 16px 40px;overflow:auto}
.modal{background:var(--surface);border-radius:12px;max-width:760px;width:100%;padding:20px 22px;border:1px solid var(--line)}
.modal pre{white-space:pre-wrap;font-family:var(--sans);font-size:14px;margin:0}
.trail{font-size:13px;display:grid;gap:8px}
.trail div{border-left:2px solid var(--line);padding-left:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.drop{border:2px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--brand);background:var(--sunk)}
.stage{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.stage span{font-size:11.5px;padding:1px 7px;border-radius:9px;background:var(--sunk);color:var(--muted)}
.stage span.done{background:var(--green-bg);color:var(--green)}
.stage span.now{background:var(--amber-bg);color:var(--amber)}
.stage span.fail{background:var(--red-bg);color:var(--red)}
.scorecard{border:1px solid var(--line);border-radius:10px;padding:18px;background:var(--paper)}
.ro .editable-only{display:none}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="mark">Alfred QA Portal<small>Multi-venture quality, governance and coaching</small></div>
    <label class="f">Venture scope
      <select id="scope"></select>
    </label>
    <nav class="nav" id="nav" aria-label="Portal tabs"></nav>
    <div class="rail-foot" id="railFoot"></div>
  </aside>
  <main id="main"></main>
</div>
<div id="modalHost"></div>
<div id="toastHost" aria-live="polite"></div>
<script>
/* =====================================================================
   Alfred QA Multi-Venture Portal
   ===================================================================== */
const PROMPT_VERSION = "qa-prompt-v2.0 / schema-v2.0";
const SENTIMENTS = ["Delighted","Positive","Neutral","Anxious","Negative","Frustrated","Dissatisfied"];
const SENT_VAL = {Delighted:3, Positive:2, Neutral:1, Anxious:0, Negative:-1, Frustrated:-2, Dissatisfied:-3};
const SEVERITIES = ["Critical","High","Medium","Low"];
const SEV_COLOR = {Critical:"var(--red)", High:"var(--red)", Medium:"var(--amber)", Low:"var(--chart2)"};
const STATUS_LABEL = {draft:"Draft", pending_review:"Pending review", reaudit:"Re-audit requested", confirmed:"Confirmed", published:"Published"};
const LEVELS = [["1-2","Unacceptable"],["3-4","Needs improvement"],["5-6","Approaching standard"],["7-8","Meets standard"],["9-10","Exemplary"]];
const ROLE_LABEL = {admin:"QA lead / admin", manager:"QA reviewer / manager", officer:"QA officer"};

const DEFAULT_SETTINGS = {
  version: 1,
  rubric: [
    {key:"opening", label:"Opening & greeting", weight:5, isEnabled:true, canonical:true, aliases:["greeting","opening_greeting"],
     check:"Branded standard introduction, advisor name stated, verification of customer identity, enthusiastic and welcoming tone.",
     criteria:{"1-2":"No greeting, brand or name; identity not verified.","3-4":"Partial greeting; brand or name missing; weak verification.","5-6":"Greets and names brand but skips verification or sounds flat.","7-8":"Full branded greeting, name stated, identity verified.","9-10":"Warm, confident, fully verified opening that sets the agenda."}},
    {key:"communication", label:"Communication & call handling", weight:25, isEnabled:true, canonical:true, aliases:["call handling","communication & call handling"],
     check:"Active listening, pacing, no over-talking, professional vocabulary, clarity of speech, no background noise.",
     criteria:{"1-2":"Talks over customer, unclear, unprofessional language.","3-4":"Frequent interruptions or repeats needed; poor pacing.","5-6":"Generally clear but rushed or missed acknowledgements.","7-8":"Clear, well-paced, acknowledges and listens actively.","9-10":"Exceptional clarity and empathy; customer never needs repeats."}},
    {key:"productKnowledge", label:"Product knowledge & compliance", weight:35, isEnabled:true, canonical:true, aliases:["compliance","product knowledge & compliance"],
     check:"Accuracy of insurance and financial terms, disclosure of exclusions, correct underwriting guidelines, zero misrepresentation.",
     criteria:{"1-2":"Incorrect or misleading product information.","3-4":"Key disclosures missing; several inaccuracies.","5-6":"Mostly accurate; one material disclosure missed.","7-8":"Accurate, required disclosures made.","9-10":"Expert, complete disclosures and clear comparisons."}},
    {key:"problemResolution", label:"Problem resolution & ownership", weight:30, isEnabled:true, canonical:true, aliases:["ownership","problem resolution & ownership"],
     check:"First-contact resolution, accountability, structured objection handling, clear alternatives.",
     criteria:{"1-2":"No ownership; customer left without a path forward.","3-4":"Little probing; objections dismissed.","5-6":"Resolves partly; alternatives thin.","7-8":"Probes needs, handles objections, offers options.","9-10":"Full first-contact resolution with tailored alternatives."}},
    {key:"closing", label:"Next steps & closing", weight:5, isEnabled:true, canonical:true, aliases:["next steps","next steps & closing"],
     check:"Clear timeline for delivery or quotes, summary of action items, polite sign-off, thanks the customer.",
     criteria:{"1-2":"Abrupt end; no next steps.","3-4":"Next steps vague; no summary.","5-6":"Next steps given but no recap or sign-off.","7-8":"Recap, timeline and polite branded sign-off.","9-10":"Crisp recap, confirmed timeline, follow-up sent, warm sign-off."}}
  ],
  bands:{amber:70, exemplary:95},
  ventures:[
    {id:"insurancemarket", name:"InsuranceMarket.ae", code:"IM", domain:"insurancemarket.ae", color:"#1E5AA8", lobs:["Motor","Health","Life","General","Commercial","Travel"], benchmarkPassingScore:85, isActive:true},
    {id:"creditmarket", name:"CreditMarket.ae", code:"CM", domain:"creditmarket.ae", color:"#6B3FA0", lobs:["Loans","Cards","Mortgages"], benchmarkPassingScore:85, isActive:true},
    {id:"holidaymarket", name:"HolidayMarket.ae", code:"HM", domain:"holidaymarket.ae", color:"#0E8C8C", lobs:["Holidays","Visas"], benchmarkPassingScore:85, isActive:true}
  ],
  taxonomy:{
    auditCategories:["Random Audit","Complaint Audit","Repeat Journey","Calibration"],
    channels:["Phone","WhatsApp","Email","Live Chat"],

function computeTotal(scores, fatal, params){

  let t = 0;
  for(const p of params) t += (clamp(Number(scores[p.key])||1, 1, 10) / 10) * (Number(p.weight)||0);
  return round1(t * 100 / wsum);
}

function tsToSec(t){

  if(typeof t === "number") return t > 100000 ? t/1000 : t;
  const m = String(t).trim().replace(",", ".").match(/^(?:(\d+):)?(\d{1,2}):(\d{2}(?:\.\d+)?)$/);
  if(m) return (Number(m[1]||0)*3600) + Number(m[2])*60 + Number(m[3]);
  const n = parseFloat(t); return isFinite(n) ? n : null;
}
function secToTs(s){ if(s === null || s === undefined || !isFinite(s)) return ""; s = Math.max(0, Math.round(s)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return (h ? h + ":" + String(m).padStart(2,"0") : m) + ":" + String(x).padStart(2,"0"); }

function parseDialogue(text, intake){
  const raw = String(text || "").trim();
  if(!raw) return [];
  let turns = null;
  if(/^[\[{]/.test(raw)){ try{ turns = fromJSON(JSON.parse(raw)); }catch(e){ turns = null; } }
  if(!turns && /-->/.test(raw)) turns = fromSubtitles(raw);
  if(!turns && /^\s*From:\s/im.test(raw) && /^\s*(Subject|To|Sent|Date):/im.test(raw)) turns = fromEmail(raw);
  if(!turns) turns = fromLines(raw);
  return assignRoles(turns.filter(t => t.text && t.text.trim()), intake);
}
function fromJSON(j){
  if(typeof j === "string") return fromLines(j);
  if(j && typeof j.transcript === "string" && !j.words && !j.segments && !j.utterances) return fromLines(j.transcript);
  let arr = Array.isArray(j) ? j : (j.utterances || j.segments || j.turns || j.messages || j.results || null);
  if(!arr && Array.isArray(j.words)){
    const out = []; let cur = null;
    for(const w of j.words){
      if(w.type && w.type !== "word" && w.type !== "spacing") continue;
      const sp = w.speaker_id ?? w.speaker ?? "speaker";
      if(!cur || cur.speaker !== String(sp)){ cur = {speaker:String(sp), text:"", seconds:tsToSec(w.start)}; out.push(cur); }
      cur.text += (w.type === "spacing" ? w.text : (cur.text && !/\s$/.test(cur.text) ? " " : "") + w.text);
    }
    return out.map(t => ({...t, text:t.text.replace(/\s+/g," ").trim()}));
  }
  if(!Array.isArray(arr)) return null;
  return arr.map(x => {
    if(typeof x === "string") return {speaker:"", text:x, seconds:null};
    const sp = x.speaker ?? x.speaker_label ?? x.role ?? x.name ?? x.from ?? x.author ?? x.channel ?? "";
    const tx = x.text ?? x.content ?? x.message ?? x.transcript ?? x.utterance ?? "";
    const st = x.start ?? x.start_time ?? x.startTime ?? x.timestamp ?? x.time ?? x.offset ?? null;
    let seconds = tsToSec(st);
    if(typeof st === "number" && x.end && x.end > 100000) seconds = st/1000;
    return {speaker:String(sp), text:String(tx), seconds};
  });
}
function fromSubtitles(raw){
  const blocks = raw.replace(/^WEBVTT[^\n]*\n/, "").split(/\n\s*\n/);
  const out = [];
  for(const b of blocks){
    const lines = b.split("\n").map(l => l.trim()).filter(Boolean);
    const ti = lines.findIndex(l => /-->/.test(l)); if(ti < 0) continue;
    const start = tsToSec(lines[ti].split("-->")[0].trim().split(" ")[0]);
    let body = lines.slice(ti+1).join(" ");
    let sp = "";
    const v = body.match(/^<v\s+([^>]+)>(.*)$/); if(v){ sp = v[1]; body = v[2].replace(/<\/v>/,""); }
    const m = body.match(/^([A-Za-z][\w .'’-]{0,30}):\s*(.+)$/); if(m && !sp){ sp = m[1]; body = m[2]; }
    const prev = out[out.length-1];
    if(prev && prev.speaker === sp && sp) prev.text += " " + body;
    else out.push({speaker:sp, text:body, seconds:start});
  }
  return out;
}
function fromEmail(raw){
  const parts = raw.split(/^(?=\s*From:\s)/im).map(p => p.trim()).filter(Boolean);
  return parts.map(p => {
    const from = (p.match(/^From:\s*(.+)$/im) || [])[1] || "";
    const date = (p.match(/^(?:Sent|Date):\s*(.+)$/im) || [])[1] || "";
    const body = p.replace(/^(From|To|Cc|Sent|Date|Subject):.*$/gim, "").trim();
    return {speaker:from.replace(/<.*>/,"").trim(), text:body.replace(/\s+\n/g,"\n"), seconds:null, stamp:date};
  });
}
function fromLines(raw){
  const lines = raw.split(/\r?\n/);
  const wa = /^\[?(\d{1,2}[\/.]\d{1,2}[\/.]\d{2,4}),?\s+(\d{1,2}:\d{2}(?::\d{2})?(?:\s?[APap][Mm])?)\]?\s*[-–]?\s*([^:]{1,40}):\s(.*)$/;
  const gen = /^\[?(\d{1,2}:\d{2}(?::\d{2})?(?:[.,]\d+)?)?\]?\s*[-–]?\s*\(?(\d{1,2}:\d{2}(?::\d{2})?)?\)?\s*([A-Za-z\u0600-\u06FF\u0900-\u097F][^:\n]{0,32}?)\s*[:：]\s*(.+)$/;
  const out = [];
  for(const l0 of lines){
    const l = l0.trim(); if(!l) continue;
    let m = l.match(wa);
    if(m){ out.push({speaker:m[3].trim(), text:m[4], seconds:null, stamp:m[1]+" "+m[2]}); continue; }
    m = l.match(gen);
    if(m && !/^https?$/i.test(m[3])){ out.push({speaker:m[3].trim(), text:m[4], seconds:tsToSec(m[1]||m[2])}); continue; }
    if(out.length) out[out.length-1].text += " " + l;
    else out.push({speaker:"", text:l, seconds:null});
  }
  if(out.length === 1 && !out[0].speaker){
    return raw.split(/\n\s*\n/).map((p,i) => ({speaker: i%2 ? "Speaker 2" : "Speaker 1", text:p.replace(/\s+/g," ").trim(), seconds:null}));
  }
  return out;
}
function assignRoles(turns, intake){
  const advFirst = ((intake && intake.advisorName) || "").toLowerCase().split(" ")[0];
  const cusFirst = ((intake && intake.customerName) || "").toLowerCase().split(" ")[0];
  const labels = [...new Set(turns.map(t => t.speaker))];
  const isAdv = l => /agent|advisor|adviser|\brep\b|associate|consultant|executive|support|insurancemarket|creditmarket|holidaymarket|alfred|speaker[ _]?0\b|^0$|^spk_0$|^a$/i.test(l) || (advFirst && l.toLowerCase().startsWith(advFirst));
  const isCus = l => /customer|client|caller|user|visitor|speaker[ _]?1\b|^1$|^spk_1$|^b$/i.test(l) || (cusFirst && l.toLowerCase().startsWith(cusFirst));
  let advL = labels.find(isAdv), cusL = labels.find(l => isCus(l) && l !== advL);
  if(!advL) advL = labels.find(l => l !== cusL) || labels[0];
  if(!cusL) cusL = labels.find(l => l !== advL);
  return turns.map(t => ({
    speaker: t.speaker || (t.role === "advisor" ? "Advisor" : "Customer"),
    role: t.speaker === advL ? "advisor" : t.speaker === cusL ? "customer" : "other",
    text: t.text.trim(), translatedText:"", lang: detectLang(t.text),
    seconds: t.seconds ?? null, timestamp: t.seconds != null ? secToTs(t.seconds) : (t.stamp || ""),
    sentiment:"", hasBreach:false, breachReason:"", isTurningPoint:false, isRepeatRequest:false

}

/* ---------- language detection ---------- */
function detectLang(s){
  s = String(s || "");
  const ar = (s.match(/[\u0600-\u06FF]/g) || []).length;
  if(ar > 3) return /[ٹڈڑںےۓھ]/.test(s) ? "Urdu" : "Arabic";
  if((s.match(/[\u0900-\u097F]/g) || []).length > 3) return "Hindi";
  const w = s.toLowerCase();
  const tl = (w.match(/\b(po|opo|salamat|ang|ng|mga|kayo|naman|lang|ito|hindi|ako|ninyo|sige)\b/g) || []).length;
  if(tl >= 3) return "Tagalog";
  const hi = (w.match(/\b(hai|nahi|nahin|kya|aap|kar|haan|theek|bhai|mujhe|kyun|accha|achha|ji|hum|aapka)\b/g) || []).length;
  if(hi >= 3) return "Hindi/Urdu (romanised)";
  return "English";
}
function dialogueLanguage(turns){
  const c = {}; for(const t of turns) if(t.lang && t.lang !== "English") c[t.lang] = (c[t.lang]||0) + 1;
  const top = Object.entries(c).sort((a,b) => b[1]-a[1])[0];
  if(!top) return "English";
  return top[1] * 2 >= turns.length ? top[0] : `English with ${top[0]}`;
}
const isRTL = l => l === "Arabic" || l === "Urdu";

/* ---------- translation (Claude) ---------- */
async function translateTurns(turns, onProgress, signal, all){
  const idx = turns.map((t,i) => i).filter(i => all || turns[i].lang !== "English");
  if(!idx.length) return 0;
  let done = 0;
  for(let k = 0; k < idx.length; k += 40){
    const chunk = idx.slice(k, k+40);
    const list = chunk.map(i => `[${i}] ${turns[i].text}`).join("\n");
    const res = await sampleFn.json(
`Translate each numbered utterance from a UAE customer-service interaction into clear, faithful English. Keep names, numbers, currency (AED, dirhams) and product terms exactly. Do not summarise or soften. If an utterance is already English, return it unchanged.
Reply with ONLY JSON: {"language": "<main source language>", "items": [{"i": <number>, "en": "<English>"}]}

${list}`, {signal, modelTier:"default"});
    for(const it of (res && res.items) || []){ const n = Number(it.i); if(turns[n] && typeof it.en === "string") turns[n].translatedText = it.en; }

${params.map(p => `- ${p.key} | ${p.label} | weight ${p.weight}% | ${p.check || ""}

${kbText || "No SOP documents loaded. Use general UAE insurance / lending / travel good practice and say so in rationales."}

"scores":{${params.map(p => `"${p.key}":0`).join(",")}},
"scoresRationales":{${params.map(p => `"${p.key}":""`).join(",")}},

function computeWPM(d){

  if(!(mins > 0) && secs.length > 2) mins = (Math.max(...secs) - Math.min(...secs)) / 60;
  if(!(mins > 0)) return null;
  return Math.round(words / mins);
}

function normaliseResult(r, d, engine){

  const ctl = new AbortController();
  Object.assign(ai, {running:true, ctl, started:Date.now(), error:null, stage:"Preparing"});
  render();
  const tick = setInterval(() => { const el = $("#aiElapsed"); if(el) el.textContent = Math.round((Date.now()-ai.started)/1000) + "s"; const st = $("#aiStage"); if(st) st.textContent = ai.stage; }, 1000);
  try{
    if(d.turns.some(t => t.lang !== "English" && !t.translatedText)){
      ai.stage = "Translating";
      await translateTurns(d.turns, (n,m) => { ai.stage = `Translating ${n}/${m} turns`; }, ctl.signal);
      d.translatedAt = Date.now();
    }

    logAction("ai_evaluation", `AI evaluated ${d.turns.length} turns (${venture(d.intake.ventureId).code} ${d.intake.lob})`, d.id);
  }catch(e){
    const c = e && e.code;
    if(c === "cancelled") toast("Evaluation stopped.");
    else if(c === "not_granted"){ state.caps.sample = false; sampleFn = null; runFallbackEval("AI access wasn't allowed, so the fallback engine scored this."); }
    else if(c === "rate_limited") runFallbackEval("AI is rate-limited right now, so the fallback engine scored this.");
    else if(c === "invalid_json") ai.error = "The AI reply couldn't be read as structured data. Run it again, or score with the fallback engine.";
    else if(c === "prompt_too_large") ai.error = "This interaction is too long for one AI pass. Trim the transcript to the relevant part, or use the fallback engine.";
    else ai.error = "The AI evaluation failed" + (e && e.message ? ": " + e.message : "") + ". Run it again, or score with the fallback engine.";

  }

function sentimentChart(turns, journey){
  const pts = turns.map((t,ix) => ({ix, v: SENT_VAL[t.sentiment] ?? null, t})).filter(p => p.v !== null);
  if(pts.length < 2) return `<p class="hint">Not enough sentiment points to chart.</p>`;
  const W = 640, H = 170, L = 78, R = 12, Tp = 10, B = 24, n = turns.length - 1 || 1;
  const x = ix => L + (W-L-R) * ix / n, y = v => Tp + (H-Tp-B) * (3 - v) / 6;
  const path = pts.map((p,k) => `${k ? "L" : "M"}${x(p.ix).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
  const tp = journey && journey.turn !== null && journey.turn !== undefined ? journey.turn : null;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Customer sentiment by turn, from ${esc(journey.initial)} to ${esc(journey.final)}">
    <g class="grid">${SENTIMENTS.map(s => `<line x1="${L}" x2="${W-R}" y1="${y(SENT_VAL[s])}" y2="${y(SENT_VAL[s])}"/><text x="${L-6}" y="${y(SENT_VAL[s])+4}" text-anchor="end">${s}</text>`).join("")}</g>
    <path d="${path}" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map(p => `<circle cx="${x(p.ix)}" cy="${y(p.v)}" r="${p.ix === tp ? 6 : 3}" fill="${p.ix === tp ? "var(--green)" : "var(--brand)"}"><title>Turn ${p.ix}: ${esc(p.t.sentiment)}</title></circle>`).join("")}

/* =====================================================================
   Charts (inline SVG)
   ===================================================================== */
function hbars(items, o){
  o = o || {}; if(!items.length) return `<p class="hint">No data yet.</p>`;
  const max = o.max || Math.max(...items.map(x => x.value || 0), 1), W = 560, row = 26, L = o.labelW || 150, H = items.length * row + 6;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria || "Bar chart")}">
    ${o.mark ? `<line x1="${L + (W-L-50)*o.mark/max}" x2="${L + (W-L-50)*o.mark/max}" y1="0" y2="${H}" stroke="var(--ink)" stroke-dasharray="3 3"/>` : ""}
    ${items.map((x,k) => { const w = Math.max(0, (W-L-50) * (x.value||0) / max); return `<text x="${L-8}" y="${k*row+17}" text-anchor="end" class="lbl">${esc(String(x.label).slice(0,24))}</text>
      <rect x="${L}" y="${k*row+5}" width="${w}" height="16" rx="3" fill="${x.color || "var(--brand)"}"/>
      <text x="${L+w+6}" y="${k*row+17}">${x.value === null || x.value === undefined ? "–" : esc(x.text ?? x.value)}${o.suffix || ""}</text>`; }).join("")}
  </svg>`;
}
function columns(items, o){
  o = o || {}; if(!items.length || items.every(x => !x.value)) return `<p class="hint">No data yet.</p>`;
  const W = 560, H = 180, B = 26, T = 14, max = Math.max(...items.map(x => x.value), 1), bw = (W - 20) / items.length;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria || "Column chart")}">
    ${items.map((x,k) => { const h = (H-B-T) * x.value / max; return `<rect x="${10 + k*bw + 3}" y="${H-B-h}" width="${bw-6}" height="${h}" rx="3" fill="${x.color || "var(--brand)"}"/>
      <text x="${10 + k*bw + bw/2}" y="${H-B-h-4}" text-anchor="middle" class="lbl">${x.value || ""}</text>
      <text x="${10 + k*bw + bw/2}" y="${H-8}" text-anchor="middle">${esc(x.label)}</text>`; }).join("")}
  </svg>`;
}
function lines(labels, series, o){
  o = o || {}; if(labels.length < 2) return `<p class="hint">Needs at least two periods of data.</p>`;
  const W = 900, H = 230, L = 36, R = 14, T = 14, B = 26;
  const vals = series.flatMap(s => s.values).filter(v => v !== null && v !== undefined);
  const min = o.min ?? Math.min(...vals, 0), max = o.max ?? Math.max(...vals, 100);
  const x = k => L + (W-L-R) * k / (labels.length - 1), y = v => T + (H-T-B) * (1 - (v-min)/((max-min)||1));
  const ticks = [min, (min+max)/2, max];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria || "Trend")}">
    <g class="grid">${ticks.map(t => `<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${Math.round(t)}</text>`).join("")}</g>
    ${o.mark !== undefined ? `<line x1="${L}" x2="${W-R}" y1="${y(o.mark)}" y2="${y(o.mark)}" stroke="var(--ink)" stroke-dasharray="4 3"/><text x="${L+6}" y="${y(o.mark)-5}" class="lbl">${o.mark}% benchmark</text>` : ""}
    ${labels.map((l,k) => (labels.length <= 12 || k % Math.ceil(labels.length/12) === 0) ? `<text x="${x(k)}" y="${H-8}" text-anchor="middle">${esc(l)}</text>` : "").join("")}
    ${series.map(s => { let d = "", pen = false; s.values.forEach((v,k) => { if(v === null || v === undefined){ pen = false; return; } d += `${pen ? "L" : "M"}${x(k).toFixed(1)},${y(v).toFixed(1)} `; pen = true; });
      return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5" ${s.dash ? 'stroke-dasharray="6 4"' : ""}/>${s.values.map((v,k) => v === null || v === undefined ? "" : `<circle cx="${x(k)}" cy="${y(v)}" r="3" fill="${s.color}"><title>${esc(s.name)} ${esc(labels[k])}: ${v}</title></circle>`).join("")}`; }).join("")}
  </svg>
  <div class="row" style="margin-top:6px">${series.map(s => `<span class="hint"><span class="dot" style="background:${s.color}"></span>${esc(s.name)}</span>`).join("")}</div>`;
}

/* ---------- metric helpers ---------- */
const SUBMITTED = ["pending_review","confirmed","published"];
const NEG_SENT = ["Negative","Frustrated","Dissatisfied","Anxious"];
function submitted(list){ return list.filter(e => SUBMITTED.includes(e.status)); }
function isPass(e){ return !e.hasFatalError && e.totalScore >= (e.benchmark ?? venture(e.ventureId).benchmarkPassingScore); }
function metrics(list){
  const n = list.length, nf = list.filter(e => !e.hasFatalError);
  return {
    n, avg: n ? round1(avg(list.map(e => e.totalScore))) : null,
    pass: pct(list.filter(isPass).length, n), fatal: list.filter(e => e.hasFatalError).length,
    breachRate: pct(list.filter(e => (e.policyBreaches||[]).length).length, n),
    dissat: pct(list.filter(e => e.sentimentJourney && NEG_SENT.includes(e.sentimentJourney.final)).length, n),
    aht: (() => { const d = list.map(e => parseFloat(e.durationMin)).filter(x => x > 0); return d.length ? round1(avg(d)) : null; })(),
    avgExFatal: nf.length ? round1(avg(nf.map(e => e.totalScore))) : null
  };
}
function bandColor(score, bench){ if(score === null) return "var(--chart2)"; return score >= bench ? "var(--green)" : score >= S().bands.amber ? "var(--amber)" : "var(--red)"; }
function healthBadge(m, bench){
  if(m.avg === null) return `<span class="band none">No audits</span>`;
  const b = m.fatal ? "Red" : m.avg >= bench ? "Green" : m.avg >= S().bands.amber ? "Amber" : "Red";
  return `<span class="band ${b}">${b}${m.fatal ? " · fatal on record" : ""}</span>`;
}
function dateRange(ui){
  const now = new Date(), r = ui.range || "mtd";
  if(r === "7d") return [Date.now() - 7*864e5, Infinity];
  if(r === "mtd") return [new Date(now.getFullYear(), now.getMonth(), 1).getTime(), Infinity];
  if(r === "qtd") return [new Date(now.getFullYear(), Math.floor(now.getMonth()/3)*3, 1).getTime(), Infinity];
  if(r === "custom") return [ui.from ? new Date(ui.from).getTime() : 0, ui.to ? new Date(ui.to).getTime() + 864e5 : Infinity];
  return [0, Infinity];
}
const evalDate = e => e.interactionDate || e.createdAt;
function rangeControls(ui, key){
  return `<label class="f">Date range<select data-ui="${key}.range" data-rr>${optKV([["7d","Last 7 days"],["mtd","Month to date"],["qtd","Quarter to date"],["all","All time"],["custom","Custom"]], ui.range || "mtd")}</select></label>
  ${ui.range === "custom" ? `<label class="f">From<input type="date" data-ui="${key}.from" data-rr value="${esc(ui.from||"")}"></label><label class="f">To<input type="date" data-ui="${key}.to" data-rr value="${esc(ui.to||"")}"></label>` : ""}`;
}
function evalRow(e, extra){
  return `<tr class="click" data-open="${esc(e.id)}" tabindex="0"><td><span class="dot" style="background:${esc(venture(e.ventureId).color)}"></span>${esc(e.callId)}</td><td>${fmtDate(evalDate(e))}</td><td>${esc(e.advisorName||"–")}</td><td>${esc(e.lob)}</td><td>${esc(e.channel)}</td>

/* ---------- Tab 6: Recurring staff feedback ---------- */
function recurringCases(){
  const win = S().recurring.windowDays * 864e5, now = Date.now();
  const list = submitted(scopedEvals()).filter(e => now - evalDate(e) <= win && e.advisorId);
  const map = {};
  const add = (e, cat) => { const k = e.advisorId + "||" + cat; (map[k] = map[k] || {advisorId:e.advisorId, advisorName:e.advisorName, ventureId:e.ventureId, lob:e.lob, category:cat, evals:[]}).evals.push(e); };
  for(const e of list){
    for(const t of S().trainingThemes){ if(t.pillar === "fatal") continue; if(e.scores && e.scores[t.pillar] !== undefined && e.scores[t.pillar] < t.threshold) add(e, `Low ${pillarLabel(t.pillar)}`); }
    for(const b of e.policyBreaches || []) add(e, `SOP: ${b.ruleTitle}`);
    if(e.hasFatalError) add(e, `Fatal ${e.fatalErrorCode}: ${(S().taxonomy.fatalErrors.find(f => f.code === e.fatalErrorCode) || {}).name || ""}`);
  }
  return Object.values(map).map(c => ({...c, evals:[...new Map(c.evals.map(e => [e.id, e])).values()]})).filter(c => c.evals.length >= 2).sort((a,b) => b.evals.length - a.evals.length);
}

async function addBatchFiles(files){
  const arr = [...files], base = n => n.replace(/\.[^.]+$/,"").toLowerCase();
  const audios = arr.filter(f => /^(audio|video)\//.test(f.type) || /\.(mp3|wav|m4a|mp4|webm|ogg)$/i.test(f.name));
  for(const f of arr.filter(f => !audios.includes(f))){
    if(f.size > 2e6){ toast(`${f.name} is over 2 MB and was skipped.`); continue; }
    const text = await f.text();
    if(/\.csv$/i.test(f.name) && /transcript/i.test(text.split("\n")[0])){
      const rows = parseCSV(text); const hdr = rows[0].map(x => x.toLowerCase()); const ti = hdr.findIndex(x => x.includes("transcript")); const ii = hdr.findIndex(x => /id|reference/.test(x));
      rows.slice(1).forEach((r,k) => { if(r[ti]) batch.items.push({name: (ii >= 0 && r[ii]) || `${f.name} row ${k+2}`, text:r[ti], status:"queued", stage:"Queued", verified:true}); });
      continue;
    }
    const audio = audios.find(a => base(a.name) === base(f.name));
    batch.items.push({name:f.name, text, audio, status:"queued", stage:"Queued", verified:true});
  }
  for(const a of audios) if(!batch.items.some(x => x.audio === a)) batch.items.push({name:a.name, audio:a, status:"error", stage:"Diarizing", error:"No matching transcript file, so this recording can't be scored."});
  render();
}
async function runBatch(){
  batch.running = true; batch.stop = false; render();
  const v = venture(batch.ventureId);
  const queue = batch.items.filter(x => x.status === "queued");
  const worker = async () => {
    while(queue.length && !batch.stop){
      const x = queue.shift(); x.status = "running";
      try{
        const d = newDraft();
        Object.assign(d.intake, {ventureId:batch.ventureId, lob:batch.lob, channel:batch.channel, natureOfEvaluation:batch.category, transcript:x.text, reference: x.name.replace(/\.[^.]+$/,"")});
        x.stage = "Diarizing"; render();
        d.turns = parseDialogue(x.text, d.intake); d.language = dialogueLanguage(d.turns);
        if(!d.turns.length) throw new Error("No dialogue found in the file.");
        if(sampleFn && d.turns.some(t => t.lang !== "English")){ x.stage = "Translating"; render(); await translateTurns(d.turns, null); }
        x.stage = "Scoring"; render();
        let raw, engine = "fallback";
        if(sampleFn){ try{ raw = await sampleFn.json(buildEvalPrompt(d), {modelTier:"default", cache:false}); engine = "claude"; }catch(e){ if(e && (e.code === "not_granted")){ sampleFn = null; } raw = null; } }
        if(!raw){ raw = fallbackEvaluate(d); engine = "fallback"; }
        x.stage = "Policy check"; render();
        const res = normaliseResult(raw, d, engine);
        const match = state.data.advisors.find(a => a.ventureId === v.id && res.advisorName && a.name.toLowerCase().split(" ")[0] === res.advisorName.toLowerCase().split(" ")[0]);
        if(match) applyAdvisor(d, match.id); else d.intake.advisorName = res.advisorName;
        d.warnings = validateResult(res, d); if(engine === "fallback") d.warnings.unshift("Fallback engine result. Validate by hand.");
        d.result = res; d.engine = engine; d.raw = JSON.stringify(raw); d.aiScores = clone(res.scores);
        d.baseline = clone({scores:res.scores, hasFatalError:res.hasFatalError, fatalErrorCode:res.fatalErrorCode});
        if(x.audio){ const up = await uploadAudio(x.audio); d.audio = up.ok ? {name:x.audio.name, assetId:up.id, url:up.url, stored:true} : {name:x.audio.name, url:URL.createObjectURL(x.audio), note:up.reason}; }
        const t = computeTotal(res.scores, res.hasFatalError);

        x.stage = "Complete"; x.status = "done";
      }catch(e){ x.status = "error"; x.error = (e && e.message) || "Evaluation failed."; }
      render();
    }
  };
  await Promise.all([worker(), worker()]);

  const done = batch.items.filter(x => x.status === "done" && !x.saved && x.d);
  const n = Math.max(1, Math.round(done.length * 0.1));
  done.forEach(x => x.d.spotCheck = false);
  [...done].sort(() => Math.random() - 0.5).slice(0, n).forEach(x => x.d.spotCheck = true);
  for(const x of done){ const r = x.d.result; const t = computeTotal(r.scores, r.hasFatalError); x.route = (r.hasFatalError || t < v.benchmarkPassingScore || x.d.spotCheck) ? "pending_review" : "confirmed"; if(!x.d.intake.advisorId) x.route = "draft"; x.routeLabel = x.route === "draft" ? "Draft (no advisor match)" : x.d.spotCheck && x.route === "pending_review" && x.pass ? "Review queue (spot check)" : STATUS_LABEL[x.route]; }
  batch.running = false; render();
  logAction("batch_evaluation", `Batch of ${done.length} evaluated (${v.code} ${batch.lob})`);
}
async function saveBatch(){

function toCSV(objs){
  if(!objs.length) return "";
  const cols = Object.keys(objs[0]);
  const cell = v => { const s = v === null || v === undefined ? "" : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  return [cols.map(cell).join(","), ...objs.map(o => cols.map(c => cell(o[c])).join(","))].join("\n");
}
function exportXLSX(objs, name, extraSheets){
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.json_to_sheet(objs);
  ws["!cols"] = Object.keys(objs[0] || {}).map(k => ({wch: Math.min(40, Math.max(10, k.length + 2))}));
  ws["!autofilter"] = {ref: ws["!ref"]};
  XLSX.utils.book_append_sheet(wb, ws, "Evaluations");
  for(const [n, rows] of (extraSheets || [])) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), n);
  const buf = XLSX.write(wb, {type:"array", bookType:"xlsx"});
  saveFile(name, new Blob([buf], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
}
function parseCSV(text){
  const rows = []; let row = [], cur = "", q = false;
  text = text.replace(/^\uFEFF/, "");
  for(let k = 0; k < text.length; k++){
    const c = text[k];
    if(q){ if(c === '"'){ if(text[k+1] === '"'){ cur += '"'; k++; } else q = false; } else cur += c; }
    else if(c === '"') q = true;
    else if(c === ","){ row.push(cur); cur = ""; }
    else if(c === "\n" || c === "\r"){ if(c === "\r" && text[k+1] === "\n") k++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += c;
  }
  if(cur || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
async function readTable(file){
  if(/\.(xlsx|xls)$/i.test(file.name)){
    if(!window.XLSX) throw new Error("The Excel reader didn't load. Save the sheet as CSV and upload that.");
    const wb = XLSX.read(await file.arrayBuffer(), {type:"array"});
    return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:false, defval:""}).filter(r => r.some(x => String(x).trim()));
  }
  return parseCSV(await file.text());
}

async function selfTest(){
  const out = [];

    case "rubAdd": state.ui.rub.draft.push({key:"custom_" + uid8().slice(0,5), label:"New parameter", weight:0, isEnabled:true, canonical:false, aliases:[], check:"", criteria:{}}); render(); break;
    case "rubReset": state.ui.rub.draft = null; render(); break;
    case "rubSave": { const before = S().rubric.map(x => `${x.key}:${x.weight}`).join(","); S().rubric = normaliseRubricDraft(state.ui.rub.draft); try{ await Store.saveSettings(S()); logAction("rubric_updated", `${before} → ${S().rubric.map(x => `${x.key}:${x.weight}`).join(",")}`); state.ui.rub.draft = null; toast("Rubric saved."); }catch(e){ toast("Couldn't save the rubric."); } render(); break; }
    case "rubPropose": { const doc = {id:"prop-" + uid8(), rubric:normaliseRubricDraft(state.ui.rub.draft), note:state.ui.rub.note || "", status:"Open", createdAt:Date.now(), createdBy:state.uid}; await Store.put("proposals", doc); logAction("rubric_proposed", doc.note || "Rubric change proposed", doc.id); state.ui.rub = {}; toast("Proposal sent to admins."); render(); break; }
    /* advisors */
    case "advNew": state.ui.adv.edit = {ventureId: state.scope !== "all" ? state.scope : activeVentures()[0].id, lob: (state.scope !== "all" ? venture(state.scope) : activeVentures()[0]).lobs[0], active:true}; render(); break;
    case "advCancel": state.ui.adv.edit = null; render(); break;
    case "advCloseProfile": state.ui.adv.profile = null; render(); break;
    case "advSave": { const ed = state.ui.adv.edit; if(!ed.name || !ed.name.trim()){ toast("Enter the advisor's name."); break; } if(ed.email && !/^\S+@\S+\.\S+$/.test(ed.email)){ toast("That email address doesn't look right."); break; }
      const doc = {...ed, id: ed.id || "adv-" + uid8(), name:ed.name.trim(), active: ed.active !== false, createdAt: ed.createdAt || Date.now(), updatedAt:Date.now()};
      await Store.put("advisors", doc); logAction(ed.id ? "advisor_updated" : "advisor_created", `${doc.name} (${venture(doc.ventureId).code} ${doc.lob})`, doc.id); state.ui.adv.edit = null; toast("Advisor saved."); render(); break; }
    case "advImportCommit": { const p = state.ui.adv.importPreview; for(const r of p.rows) await Store.put("advisors", r); logAction("advisors_imported", `${p.rows.length} advisors`); toast(`${p.rows.length} advisors imported.`); state.ui.adv.importPreview = null; render(); break; }
    case "advImportCancel": state.ui.adv.importPreview = null; render(); break;
    case "advTemplate": saveFile("advisor-template.csv", "Name,Email,Venture,LOB,Team,Manager,Manager Email\n"); break;
    /* bulk */
    case "bulkTemplate": saveFile("qa-legacy-import-template.csv", BULK_COLS.join(",") + "\n"); break;
    case "bulkTest": commitBulk(5); break;
    case "bulkCommit": if(await askConfirm(`Import ${state.ui.bulk.preview.valid.length} evaluations?`, "", "Import")) commitBulk(); break;
    case "bulkCancel": state.ui.bulk.preview = null; render(); break;
    /* logs */
    case "logsReload": state.ui.logs.loaded = false; render(); break;
    /* admin */
    case "aclSave": { const acl = state.ui.admin.acl; try{ await Store.saveAcl(acl); state.acl = clone(acl); logAction("access_updated", `Roles: ${Object.entries(acl.roles).map(([k,v]) => `${who(k)}=${v}`).join(", ")}`); toast("Access saved."); }catch(e){ toast(e && e.code === "invalid_argument" ? "Only the portal owner can change roles." : "Couldn't save access changes."); } render(); break; }
    case "aclReset": state.ui.admin = {}; render(); break;
    /* config */
    case "cfgAddTrig": state.ui.cfg.s.taxonomy.triggerWords.push({word:"", risk:"", source:"Customer"}); render(); break;
    case "cfgAddFatal": state.ui.cfg.s.taxonomy.fatalErrors.push({code:"F" + (state.ui.cfg.s.taxonomy.fatalErrors.length+1), name:"", description:"", escalation:""}); render(); break;
    case "cfgReset": state.ui.cfg = {}; render(); break;
    case "cfgSave": { const s = state.ui.cfg.s; s.taxonomy.triggerWords = s.taxonomy.triggerWords.filter(x => x.word.trim()); s.taxonomy.fatalErrors = s.taxonomy.fatalErrors.filter(x => x.code.trim() && x.name.trim());
      for(const v of s.ventures) if(!v.lobs.length){ toast(`${v.name} needs at least one LOB.`); return; }
      const bad = (s.notifications.alwaysNotify||[]).filter(x => !/^\S+@\S+\.\S+$/.test(x));
      if(bad.length){ toast(`Check these notification emails: ${bad.join(", ")}`); return; }
      const next = {...clone(S()), taxonomy:s.taxonomy, ventures:s.ventures, bands:s.bands, recurring:s.recurring, notifications:s.notifications};
      try{ await Store.saveSettings(next); state.settings = mergeSettings(next); logAction("config_updated", "Taxonomy, ventures or bands changed"); state.ui.cfg = {}; toast("Configuration saved."); }catch(e){ toast("Couldn't save the configuration."); } render(); break; }
    /* health */
    case "hSeeds": { const out = [];
      if(db){ const snap = await db.doc("settings/main").get().catch(() => null); if(snap && !snap.exists){ await Store.saveSettings(S()); out.push({ok:true, msg:"Settings were missing, so the defaults (ventures, rubric, taxonomy, triggers) were written."}); } else out.push({ok:true, msg:"Settings document exists."}); }
      for(const k of DEFAULT_SETTINGS.rubric.map(p => p.key)) if(!S().rubric.some(p => p.key === k)){ S().rubric.push({...clone(DEFAULT_SETTINGS.rubric.find(p => p.key === k)), isEnabled:false}); out.push({ok:false, msg:`Canonical parameter ${k} was missing; restored as disabled.`}); }
      if(!S().ventures.length){ S().ventures = clone(DEFAULT_SETTINGS.ventures); out.push({ok:false, msg:"No ventures; defaults restored."}); }
      if(out.some(x => !x.ok)) await Store.saveSettings(S());
      out.push({ok:true, msg:`${S().rubric.length} rubric parameters and ${S().ventures.length} ventures present.`});
      state.ui.health.results = out; render(); break; }
    case "hCache": try{ localStorage.removeItem("alfred-qa-scope"); }catch(e){} state.ui = {health:{results:[{ok:true, msg: state.mode === "local" ? "Session preferences cleared. Your records stay in this browser." : "Session preferences cleared. Database records are untouched."}]}}; batch.items = []; render(); break;
    case "hSelfTest": state.ui.health.results = [{ok:true, msg:"Running…"}]; render(); selfTest(); break;
  }
});

document.addEventListener("keydown", ev => {
  if(ev.key === "Enter" && ev.target.matches("tr.click")) ev.target.click();
  if(ev.key === "Escape" && $("#modalHost").innerHTML) closeModal();
  if(ev.key === "Enter" && ev.target.id === "delReason"){ const b = $("[data-act=deleteEvalConfirm]"); if(b) b.click(); }
});

document.addEventListener("input", ev => {
  const t = ev.target, ds = t.dataset, d = D();
  const val = t.type === "checkbox" ? t.checked : t.value;
  if(ds.bind && d){
    setPath(d, ds.bind, val);
    if(ds.turnsReset !== undefined){ if(!d.result) d.turns = []; const wc = $("#wc"); if(wc) wc.textContent = t.value.split(/\s+/).filter(Boolean).length + " words"; }
    if(ds.rat){ const k = ds.rat; $("#nq-" + k).classList.toggle("on", d.result.scores[k] < 7 && !hasQuote(t.value)); }
    return;
  }
  if(ds.score && d && d.result){
    const k = ds.score; let n = parseFloat(t.value); if(!isFinite(n)) return;
    n = clamp(Math.round(n*2)/2, 1, 10); d.result.scores[k] = n;
    $$(`[data-score="${k}"]`).forEach(x => { if(x !== t) x.value = n; });
    const changed = needsOverrideReason(d) && n !== d.baseline.scores[k];
    $("#ov-" + k).classList.toggle("on", changed);
    $("#was-" + k).textContent = changed ? `was ${d.baseline.scores[k]}` : "";
    $("#nq-" + k).classList.toggle("on", n < 7 && !hasQuote(d.result.rationales[k]));
    refreshLedger(); return;
  }
  if(ds.ovr && d){ d.ovr[ds.ovr] = d.ovr[ds.ovr] || {}; d.ovr[ds.ovr][ds.k] = t.value; return; }
  if(ds.ui){
    setPath(state.ui, ds.ui, val);
    if(ds.rr !== undefined && t.tagName === "INPUT" && (t.type === "text" || t.type === "number")) rerenderKeepFocus(`[data-ui="${ds.ui}"]`);
    return;
  }
  if(ds.rub !== undefined && t.type !== "checkbox"){ const p = state.ui.rub.draft[+ds.rub]; if(ds.k.startsWith("criteria.")){ p.criteria = p.criteria || {}; p.criteria[ds.k.slice(9)] = val; } else p[ds.k] = ds.k === "weight" ? Number(val)||0 : val;
    if(ds.k === "weight"){ const sum = state.ui.rub.draft.filter(x => x.isEnabled !== false).reduce((a,x) => a + (Number(x.weight)||0), 0); const m = $("#rubSum"); if(m){ m.className = sum === 100 ? "ok" : "err"; m.textContent = `Enabled weights total ${sum}%${sum === 100 ? "." : ". They must total exactly 100% to save."}`; } $$("[data-act=rubSave],[data-act=rubPropose]").forEach(x => x.disabled = sum !== 100); }
    return; }
  if(ds.theme !== undefined){ const th = S().trainingThemes[+ds.theme]; th[ds.k] = ds.k === "threshold" ? Number(val)||0 : val; return; }
  if(ds.cfglist){ state.ui.cfg.s.taxonomy[ds.cfglist] = t.value.split("\n").map(s => s.trim()).filter(Boolean); return; }
  if(ds.cfgtrig !== undefined){ state.ui.cfg.s.taxonomy.triggerWords[+ds.cfgtrig][ds.k] = val; return; }
  if(ds.cfgfatal !== undefined){ state.ui.cfg.s.taxonomy.fatalErrors[+ds.cfgfatal][ds.k] = val; return; }
  if(ds.cfgv !== undefined && t.type !== "checkbox"){ const v = state.ui.cfg.s.ventures[+ds.cfgv]; v[ds.k] = ds.k === "lobs" ? val.split(",").map(s => s.trim()).filter(Boolean) : ds.k === "benchmarkPassingScore" ? Number(val)||0 : val; return; }
  if(ds.cfgnotify === "alwaysNotify"){ state.ui.cfg.s.notifications.alwaysNotify = t.value.split(/[,;\s]+/).map(x => x.trim()).filter(Boolean); return; }
  if(ds.cfgnotify === "onEveryPublish" || ds.cfgnotify === "autoSendOnConfirm"){ state.ui.cfg.s.notifications[ds.cfgnotify] = t.checked; return; }
  if(ds.cfgb){ state.ui.cfg.s.bands[ds.cfgb] = Number(val)||0; return; }
  if(ds.cfgr){ state.ui.cfg.s.recurring[ds.cfgr] = Number(val)||0; return; }
});

document.addEventListener("change", async ev => {
  const t = ev.target, ds = t.dataset, d = D();
  if(t.id === "scope"){ setScope(t.value); return; }
  if(ds.act === "toggleEN"){ d.showEN = t.checked; render(); return; }
  if(ds.actChange === "advisor"){ applyAdvisor(d, t.value); if(!t.value){ Object.assign(d.intake, {advisorName:"", advisorEmail:"", managerName:"", managerEmail:"", team:""}); } render(); return; }
  if(ds.actChange === "fatal"){ d.result.hasFatalError = t.checked; if(t.checked && !d.result.fatalErrorCode) d.result.fatalErrorCode = S().taxonomy.fatalErrors[0].code; d.result.coaching = triggersFor(d.result.scores, t.checked).map(x => x.key); render(); return; }
  if(ds.bind && d && ds.rr !== undefined){
    if(ds.bind === "intake.ventureId"){ const v = venture(t.value); d.intake.lob = v.lobs[0]; d.intake.advisorId = ""; }
    render(); return;
  }
  if(ds.coach && d){ const s = new Set(d.result.coaching || []); t.checked ? s.add(ds.coach) : s.delete(ds.coach); d.result.coaching = [...s]; return; }
  if(ds.ui && ds.rr !== undefined && (t.tagName === "SELECT" || t.type === "date")){ render(); return; }
  if(ds.ui && t.type === "checkbox"){ setPath(state.ui, ds.ui, t.checked); return; }
  if(ds.rub !== undefined && ds.k === "isEnabled"){ state.ui.rub.draft[+ds.rub].isEnabled = t.checked; render(); return; }
  if(ds.cfgv !== undefined && t.type === "checkbox"){ state.ui.cfg.s.ventures[+ds.cfgv].isActive = t.checked; return; }
  if(ds.batch){ batch[ds.batch] = t.value; if(ds.batch === "ventureId") batch.lob = venture(t.value).lobs[0]; render(); return; }
  if(ds.bverify !== undefined){ batch.items[+ds.bverify].verified = t.checked; render(); return; }
  if(ds.pubsel){ state.ui.pub.sel[ds.pubsel] = t.checked; if(t.checked) state.ui.pub.preview = ds.pubsel; render(); return; }
  if(ds.insstatus){ const x = state.data.insights.find(i => i.id === ds.insstatus); if(x){ await Store.put("insights", {...x, status:t.value, updatedAt:Date.now()}); toast(`Finding marked ${t.value.toLowerCase()}.`); } return; }
  if(ds.coachstatus){ const x = state.data.coaching.find(i => i.id === ds.coachstatus); if(x){ await Store.put("coaching", {...x, status:t.value, updatedAt:Date.now(), updatedBy:state.uid}); logAction("coaching_status", `${x.advisorName}: ${x.module} → ${t.value}`, x.evaluationId); render(); } return; }
  if(ds.escalate){ if(!t.value) return; const doc = {id:ds.escalate, advisorId:ds.adv, advisorName:(advisor(ds.adv)||{}).name || "", category:ds.cat, count:Number(ds.n), level:t.value, status:"Open", createdAt:Date.now(), createdBy:state.uid}; await Store.put("escalations", doc); logAction("recurring_escalated", `${doc.advisorName}: ${doc.category} (${doc.count}x) → ${doc.level}`); toast(`Escalated to ${t.value}.`); render(); return; }
  if(ds.role){ state.ui.admin.acl.roles[ds.role] = t.value; return; }
  if(ds.lobacc){ const a = state.ui.admin.acl.lobAccess; const s = new Set(a[ds.lobacc] || []); t.checked ? s.add(ds.lob) : s.delete(ds.lob); a[ds.lobacc] = [...s]; return; }
  if(ds.perm){ const p = state.ui.admin.acl.perms; p[ds.perm] = p[ds.perm] || {}; p[ds.perm][ds.k] = t.checked; return; }
  /* files */
  const f = t.files && t.files[0];
  if(t.id === "audioIn" && f){
    if(d.audio && d.audio.url && d.audio.url.startsWith("blob:")) URL.revokeObjectURL(d.audio.url);
    d.audio = {name:f.name, url:URL.createObjectURL(f), uploading:true}; render();
    const up = await uploadAudio(f);
    if(state.draft !== d) return;
    d.audio.uploading = false;
    if(up.ok){ d.audio.assetId = up.id; d.audio.stored = true; } else d.audio.note = up.reason;
    if(!d.intake.durationMin){ const p = $("#player"); if(p && isFinite(p.duration)) d.intake.durationMin = String(round1(p.duration/60)); }
    render(); return;
  }
  if(t.id === "txIn" && f){
    if(f.size > 3e6){ toast("That file is over 3 MB. Trim it to the interaction first."); return; }
    if(/^(audio|video)\//.test(f.type)){ toast("That's a recording. Upload it under Audio + transcript, then add its transcript here."); return; }
    d.intake.transcript = await f.text(); d.turns = parseDialogue(d.intake.transcript, d.intake); d.language = dialogueLanguage(d.turns); d.result = d.result || null; render();
    toast(`${d.turns.length} turns read from ${f.name}.`); return;
  }
  if(t.id === "kbFile" && f){ state.ui.kb.edit.content = await f.text(); if(!state.ui.kb.edit.title) state.ui.kb.edit.title = f.name.replace(/\.[^.]+$/,""); render(); return; }
  if(t.id === "batchIn" && t.files.length){ addBatchFiles(t.files); return; }
  if(t.id === "advImport" && f){ try{ const rows = await readTable(f); if(rows.length < 2) throw new Error("The file has no data rows."); state.ui.adv.importPreview = mapAdvisorRows(rows); }catch(e){ toast(e.message || "Couldn't read that file."); } render(); return; }
  if(t.id === "bulkIn" && f){ try{ const rows = await readTable(f); if(rows.length < 2) throw new Error("The file has no data rows."); state.ui.bulk.preview = buildBulkPreview(rows); }catch(e){ toast(e.message || "Couldn't read that file."); } render(); return; }
});
document.addEventListener("dragover", ev => { const z = ev.target.closest && ev.target.closest("#drop"); if(z){ ev.preventDefault(); z.classList.add("over"); } });
document.addEventListener("dragleave", ev => { const z = ev.target.closest && ev.target.closest("#drop"); if(z) z.classList.remove("over"); });
document.addEventListener("drop", ev => { const z = ev.target.closest && ev.target.closest("#drop"); if(z){ ev.preventDefault(); z.classList.remove("over"); if(ev.dataTransfer.files.length) addBatchFiles(ev.dataTransfer.files); } });

/* =====================================================================
   Boot
   ===================================================================== */
async function boot(){
  localLoad();
  state.uid = "local-user"; state.names["local-user"] = "You";
  render();
  if(!window.claude || !window.claude.use) return;
  const use = n => claude.use(n).catch(() => null);
  const [dbc, u, s, dl, as, mc] = await Promise.all([use("db"), use("user"), use("sample"), use("downloads"), use("assets"), use("mcp")]);
  userCap = u; sampleFn = s; downloadsCap = dl; assetsCap = as; mcpCap = mc;
  Object.assign(state.caps, {db:!!dbc, user:!!u, sample:!!s, downloads:!!dl, assets:!!as, mcp:!!mc});
  if(u){ try{ state.uid = await u.id(); }catch(e){} try{ state.isOwner = await u.isOwner(); }catch(e){} }
  if(!dbc && !state.uid) state.uid = "local-user";
  if(dbc){
    db = dbc; state.mode = "shared";
    for(const c of COLLS) state.data[c] = [];
    const onErr = () => {};
    db.doc("settings/main").onSnapshot(sn => { if(sn.exists) state.settings = mergeSettings(sn.data()); state.settingsLoaded = true; softRenderSafe(); }, onErr);
    db.doc("acl/roles").onSnapshot(sn => { if(sn.exists){ const x = sn.data(); state.acl = {roles:x.roles||{}, lobAccess:x.lobAccess||{}, perms:x.perms||{}}; } softRenderSafe(); }, onErr);
    for(const c of COLLS){
      const q = c === "evaluations" ? db.collection(c).orderBy("createdAt","desc").limit(1000) : db.collection(c).limit(1000);
      q.onSnapshot(sn => { state.data[c] = sn.docs.map(x => x.data()); softRenderSafe(); }, e => { errorLog.unshift({at:Date.now(), msg:`${c} sync: ${e && e.code}`}); });
    }
    if(state.uid){
      try{ const me = await db.doc("members/" + state.uid).get(); await db.doc("members/" + state.uid).set({id:state.uid, joinedAt: me.exists ? me.data().joinedAt : Date.now(), lastActive:Date.now()}); }catch(e){}
      logAction("session_opened", "Opened the portal");
    }
  }
  render();
}
function softRenderSafe(){
  if(state.tab === "evaluate" || $("#modalHost").innerHTML){ renderNav(); return; }
  softRender();
}
boot();
</script>
