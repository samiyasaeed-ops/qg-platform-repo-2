<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alfred Care: Complaint case management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0F3; --plane:#F6F7F9; --card:#FFFFFF; --card-2:#F1F3F6; --ink:#151A22; --ink-2:#5A6475; --line:#D3D8E0; --line-2:#E5E8ED;
  --red:#C4202B; --red-soft:#F8DEDF; --amber:#995208; --amber-soft:#F6E6D1; --green:#13744A; --green-soft:#D7EEE2; --blue:#2554A3; --blue-soft:#DEE7F5;
  --rail:#151A22; --rail-ink:#AEB6C4; --focus:#2554A3;
  --font:"Public Sans","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1015; --plane:#11151B; --card:#181D25; --card-2:#1F252F; --ink:#E7EBF0; --ink-2:#95A0B0; --line:#2A313D; --line-2:#222833;
    --red:#EF4550; --red-soft:#3A161A; --amber:#E7A75F; --amber-soft:#382816; --green:#52BD8A; --green-soft:#142E21; --blue:#86AEEA; --blue-soft:#18273E;
    --rail:#090B0F; --rail-ink:#8792A3; --focus:#86AEEA; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1015; --plane:#11151B; --card:#181D25; --card-2:#1F252F; --ink:#E7EBF0; --ink-2:#95A0B0; --line:#2A313D; --line-2:#222833;
  --red:#EF4550; --red-soft:#3A161A; --amber:#E7A75F; --amber-soft:#382816; --green:#52BD8A; --green-soft:#142E21; --blue:#86AEEA; --blue-soft:#18273E;
  --rail:#090B0F; --rail-ink:#8792A3; --focus:#86AEEA; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;display:flex;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--blue)}
h1,h2,h3,h4{line-height:1.25}

/* icon rail */
.rail{width:68px;flex:none;background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px}
.rail .logo{width:36px;height:36px;border-radius:9px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:700;margin-bottom:10px;font-size:15px}
.rail button{width:56px;border:0;background:none;color:var(--rail-ink);border-radius:8px;padding:7px 0 5px;cursor:pointer;display:grid;justify-items:center;gap:2px;font-size:10.5px;font-weight:500}
.rail button svg{width:20px;height:20px}
.rail button:hover{color:#fff;background:rgba(255,255,255,.06)}
.rail button[aria-current="page"]{color:#fff;background:rgba(255,255,255,.1);box-shadow:inset 3px 0 0 var(--red)}
.rail .sp{flex:1}
.app{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--plane)}
.bar{display:flex;align-items:center;gap:14px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
.bar h1{font-size:17px;margin:0;margin-right:auto}
.bar h1 span{font-weight:500;color:var(--ink-2);margin-left:8px;font-size:13px}
.me{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2)}
.me img{width:26px;height:26px;border-radius:50%}
.banner{margin:10px 20px 0;padding:9px 14px;border-radius:8px;background:var(--amber-soft);color:var(--amber);font-size:14px;border:1px solid var(--amber)}
.view{flex:1;min-height:0;overflow:auto}
.page{padding:22px max(20px,calc((100% - 1080px)/2)) 80px}
.page > h2:first-child{font-size:24px;margin:0 0 4px;letter-spacing:-.01em}

/* controls */
.btn{border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:6px;cursor:pointer;font-weight:500;line-height:1.3;white-space:nowrap}
.btn:hover{background:var(--card-2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{filter:brightness(1.08);background:var(--red)}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.warn{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.link{border:0;background:none;padding:0 2px;color:var(--blue);text-decoration:underline;font-size:13px}
select,input[type=text],input[type=email],input[type=url],input[type=number],input[type=datetime-local],input[type=date],input[type=time],textarea{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical;min-height:76px;line-height:1.5}
label.f{display:grid;gap:4px;font-size:13px;color:var(--ink-2);font-weight:500}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stack{display:grid;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--ink-2)}
.sm{font-size:13px}
.req::after{content:" *";color:var(--red)}
.chk{display:flex;gap:9px;align-items:flex-start;cursor:pointer;font-size:14px}
.chk input{margin-top:4px;width:16px;height:16px;flex:none}

/* pills & flags */
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--card-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.pill.s-new{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.pill.s-routed_to_unit,.pill.s-unit_input_pending{color:var(--ink)}
.pill.s-evaluator_review{background:var(--red);color:#fff;border-color:var(--red)}
.pill.s-rework_requested{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.pill.s-rca_complete{background:var(--green-soft);color:var(--green);border-color:transparent}
.pill.s-resolved{background:none;color:var(--green);border-color:var(--green)}
.pill.s-closed_duplicate{background:none}
.flag{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:4px;background:var(--card-2);color:var(--ink-2)}
.flag.red{background:var(--red-soft);color:var(--red)}
.flag.amber{background:var(--amber-soft);color:var(--amber)}
.flag.blue{background:var(--blue-soft);color:var(--blue)}

/* now page */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:18px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;cursor:pointer}
.tile:hover{border-color:var(--ink-2)}
.tile b{display:block;font-size:28px;line-height:1.1}
.tile span{font-size:13px;color:var(--ink-2)}
.tile.hot b{color:var(--red)}
.cols{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px}
.card > h3{margin:0;padding:12px 16px;border-bottom:1px solid var(--line-2);font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card > .in{padding:12px 16px}
.bars{display:grid;gap:8px}
.bars div{display:grid;grid-template-columns:120px 1fr 28px;gap:8px;align-items:center;font-size:13px}
.bars i{display:block;height:8px;border-radius:4px;background:var(--red);min-width:2px}

/* cases workspace */
.work{display:grid;grid-template-columns:200px minmax(280px,360px) minmax(0,1fr);height:100%}
.queues{padding:14px 8px;border-right:1px solid var(--line);overflow:auto}
.queues h4{font-size:12px;color:var(--ink-2);margin:0 10px 6px;font-weight:600}
.qb{display:flex;justify-content:space-between;width:100%;border:0;background:none;padding:7px 10px;border-radius:6px;cursor:pointer;text-align:left;color:var(--ink);font-size:14px}
.qb:hover{background:var(--card)}
.qb[aria-pressed="true"]{background:var(--card);box-shadow:inset 3px 0 0 var(--red);font-weight:600}
.qb .n{color:var(--ink-2);font-weight:500}
.qb .n.hot{color:var(--red);font-weight:700}
.list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.lh{padding:12px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.items{overflow:auto;flex:1}
.it{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line-2);background:none;padding:11px 14px;cursor:pointer;color:var(--ink)}
.it:hover{background:var(--card)}
.it[aria-current="true"]{background:var(--card);box-shadow:inset 3px 0 0 var(--red)}
.it .t1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.it .ref{font-weight:600;font-size:13.5px}
.it .ti{font-size:14px;margin:2px 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it .t3{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);align-items:center}
.due{font-size:12px;font-weight:600}
.due.over{color:var(--red)}
.due.soon{color:var(--amber)}
.empty{padding:26px 16px;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.detail{overflow:auto;padding:18px 22px 70px;min-width:0}
.back{display:none}

/* case page */
.ch{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.ch h2{margin:0;font-size:22px;letter-spacing:-.01em}
.ch .ref{font-size:13px;color:var(--ink-2);font-weight:600}
.facts{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-top:6px}
.facts b{color:var(--ink);font-weight:600}
.flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.track{margin:18px 0 6px;overflow-x:auto;padding:14px 2px 2px}
.track ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(92px,1fr));min-width:600px}
.track li{position:relative;padding-top:24px;font-size:12px;color:var(--ink-2);text-align:center}
.track li::before{content:"";position:absolute;top:7px;left:0;right:0;height:2px;background:var(--line)}
.track li:first-child::before{left:50%}
.track li:last-child::before{right:50%}
.track li.done::before{background:var(--green)}
.track .d{position:absolute;top:1px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--card);border:2px solid var(--line)}
.track li.done .d{background:var(--green);border-color:var(--green)}
.track li.cur{color:var(--ink);font-weight:600}
.track li.cur .d{background:var(--ink);border-color:var(--ink);box-shadow:0 0 0 4px var(--card-2)}
.track li.gate .d{border-radius:3px;width:18px;margin-left:-9px}
.track li.gate::after{content:"Gate";position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;color:var(--red)}
.track li.rw .d{border-color:var(--amber);background:var(--amber-soft)}
.track li.skip{opacity:.4}
.loopnote{text-align:center;font-size:12px;color:var(--amber);margin-top:4px}
.clocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0}
.clk{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card)}
.clk .k{font-size:12px;color:var(--ink-2)}
.clk .v{font-weight:600;font-size:14px}
.clk.over{border-color:var(--red);background:var(--red-soft)}
.clk.over .v{color:var(--red)}
.clk.met .v{color:var(--green)}
.clk.idle{opacity:.55}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.sect{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:14px}
.sect > header{display:flex;gap:10px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line-2)}
.sect > header .no{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;border:1.5px solid var(--line);color:var(--ink-2);flex:none}
.sect.done > header .no{background:var(--green);border-color:var(--green);color:#fff}
.sect.cur > header .no{background:var(--ink);border-color:var(--ink);color:var(--card)}
.sect.cur{border-color:var(--ink-2)}
.sect > header h3{margin:0;font-size:15px}
.sect > header .own{margin-left:auto;font-size:12px;color:var(--ink-2)}
.sect .b{padding:13px 16px;display:grid;gap:12px}
.sect.lock .b{color:var(--ink-2)}
dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:5px 14px;margin:0;font-size:14px}
dl.kv dt{color:var(--ink-2)}
dl.kv dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.box{border:1px solid var(--line-2);border-radius:8px;padding:10px 12px;background:var(--card-2)}
.box .h{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink-2);margin-bottom:4px;flex-wrap:wrap}
.box pre{margin:0;white-space:pre-wrap;font:13px/1.5 var(--font);max-height:200px;overflow:auto}
.callout{border-left:3px solid var(--amber);background:var(--amber-soft);padding:9px 13px;border-radius:0 8px 8px 0;font-size:14px}
.callout.red{border-color:var(--red);background:var(--red-soft)}
.callout.green{border-color:var(--green);background:var(--green-soft)}
.callout.blue{border-color:var(--blue);background:var(--blue-soft)}
.callout b{display:block}
.probs{color:var(--red);font-size:13px;margin:0;padding-left:18px}
.qa{display:grid;grid-template-columns:auto 1fr;gap:14px}
.score{width:76px;height:76px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;text-align:center}
.score b{font-size:30px;line-height:1}
.score small{display:block;font-size:11px;color:var(--ink-2)}
.score.hi{border-color:var(--green);color:var(--green)}
.score.mid{border-color:var(--amber);color:var(--amber)}
.score.lo{border-color:var(--red);color:var(--red)}
ul.tight{margin:4px 0 0;padding-left:18px}
ul.tight li{margin:2px 0}
.gate{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.gate > div{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:10px;align-content:start}
.gate > .a{border-color:var(--green)}
.gate > .r{border-color:var(--amber)}
.gate h4{margin:0;font-size:14.5px}
.side .sect .b{gap:10px}
.log{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);margin-left:5px}
.log li{position:relative;padding:0 0 11px 15px;font-size:12.5px}
.log li::before{content:"";position:absolute;left:-5px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--card);border:2px solid var(--ink-2)}
.log li.st::before{background:var(--ink);border-color:var(--ink)}
.log li.bad::before{background:var(--red);border-color:var(--red)}
.log .n{color:var(--ink-2)}
.log .x{display:block;white-space:pre-wrap;color:var(--ink)}
.pbar{display:flex;gap:8px;border:1px solid var(--line);border-radius:8px;padding:5px;background:var(--card-2)}
.pbar input{border:0;background:none;padding:6px}
.pbar input:focus-visible{outline:none}
.pbar:focus-within{outline:2px solid var(--focus);outline-offset:1px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.chip:hover{color:var(--ink);border-color:var(--ink-2)}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.sugg{border:1px dashed var(--blue);background:var(--blue-soft);border-radius:8px;padding:10px 12px;font-size:14px;display:grid;gap:8px}
.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
th{font-weight:600;color:var(--ink-2);background:var(--card-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td input,td select{padding:5px 7px}
code{font-size:12.5px;background:var(--card-2);border:1px solid var(--line-2);border-radius:4px;padding:0 4px}
.prop{font-size:11.5px;color:var(--amber);font-weight:600}
.page h3{font-size:17px;margin:28px 0 8px}
.page p{max-width:76ch}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;max-width:calc(100vw - 32px)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

@media (max-width:1180px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .work{grid-template-columns:minmax(250px,320px) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .queues{grid-column:1/-1;border-right:0;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;padding:6px 10px;gap:2px}
  .queues h4{display:none}
  #ql{display:flex;gap:2px}
  .qb{width:auto;gap:8px;white-space:nowrap}
  .qb[aria-pressed="true"]{box-shadow:inset 0 -2px 0 var(--red)}
  .cols{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  body{flex-direction:column-reverse;height:auto;min-height:100%}
  .rail{width:100%;flex-direction:row;justify-content:space-around;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));position:sticky;bottom:0;z-index:30}
  .rail .logo,.rail .sp{display:none}
  .rail button[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--red)}
  :root{padding-bottom:0}
  .app{min-height:100vh}
  .view{overflow:visible}
  .bar{padding:10px 12px}
  .bar h1 span{display:none}
  .work{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto;height:auto}
  .work.sel .list{display:none}
  .work:not(.sel) .detail{display:none}
  .items,.detail{overflow:visible}
  .back{display:inline-block;margin-bottom:8px}
  .detail{padding:12px 12px 60px}
  .gate,.qa{grid-template-columns:1fr}
  .page{padding:16px 12px 60px}
}
</style>
</head>
<body>
<nav class="rail" aria-label="Pages">
  <div class="logo" aria-hidden="true">A</div>
  <button data-view="now" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Now</button>
  <button data-view="cases"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 15h6"/></svg>Cases</button>
  <button data-view="register"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Register</button>
  <button data-view="rules"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 4h11l3 3v13H5z"/><path d="M9 10h6M9 14h6M9 18h3"/></svg>Rules</button>
  <div class="sp"></div>
  <button data-view="admin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>Admin</button>
  <button data-view="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Access</button>
</nav>
<div class="app">
  <header class="bar">
    <h1>Alfred Care<span>Complaint case management</span></h1>
    <div class="me" id="meBox"></div>
    <button class="btn primary" id="regBtn">Register case</button>
  </header>

<script>
(() => {
"use strict";

/* =========================================================
   Reference data — BRD/FRD v1.1 working values (Q&G to confirm)
   ========================================================= */
const STATES=["new","routed_to_unit","unit_input_pending","evaluator_review","rework_requested","rca_complete","resolved","closed_duplicate"];
const SL={new:"New",routed_to_unit:"Routed to unit",unit_input_pending:"Unit input pending",evaluator_review:"Evaluator review",rework_requested:"Rework requested",rca_complete:"RCA complete",resolved:"Resolved",closed_duplicate:"Closed as duplicate"};
const OPEN=s=>!["resolved","closed_duplicate"].includes(s);
const ROLE_LABEL={admin:"Admin",maker:"Maker",checker:"Checker",team:"Team member",compliance:"Compliance",viewer:"Viewer"};
const ROLE_DESC={admin:"Q&G manager: teams and access, configuration, assigning anywhere, reopening, audit extract",maker:"Q&G officer / HAPEX: registers cases, records interaction QA, routes to a team, records the response and resolves",checker:"Complaint Evaluator: reviews the team's input, returns it for rework or accepts it with RCA",team:"Works cases routed to their team: accepts or is assigned, calls the client, records the input",compliance:"Reads every case and runs the audit extract",viewer:"Reads cases only"};
const ROLES=Object.keys(ROLE_LABEL);
const TONES=["courteous","defensive","dismissive","exemplary"];
const QA_CHANNELS={call:"Phone call (3CX)",whatsapp:"WhatsApp",email:"Email"};
const SOURCES={ZOHO_TICKET:"Zoho ticket",GOOGLE_REVIEW:"Google review",THREECX_CALL:"3CX call",BREVO_MESSAGE:"Brevo message",IMCRM_POLICY:"IMCRM policy",IMCRM_QUOTE:"IMCRM quote",CEM_CASE:"Alfred Care case"};
const ACTION_TYPES=["CALL","EMAIL","MEETING","REFUND","REISSUE","ESCALATION","OTHER"];
const VALIDITY=["Valid","Partially valid","Not valid"];
const CONSEQ={0:"None",1:"L1 Minor: documented coaching",2:"L2 Moderate: formal coaching and follow-up audit within 30 days",3:"L3 Serious: written warning and supervisory review",4:"L4 Critical: immediate escalation to HR / Compliance"};
const DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const DEFAULT_CFG={
  version:1,
  categories:[
    {code:"ENQUIRY",name:"Enquiry",complaint:false,regulatory:false,priority:"Medium",ackH:null,res:null,active:true},
    {code:"SERVICE_REQUEST",name:"Service request",complaint:false,regulatory:false,priority:"Medium",ackH:null,res:null,active:true},
    {code:"CLAIM_RELATED",name:"Claim-related",complaint:false,regulatory:false,priority:"Medium",ackH:null,res:null,active:true},
    {code:"COMPLAINT",name:"Complaint",complaint:true,regulatory:false,priority:"Medium",ackH:null,res:null,active:true},
    {code:"FEEDBACK",name:"Feedback",complaint:false,regulatory:false,priority:"Medium",ackH:null,res:null,active:true},
    {code:"APPRECIATION",name:"Appreciation",complaint:false,regulatory:false,priority:"Medium",ackH:null,res:null,active:true}
  ],
  priorities:["High","Medium","Low"],
  channels:["Email (Zoho)","Website (via Zoho)","Phone (3CX)","Google Review","Walk-in","Social","Internal referral"],
  lobs:["Motor","Health","Travel","Business","Home","Life"],
  branches:["Dubai HQ","Abu Dhabi Branch","Not Applicable"],
  units:["HAPEX / Happiness Centre","Motor Renewals","Organic","Retail Medical","IM Corporate","Travel","Home","Life","Business"].map(n=>({id:"t-"+n.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""),name:n,lob:"",headId:"",active:true})),
  outcomes:["Client Calmed & Agreed","Compensation Accepted","Client Dissatisfied / Demanded Escalation","Voicemail"],
  rca:{"Product":[],"Process":[],"People":[],"System":[],"Insurer":[],"Customer-side":[],"Other":[]},
  clocks:{ackH:4,firstCallD:1,unitActionD:3,reworkD:2,attempts:3,attemptDays:2,escalationPct:80,reopenDays:30},
  calendar:{week:[null,{o:"08:00",c:"18:30"},{o:"08:00",c:"18:30"},{o:"08:00",c:"18:30"},{o:"08:00",c:"18:30"},{o:"08:00",c:"18:30"},{o:"09:00",c:"13:00"}],holidays:[]}
};
const QA_PROMPT=`You are a Complaint Interaction QA Auditor. Evaluate the staff member's handling of the
client interaction provided (call transcript, WhatsApp thread, or email).

1. Classify staff tone as exactly one of: courteous, defensive, dismissive, exemplary.
2. Assign a quality score from 1 to 10.
3. List every protocol breach, each with a verbatim quote or timestamp as evidence.
4. Provide 2–3 specific, actionable coaching tips.
Return ONLY valid JSON matching the response schema. Do not invent evidence.`;
const REFINE_PROMPT=`You are a customer response editor. Rewrite the draft response below according to the
user's instruction. Keep it accurate to the case facts, empathetic and professional.
Do not admit liability, promise compensation, cite laws, or include personal data
unless those details already appear in the approved case record.`;
const CHIPS=["Mention supervisor outbound call and apology","Make more concise for mobile","Warmer, more personal tone","Invite the customer to contact us directly"];

/* ========================= helpers ========================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso=()=>new Date().toISOString();
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const safeUrl=u=>/^https:\/\//i.test(String(u||"").trim())?String(u).trim():"";
const fmt=t=>t?new Date(t).toLocaleString("en-GB",{timeZone:"Asia/Dubai",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"";
const fmtD=t=>t?new Date(t).toLocaleDateString("en-GB",{timeZone:"Asia/Dubai",day:"numeric",month:"short",year:"numeric"}):"";
const opts=(list,sel,ph)=>(ph!=null?`<option value="">${esc(ph)}</option>`:"")+list.map(v=>{const val=typeof v==="object"?v.v:v,lab=typeof v==="object"?v.l:v;return `<option value="${esc(val)}"${String(val)===String(sel??"")?" selected":""}>${esc(lab)}</option>`;}).join("");
function deepMerge(t,p){ for(const k in p){ const v=p[k]; if(v&&typeof v==="object"&&!Array.isArray(v)&&t[k]&&typeof t[k]==="object"&&!Array.isArray(t[k])) deepMerge(t[k],v); else t[k]=clone(v);} return t; }
let tt; function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,4500);}
const maskEmail=e=>{e=String(e||"");const [u,d]=e.split("@");return e?(u.slice(0,2)+"•••"+(d?"@"+d:"")):"";};
const maskPhone=p=>{p=String(p||"").replace(/\s/g,"");return p?"•••• "+p.slice(-4):"";};

/* ===================== working-time engine =====================
   Clocks run on Asia/Dubai wall time (UTC+4, no DST) against WORK_CALENDAR. */
const OFF=4*36e5;
const wall=d=>new Date(new Date(d).getTime()+OFF);
const unwall=w=>new Date(w.getTime()-OFF);
const dkey=w=>w.toISOString().slice(0,10);
const toMin=s=>{const [h,m]=String(s).split(":").map(Number);return h*60+(m||0);};
const nextDay=w=>new Date(Date.UTC(w.getUTCFullYear(),w.getUTCMonth(),w.getUTCDate()+1));
function dayHours(w){
  const cal=cfg.calendar; if((cal.holidays||[]).includes(dkey(w))) return null;
  const d=cal.week[w.getUTCDay()]; if(!d||!d.o||!d.c) return null;
  const o=toMin(d.o),c=toMin(d.c); return c>o?[o,c]:null;
}
function addWH(start,hours){
  let rem=Math.round(hours*60), w=wall(start);
  for(let i=0;i<1000;i++){
    const h=dayHours(w), m=w.getUTCHours()*60+w.getUTCMinutes();
    if(h){ const s=Math.max(m,h[0]); if(s<h[1]){ const av=h[1]-s; if(rem<=av){ const r=new Date(Date.UTC(w.getUTCFullYear(),w.getUTCMonth(),w.getUTCDate(),0,s+rem)); return unwall(r).toISOString(); } rem-=av; } }
    w=nextDay(w);
  }
  return null;
}
function addWD(start,n){
  const w0=wall(start); const tod=w0.getUTCHours()*60+w0.getUTCMinutes(); let w=w0, k=0;
  for(let i=0;i<1000;i++){
    w=nextDay(w); const h=dayHours(w);
    if(h){ k++; if(k>=n){ const t=Math.min(Math.max(tod,h[0]),h[1]); return unwall(new Date(Date.UTC(w.getUTCFullYear(),w.getUTCMonth(),w.getUTCDate(),0,t))).toISOString(); } }
  }
  return null;
}
function wmBetween(a,b){
  a=new Date(a); b=new Date(b); if(b<=a) return 0;
  let w=wall(a), end=wall(b), tot=0;
  for(let i=0;i<1000;i++){
    const h=dayHours(w);
    const day0=Date.UTC(w.getUTCFullYear(),w.getUTCMonth(),w.getUTCDate());
    if(h){ const s=Math.max(w.getTime(),day0+h[0]*6e4), e=Math.min(end.getTime(),day0+h[1]*6e4); if(e>s) tot+=(e-s)/6e4; }
    w=nextDay(w); if(w>end) break;
  }
  return tot;
}
const isWorkingDay=t=>!!dayHours(wall(t));
function fmtWM(min){ min=Math.round(min); if(min<60) return min+" working min"; const h=Math.floor(min/60),m=min%60; return h+"h"+(m?" "+m+"m":"")+" working"; }
function clockState(k){
  if(!k||!k.due) return null;
  if(k.void) return {s:"void",label:"Void"};
  if(k.stop){ const met=new Date(k.stop)<=new Date(k.due); return {s:met?"met":"breached",label:met?"Met":"Breached",at:k.stop}; }
  const now=Date.now();
  if(now>new Date(k.due)) return {s:"over",label:"Overdue",remain:-wmBetween(k.due,now)};
  return {s:"run",label:"Running",remain:wmBetween(now,k.due)};
}
const CLOCK_LABEL={ack:"Acknowledgement",firstCall:"First unit call",unitAction:"Unit action",rework:"Rework",resolution:"Resolution"};

/* ========================= state ========================= */
let db=null,user=null,sample=null,downloads=null,assets=null;
let me=null,uid=null,meName="",meAvatar="",isOwner=false,mode="local",actingAs=null;
let cfg=clone(DEFAULT_CFG);
let cases=[],people={},members={},events=[],loaded=false;
let view="now",queue="open",selRef=null,qText="",fCat="",fUnit="";
const drafts={},busy={},names={},undo={},problems={},revealed={};
let evUnsub=null,pendingDetail=false;
const mem={cases:new Map(),events:[],people:{},logs:[]};

/* ========================= roles ========================= */
/* Access: people are member records (staff and advisors) maintained by an Admin.
   A member is linked to a tool sign-in; roles and teams live on the member.
   Admins can "act as" any member to test the workflow end to end. */
function linked(){ return Object.entries(members).find(([,m])=>m.userId&&m.userId===uid&&m.active!==false)||null; }
function realAdmin(){ const l=linked(); return isOwner||!!(l&&(l[1].roles||[]).includes("admin")); }
function persona(){ if(actingAs&&members[actingAs]) return [actingAs,members[actingAs]]; return linked(); }
function syncMe(){ if(actingAs&&(!members[actingAs]||!realAdmin())) actingAs=null; const p=persona(); me=p?p[0]:(uid?"u:"+uid:"local"); }
function myRoles(){ const p=persona(); const r=new Set(p?(p[1].roles||[]):[]); if(!actingAs&&isOwner) r.add("admin"); return r; }
const has=r=>myRoles().has(r);
const myUnits=()=>{ const p=persona(); return p?(p[1].teams||[]):[]; };
const isMgr=()=>has("admin");
const tid=x=>(cfg.units.find(u=>u.id===x||u.name===x)||{}).id||x;
const teamName=x=>(cfg.units.find(u=>u.id===x||u.name===x)||{}).name||x||"";
const activeTeams=()=>cfg.units.filter(u=>u.active!==false);
const inUnit=c=>has("team")&&myUnits().includes(tid(c.unit));
const unitHead=c=>((cfg.units.find(u=>u.id===tid(c.unit))||{}).headId)===me;
const teamMembers=t=>Object.entries(members).filter(([,m])=>m.active!==false&&(m.roles||[]).includes("team")&&(m.teams||[]).includes(tid(t)));
const isHandler=c=>isMgr()||has("maker")||c.ownerId===me||inUnit(c);
const canSeeContact=c=>isMgr()||has("compliance")||c.ownerId===me||inUnit(c)||c.createdBy===me||((has("maker"))&&c.status==="new");
const catOf=c=>cfg.categories.find(x=>x.code===c.category)||{name:c.category||"Uncategorised",complaint:!!c.complaint};
function independence(c){
  const why=[];
  if(c.ownerId===me) why.push("you own this case for the team");
  if(c.advisor&&c.advisor.id&&c.advisor.id===me) why.push("you are the attributed advisor");
  if((c.unitCalls||[]).some(x=>x.by===me)||(c.unitInput&&c.unitInput.by===me)) why.push("you recorded the unit's call or input");
  if(inUnit(c)) why.push("you are a member of "+teamName(c.unit));
  return why;
}
function nameOf(id){ if(!id) return "—"; let n=members[id]&&members[id].name; if(!n&&String(id).startsWith("u:")) n=names[id.slice(2)]||(id.slice(2)===uid?meName:""); n=n||names[id]||"Someone"; return id===me?n+" (you)":n; }

/* ========================= store ========================= */
const chains={};
function chain(key,fn){ const p=(chains[key]||Promise.resolve()).then(fn); chains[key]=p.catch(()=>{}); return p; }
function writeErr(e){
  const c=e&&e.code;
  toast(c==="invalid_argument"?"This change wasn't saved: your access to this tool is view-only."
    :c==="quota_exceeded"?"Storage is full. Ask an Admin to export and archive closed cases."
    :"This change wasn't saved. Check your connection and try again.");
}
async function createCase(c){
  if(mode==="local"){ mem.cases.set(c.ref,clone(c)); cases=[...mem.cases.values()]; return; }
  try{ await chain(c.ref,()=>db.doc("cases/"+c.ref).set(clone(c))); }catch(e){ writeErr(e); throw e; }
}
async function updateCase(ref,patch){
  patch=clone(patch); patch.updatedAt=iso(); patch.updatedBy=me;
  if(mode==="local"){ const c=mem.cases.get(ref); deepMerge(c,patch); cases=[...mem.cases.values()]; return; }
  try{ await chain(ref,()=>db.doc("cases/"+ref).update(patch)); }catch(e){ writeErr(e); throw e; }
}
async function addEvent(ref,type,o={}){
  const e={caseRef:ref,type,at:iso(),by:me,realUser:uid,actingAs:actingAs||null,from:o.from||null,to:o.to||null,reason:o.reason||"",payload:o.payload||null};
  if(mode==="local"){ mem.events.push(e); if(ref===selRef) events=mem.events.filter(x=>x.caseRef===ref); return; }
  try{ await db.collection("events").add(e); }catch(err){ /* event loss is reported but does not undo the case write */ toast("The audit event wasn't recorded. Reload and check the case log."); }
}
async function addLog(coll,o){
  o={...o,at:iso(),by:me,realUser:uid};
  if(mode==="local"){ mem.logs.push({coll,...o}); return; }
  try{ await db.collection(coll).add(o); }catch(_){}
}
function watchEvents(ref){
  if(evUnsub){ evUnsub(); evUnsub=null; }
  events=[];
  if(!ref) return;
  if(mode==="local"){ events=mem.events.filter(x=>x.caseRef===ref); return; }
  evUnsub=db.collection("events").where("caseRef","==",ref).onSnapshot(s=>{ events=s.docs.map(d=>d.data()); renderDetail(); refreshNames(); },()=>{});
}
async function allEventsSince(fromIso){
  if(mode==="local") return mem.events.filter(e=>e.at>=fromIso);
  const s=await db.collection("events").where("at",">=",fromIso).get();
  return s.docs.map(d=>d.data());
}
async function nextRef(){
  const yr=new Date().getFullYear();
  const pad=n=>"CEM-"+yr+"-"+String(n).padStart(6,"0");
  const localMax=()=>cases.reduce((m,c)=>{const x=String(c.ref).match(/^CEM-(\d{4})-(\d+)$/);return x&&+x[1]===yr?Math.max(m,+x[2]):m;},0);
  if(mode==="local") return pad(localMax()+1);
  const ref=db.doc("meta/seq-"+yr);
  for(let i=0;i<8;i++){
    try{
      const l=await ref.acquire({holder:me+"-"+Math.random().toString(36).slice(2,7),ttlMs:5000});
      if(l.acquired){ const s=await ref.get(); const n=Math.max(s.exists?(s.data().n||0):0,localMax())+1; await ref.set({n}); return pad(n); }
    }catch(e){ if(e&&e.code==="invalid_argument") throw e; }
    await new Promise(r=>setTimeout(r,350+Math.random()*450));
  }
  throw {code:"unavailable"};
}
let nameT;
function refreshNames(){
  if(!user) return; clearTimeout(nameT);
  nameT=setTimeout(async()=>{
    const ids=new Set(Object.keys(people));
    const addU=x=>{ if(x&&String(x).startsWith("u:")) ids.add(x.slice(2)); };
    cases.forEach(c=>{addU(c.createdBy);addU(c.ownerId);}); events.forEach(e=>{addU(e.by); if(e.realUser) ids.add(e.realUser);});
    Object.values(members).forEach(m=>{ if(m.userId) ids.add(m.userId); });
    const want=[...ids].filter(x=>x&&!names[x]);
    if(!want.length) return;
    try{ const ps=await user.profiles(want); let ch=false; want.forEach(id=>{const n=ps&&ps[id]&&ps[id].name; if(n){names[id]=n;ch=true;}}); if(ch) renderAll(); }catch(_){}
  },120);
}

/* ===================== derived flags & queues ===================== */
function runningClocks(c){ return Object.entries(c.clocks||{}).map(([k,v])=>[k,v,clockState(v)]).filter(([,,s])=>s&&(s.s==="run"||s.s==="over")); }
const overdue=c=>OPEN(c.status)&&runningClocks(c).some(([,,s])=>s.s==="over");
function resPct(c){ const k=(c.clocks||{}).resolution; if(!k||!k.due||k.stop||k.void) return 0; const tot=wmBetween(k.start,k.due); return tot?wmBetween(k.start,Date.now())/tot*100:0; }
function isRepeat(c){
  const key=[(c.customer||{}).email,(c.customer||{}).mobile].filter(Boolean).map(s=>String(s).toLowerCase().replace(/\s/g,""));
  if(!key.length) return false;
  const t=new Date(c.openedAt).getTime();
  return cases.some(o=>o.ref!==c.ref&&o.category===c.category&&o.status!=="closed_duplicate"&&[(o.customer||{}).email,(o.customer||{}).mobile].filter(Boolean).map(s=>String(s).toLowerCase().replace(/\s/g,"")).some(k=>key.includes(k))&&new Date(o.openedAt).getTime()<t&&t-new Date(o.openedAt).getTime()<=90*864e5);
}
function riskReasons(c){
  const r=[];
  if(typeof c.sentiment==="number"&&c.sentiment<=-0.5) r.push("negative sentiment");
  if(catOf(c).regulatory) r.push("regulatory category");
  if(resPct(c)>=cfg.clocks.escalationPct) r.push("resolution clock "+Math.round(resPct(c))+"% used");
  if(isRepeat(c)) r.push("repeat issue");
  return r;
}
const highRisk=c=>OPEN(c.status)&&riskReasons(c).length>0;
function minRemain(c){ const r=runningClocks(c); if(!r.length) return Infinity; return Math.min(...r.map(([,,s])=>s.remain)); }
function dueToday(c){ const today=dkey(wall(Date.now())); return runningClocks(c).some(([,k])=>dkey(wall(k.due))===today); }
const QUEUES=[
  {id:"open",label:"All open",m:c=>OPEN(c.status)},
  {id:"mine",label:"My cases",m:c=>OPEN(c.status)&&c.ownerId===me},
  {id:"team",label:"Team queue",m:c=>OPEN(c.status)&&myUnits().includes(tid(c.unit))},
  {id:"assign",label:"To assign",m:c=>c.status==="routed_to_unit"&&!c.ownerId&&(isMgr()||unitHead(c))},
  {id:"intake",label:"Awaiting routing",m:c=>c.status==="new"},
  {id:"unassigned",label:"Unassigned",m:c=>OPEN(c.status)&&c.status!=="new"&&!c.ownerId},
  {id:"gate",label:"Evaluator queue",m:c=>c.status==="evaluator_review"},
  {id:"overdue",label:"Overdue",m:overdue,hot:true},
  {id:"escalated",label:"Escalated",m:c=>OPEN(c.status)&&c.escalation&&c.escalation.active,hot:true},
  {id:"risk",label:"High-risk",m:highRisk,hot:true},
  {id:"closed",label:"Resolved and closed",m:c=>!OPEN(c.status)}
];

/* ========================= transitions ========================= */
const FLOW={
  "new>routed_to_unit":{label:"Route to unit",who:"Maker or Admin"},
  "new>closed_duplicate":{label:"Close as duplicate",who:"Maker or Admin"},
  "routed_to_unit>unit_input_pending":{label:"Accept case",who:"A team member of the case's team"},
  "routed_to_unit>resolved":{label:"Resolve",who:"The case owner, Maker or Admin (non-complaint cases only)"},
  "unit_input_pending>evaluator_review":{label:"Submit to evaluator",who:"The case owner"},
  "evaluator_review>rework_requested":{label:"Return for rework",who:"An independent Checker"},
  "rework_requested>unit_input_pending":{label:"Pick up rework",who:"The case owner"},
  "evaluator_review>rca_complete":{label:"Accept",who:"An independent Checker"},
  "rca_complete>resolved":{label:"Record response and resolve",who:"Maker or Admin"},
  "resolved>unit_input_pending":{label:"Reopen",who:"Admin, within the reopen window"}
};
function allowed(c,to){
  const k=c.status+">"+to;
  switch(k){
    case "new>routed_to_unit": return isMgr()||has("maker");
    case "new>closed_duplicate": return isMgr()||has("maker");
    case "routed_to_unit>unit_input_pending": return c.ownerId?c.ownerId===me:inUnit(c);
    case "routed_to_unit>resolved": return !catOf(c).complaint&&(c.ownerId===me||inUnit(c)||isMgr()||has("maker"));
    case "unit_input_pending>evaluator_review": case "rework_requested>unit_input_pending": return c.ownerId===me;
    case "evaluator_review>rework_requested": case "evaluator_review>rca_complete": return has("checker");
    case "rca_complete>resolved": return isMgr()||has("maker");
    case "resolved>unit_input_pending": return isMgr();
  }
  return false;
}
function callsOk(c){
  const calls=c.unitCalls||[];
  if(calls.some(x=>x.connected&&safeUrl(x.recordingUrl))) return {ok:true,how:"connected call with recording"};
  const days=new Set(calls.map(x=>dkey(wall(x.at))));
  if(calls.length>=cfg.clocks.attempts&&days.size>=cfg.clocks.attemptDays) return {ok:true,how:calls.length+" attempts over "+days.size+" working days"};
  return {ok:false};
}
function guard(c,to){
  const p=[], k=c.status+">"+to, cat=catOf(c);
  if(k==="new>routed_to_unit"){
    if(!c.unit) p.push("Choose the team that will own the case.");
    if(!c.category) p.push("Confirm the category.");
    if(cat.complaint&&!c.interactionQA) p.push("Record the interaction QA of the original contact, or record that there was no identifiable staff interaction.");
  }
  if(k==="new>closed_duplicate"){
    if(!c._dupOf) p.push("Choose the original case this duplicates.");
    else if(c._dupOf===c.ref) p.push("A case can't duplicate itself.");
    else if(!cases.some(x=>x.ref===c._dupOf)) p.push("That original case wasn't found.");
    if(!(c._reason||"").trim()) p.push("Give a reason.");
  }
  if(k==="routed_to_unit>unit_input_pending"&&!c.ownerId&&!inUnit(c)) p.push("Only a member of "+teamName(c.unit)+" can accept this case.");
  if(k==="routed_to_unit>resolved"){
    if(cat.complaint) p.push("Complaints must pass the unit call and evaluator gate.");
    if(!(c._reason||"").trim()) p.push("Record how the case was resolved.");
  }
  if(k==="unit_input_pending>evaluator_review"){
    if(!callsOk(c).ok) p.push(`Log a connected outbound call with its recording, or ${cfg.clocks.attempts} attempts over ${cfg.clocks.attemptDays} working days.`);
    const u=c.unitInput||{};
    if(!u.outcome) p.push("Choose the call outcome.");
    if(!(u.notes||"").trim()) p.push("Record what was discussed and agreed.");
    if(!(u.action||"").trim()) p.push("Summarise the action the unit took.");
  }
  if(k==="rework_requested>unit_input_pending"&&!(c._reason||"").trim()) p.push("Record what you'll change in the rework.");
  if(k==="evaluator_review>rework_requested"||k==="evaluator_review>rca_complete"){
    const why=independence(c); if(why.length) p.push("You can't review this case: "+why.join("; ")+".");
  }
  if(k==="evaluator_review>rework_requested"&&!(c._reason||"").trim()) p.push("Give the reasons for rework. Say exactly what the unit must redo or provide.");
  if(k==="evaluator_review>rca_complete"){
    const r=c._rca||{};
    if(!r.l1) p.push("Choose the RCA category.");
    if(!(r.note||"").trim()) p.push("Write the RCA note.");
    if(!c._validity) p.push("Record the complaint's validity.");
    if(c._level==null||c._level==="") p.push("Record the consequence level (choose None if none applies).");
  }
  if(k==="rca_complete>resolved"&&!(c._response||"").trim()) p.push("Record the controlled response sent to the customer.");
  if(k==="resolved>unit_input_pending"){
    if(!(c._reason||"").trim()) p.push("Give the reason for reopening.");
    if(c.resolvedAt&&Date.now()-new Date(c.resolvedAt)>cfg.clocks.reopenDays*864e5) p.push(`Cases can only be reopened within ${cfg.clocks.reopenDays} days of resolution.`);
  }
  return p;
}
async function transition(c,to,extra={}){
  const k=c.status+">"+to, f=FLOW[k], fromStatus=c.status;
  if(!f){ toast("That move isn't allowed from "+SL[c.status]+"."); return false; }
  if(!allowed(c,to)){ toast(f.label+" is for: "+f.who+"."); return false; }
  const probe={...c,...extra};
  const p=guard(probe,to);
  if(p.length){
    problems[c.ref+">"+to]=p;
    if(to==="rework_requested"||to==="rca_complete"){ const w=independence(c); if(w.length) addEvent(c.ref,"INDEPENDENCE_REFUSED",{reason:w.join("; ")}); }
    renderDetail(true); return false;
  }
  delete problems[c.ref+">"+to];
  const now=iso(), patch={status:to,statusAt:now}, cl={}, cat=catOf(c);
  let reason=extra._reason||"";
  if(k==="new>routed_to_unit"){
    patch.unit=c.unit; patch.routedAt=now; patch.acknowledgedAt=now; cl.ack={stop:now};
    if(cat.complaint) cl.unitAction={start:now,due:addWD(now,cfg.clocks.unitActionD)};
    reason="Routed to "+teamName(c.unit);
  }
  if(k==="new>closed_duplicate"){ patch.duplicateOf=extra._dupOf; patch.closedAt=now; Object.keys(c.clocks||{}).forEach(x=>cl[x]={void:true}); }
  if(k==="routed_to_unit>unit_input_pending"){
    if(!c.ownerId){ patch.ownerId=me; patch.assignedAt=now; }
    if(cat.complaint&&!(c.clocks||{}).firstCall) cl.firstCall={start:now,due:addWD(now,cfg.clocks.firstCallD)};
    reason=reason||"Accepted by unit";
  }
  if(k==="routed_to_unit>resolved"){ patch.resolvedAt=now; patch.resolution=reason; Object.entries(c.clocks||{}).forEach(([x,v])=>{ if(v&&!v.stop&&!v.void) cl[x]={stop:now}; }); }
  if(k==="unit_input_pending>evaluator_review"){
    const ck=c.clocks||{};
    if(ck.unitAction&&!ck.unitAction.stop) cl.unitAction={stop:now};
    if(ck.rework&&!ck.rework.stop) cl.rework={stop:now};
    reason="Unit input submitted ("+callsOk(c).how+")";
  }
  if(k==="evaluator_review>rework_requested"){
    patch.reworkCount=(c.reworkCount||0)+1;
    patch.reviews=[...(c.reviews||[]),{at:now,by:me,decision:"REWORK",reasons:reason}];
    patch.evaluatorId=me;
    cl.rework={start:now,due:addWD(now,cfg.clocks.reworkD),stop:null};
  }
  if(k==="rework_requested>unit_input_pending"){ patch.reworkNotes=[...(c.reworkNotes||[]),{at:now,by:me,text:reason}]; }
  if(k==="evaluator_review>rca_complete"){
    patch.reviews=[...(c.reviews||[]),{at:now,by:me,decision:"ACCEPT",reasons:reason||""}];
    patch.evaluatorId=me;
    patch.rca={...extra._rca,by:me,at:now}; patch.validity=extra._validity; patch.consequenceLevel=+extra._level;
    reason="Accepted. RCA "+extra._rca.l1+(extra._rca.l2?" / "+extra._rca.l2:"")+". Validity "+extra._validity+". Consequence "+CONSEQ[+extra._level];
  }
  if(k==="rca_complete>resolved"){
    patch.resolvedAt=now; patch.response={text:extra._response,by:me,at:now};
    Object.entries(c.clocks||{}).forEach(([x,v])=>{ if(v&&!v.stop&&!v.void) cl[x]={stop:now}; });
    reason="Controlled response recorded";
  }
  if(k==="resolved>unit_input_pending"){
    patch.reopens=[...(c.reopens||[]),{at:now,by:me,reason,previousResolvedAt:c.resolvedAt,previousRca:c.rca||null,previousResponse:c.response||null}];
    patch.resolvedAt=null; patch.response=null; patch.rca=null;
    cl.unitAction={start:now,due:addWD(now,cfg.clocks.unitActionD),stop:null};
  }
  if(Object.keys(cl).length) patch.clocks=cl;
  try{
    await updateCase(c.ref,patch);
    await addEvent(c.ref,k==="resolved>unit_input_pending"?"REOPEN":k==="new>closed_duplicate"?"CLOSE":"STATUS",{from:fromStatus,to,reason,payload:k==="new>closed_duplicate"?{duplicateOf:extra._dupOf}:null});
    toast(f.label+": done.");
    return true;
  }catch(_){ return false; }
}

function trackHtml(c){

  :`<dl class="kv"><dt>Description</dt><dd>${esc(c.description)}</dd>${c.advisor&&c.advisor.name?`<dt>Advisor</dt><dd>${esc(c.advisor.name)}</dd>`:""}<dt>Registered</dt><dd>${fmt(c.openedAt)} by ${esc(nameOf(c.createdBy))}</dd></dl>`;
  const ev=(c.interactions||[]).map((x,i)=>`<div class="box"><div class="h"><span><b>${esc(QA_CHANNELS[x.channel]||x.channel)}</b>${x.at?", "+fmt(x.at):""}${x.callId?`, call ${esc(x.callId)}`:""}</span><span>${safeUrl(x.recordingUrl)?`<a href="${esc(safeUrl(x.recordingUrl))}" target="_blank" rel="noopener">Recording</a>`:""}${edit?` <button class="btn link" data-act="delEv" data-i="${i}">Remove</button>`:""}</span></div>${x.content?`<pre>${esc(x.content)}</pre>`:`<span class="sm muted">No transcript. The AI audit needs the text of the call, thread or email.</span>`}</div>`).join("");
  const addEv=edit&&cat.complaint?`<details${(c.interactions||[]).length?"":" open"}><summary class="sm" style="cursor:pointer;font-weight:600">Attach the original staff interaction</summary><div class="stack" style="margin-top:10px">
      <div class="g3"><label class="f"><span>Channel</span><select data-d="ev.channel">${opts(Object.entries(QA_CHANNELS).map(([v,l])=>({v,l})),dv(r,"ev.channel","call"))}</select></label>
      <label class="f"><span>When</span><input type="datetime-local" data-d="ev.at" value="${esc(dv(r,"ev.at",""))}"></label>
      <label class="f"><span>3CX call ID</span><input type="text" data-d="ev.callId" value="${esc(dv(r,"ev.callId",""))}"></label></div>
      <label class="f"><span>Transcript, WhatsApp thread with timestamps, or the email exchange</span><textarea data-d="ev.content" style="min-height:110px">${esc(dv(r,"ev.content",""))}</textarea></label>
      <label class="f"><span>Recording link</span><input type="url" placeholder="https://" data-d="ev.rec" value="${esc(dv(r,"ev.rec",""))}"></label>
      <div class="row"><button class="btn sm" data-act="addEv">Attach interaction</button></div></div></details>`:"";
  let qa="";
  if(cat.complaint){
    const q=c.interactionQA, s=c.aiQA;
    if(q&&q.none) qa=`<div class="callout"><b>No identifiable staff interaction</b>${esc(q.reason)}. Recorded by ${esc(nameOf(q.by))}, ${fmt(q.at)}.</div>`;
    else if(q) qa=qaCard(q,"Interaction QA recorded by "+nameOf(q.by)+", "+fmt(q.at)+(q.fromAi?" (AI suggestion confirmed)":""));
    if(edit){
      if(s&&!q) qa+=`<div class="sugg"><b>AI suggestion, not yet recorded</b>${qaCard(s,"Model output "+fmt(s.at)+". Check the evidence quotes before recording.")}<div class="row"><button class="btn sm ok" data-act="acceptQA">Record this result</button><button class="btn sm" data-act="manualQA">Edit before recording</button></div></div>`;
      const n=(c.interactions||[]).length;
      qa+=`<div class="row">${sample&&n?`<button class="btn sm primary" data-act="runQA"${busy[r]?" disabled":""}>${s||q?"Run AI audit again":"Run AI audit"}</button>`:""}${n?`<button class="btn sm" data-act="manualQA">${q?"Edit QA result":"Enter QA result"}</button>`:""}${!q?`<button class="btn sm" data-act="noneQA">No staff interaction</button>`:""}</div>`;
      if((drafts[r]||{})._qaForm) qa+=qaForm(c);
      if((drafts[r]||{})._noneForm) qa+=`<div class="box stack"><label class="f"><span>Why is there no staff interaction to audit?</span><input type="text" data-d="qa.noneReason" value="${esc(dv(r,"qa.noneReason",""))}"></label><div class="row"><button class="btn sm ok" data-act="saveNone">Record</button><button class="btn sm" data-act="noneQA">Cancel</button></div></div>`;
    }
  }
  return `<section class="sect ${sectCls(c,1)}"><header><span class="no">1</span><h3>Intake${cat.complaint?" and interaction QA":""}</h3><span class="own">Maker</span></header><div class="b">
    ${fields}
    ${cat.complaint?`<div><b class="sm">Original staff interaction</b> <span class="sm muted">${(c.interactions||[]).length} attached</span></div>${ev}${addEv}${qa}`:""}
  </div></section>`;
}
function qaCard(q,foot){
  const sc=q.score, cls=sc>=8?"hi":sc>=5?"mid":"lo";
  return `<div class="qa"><div class="score ${cls}"><div><b>${esc(sc)}</b><small>of 10</small></div></div><div>
    <div class="row"><span class="pill">Tone: ${esc(q.tone)}</span>${(q.breaches||[]).length?`<span class="flag red">${q.breaches.length} breach${q.breaches.length>1?"es":""}</span>`:`<span class="flag">No breaches</span>`}</div>
    ${(q.breaches||[]).length?`<ul class="tight sm">${q.breaches.map(b=>`<li><b>${esc(b.breach)}</b>: ${esc(b.evidence)}</li>`).join("")}</ul>`:""}
    ${(q.coaching||[]).length?`<div class="sm" style="margin-top:6px"><b>Coaching</b><ul class="tight">${q.coaching.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
    <div class="sm muted" style="margin-top:4px">${esc(foot)}</div></div></div>`;
}
function qaForm(c){
  const r=c.ref, q=c.interactionQA||c.aiQA||{};
  const br=(q.breaches||[]).map(b=>b.breach+" | "+b.evidence).join("\n");
  return `<div class="box stack"><div class="g2">
    <label class="f"><span>Staff tone</span><select data-d="qa.tone">${opts(TONES,dv(r,"qa.tone",q.tone||"courteous"))}</select></label>
    <label class="f"><span>Score (1–10)</span><input type="number" min="1" max="10" data-d="qa.score" value="${esc(dv(r,"qa.score",q.score||""))}"></label></div>
    <label class="f"><span>Breaches, one per line as “breach | quote or timestamp”</span><textarea data-d="qa.breaches">${esc(dv(r,"qa.breaches",br))}</textarea></label>
    <label class="f"><span>Coaching tips, one per line</span><textarea data-d="qa.coaching">${esc(dv(r,"qa.coaching",(q.coaching||[]).join("\n")))}</textarea></label>
    <div class="row"><button class="btn sm ok" data-act="saveQA">Record QA result</button><button class="btn sm" data-act="manualQA">Cancel</button></div></div>`;
}

/* section 2: routing & ownership */
function s2Route(c){
  const r=c.ref, cat=catOf(c);
  let b="";
  if(c.status==="new"){
    const can=allowed(c,"routed_to_unit");
    const unitSel=dv(r,"unit",c.unit);
    const qaDone=!cat.complaint||!!c.interactionQA;
    const tick=(ok,txt,extra)=>`<li style="list-style:none;margin:4px 0;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap"><span aria-hidden="true" style="font-weight:700;color:${ok?"var(--green)":"var(--red)"}">${ok?"✓":"✗"}</span><span>${txt}</span>${ok?"":extra||""}</li>`;
    b=`<div class="g2"><label class="f"><span class="req">Team</span><select data-d="unit">${opts(activeTeams().map(u=>({v:u.id,l:u.name})),tid(unitSel),"Choose team")}</select></label></div>
      <div class="box"><b class="sm">Before routing</b><ul style="margin:4px 0 0;padding:0" class="sm">
        ${tick(can,"You hold the Maker or Admin role",`<button class="btn link" data-act="goProfile">See your access</button>`)}
        ${tick(!!unitSel,"Team chosen")+(unitSel?`<li style="list-style:none;margin:2px 0 0 22px" class="muted">${teamMembers(unitSel).length} team member${teamMembers(unitSel).length===1?"":"s"} in ${esc(teamName(unitSel))} will see it in their Team queue.</li>`:"")}
        ${cat.complaint?tick(qaDone,"Interaction QA recorded for the original contact",`<span class="row" style="gap:6px"><button class="btn link" data-act="noneQA">Record “no staff interaction”</button><span class="muted">or attach the interaction in section 1</span></span>`):""}
      </ul></div>
      ${probsHtml(c,"routed_to_unit")}
      <div class="row"><button class="btn primary" data-act="route"${can?"":" disabled"}>Route to unit</button></div>
      ${allowed(c,"closed_duplicate")?`<details${(drafts[r]||{})._dupOpen?" open":""}><summary class="sm" style="cursor:pointer;font-weight:600">Close as duplicate</summary><div class="stack" style="margin-top:10px">
        <label class="f"><span>Original case</span><select data-d="dupOf">${opts(cases.filter(x=>x.ref!==c.ref&&x.status!=="closed_duplicate").map(x=>({v:x.ref,l:x.ref+": "+x.title.slice(0,60)})),dv(r,"dupOf",""),"Choose the original")}</select></label>
        <label class="f"><span>Reason</span><input type="text" data-d="dupReason" value="${esc(dv(r,"dupReason",""))}"></label>
        ${probsHtml(c,"closed_duplicate")}<div class="row"><button class="btn sm warn" data-act="dup">Close as duplicate</button></div></div></details>`:""}`;
  } else if(c.status==="closed_duplicate"){
    b=`<p style="margin:0">Closed as a duplicate of <b>${esc(c.duplicateOf)}</b> on ${fmt(c.closedAt)}. All clocks are void.</p>`;
  } else {
    const canAssign=isMgr()||unitHead(c);
    const unitPeople=teamMembers(c.unit).map(([id])=>({v:id,l:nameOf(id)}));
    b=`<dl class="kv"><dt>Team</dt><dd>${esc(teamName(c.unit))}</dd><dt>Routed</dt><dd>${fmt(c.routedAt)}</dd><dt>Owner</dt><dd>${esc(c.ownerId?nameOf(c.ownerId):"Unassigned")}${c.assignedAt?", since "+fmt(c.assignedAt):""}</dd></dl>
      ${c.status==="routed_to_unit"?`${probsHtml(c,"unit_input_pending")}<div class="row"><button class="btn primary" data-act="go" data-to="unit_input_pending"${allowed(c,"unit_input_pending")?"":" disabled"}>Accept case</button>${allowed(c,"unit_input_pending")?"":`<span class="sm muted">${c.ownerId?"Assigned to "+esc(nameOf(c.ownerId))+".":"Accepting is for team members of "+esc(teamName(c.unit))+"."}</span>`}</div>`:""}
      ${c.status==="routed_to_unit"&&!cat.complaint?`<div class="stack"><label class="f"><span>How was it resolved?</span><textarea data-d="ncReason">${esc(dv(r,"ncReason",""))}</textarea></label>${probsHtml(c,"resolved")}<div class="row"><button class="btn ok" data-act="ncResolve"${allowed(c,"resolved")?"":" disabled"}>Resolve</button></div></div>`:""}
      ${canAssign&&OPEN(c.status)?`<details><summary class="sm" style="cursor:pointer;font-weight:600">${c.ownerId?"Reassign":"Assign owner"}</summary><div class="stack" style="margin-top:10px">
        <label class="f"><span>Owner in ${esc(teamName(c.unit))}</span><select data-d="assignTo">${opts(unitPeople,dv(r,"assignTo",""),unitPeople.length?"Choose a team member":"No team members yet. Add them in Access.")}</select></label>
        ${c.ownerId?`<label class="f"><span class="req">Reason for reassignment</span><input type="text" data-d="assignReason" value="${esc(dv(r,"assignReason",""))}"></label>`:""}
        <div class="row"><button class="btn sm" data-act="assign">${c.ownerId?"Reassign":"Assign"}</button></div></div></details>`:""}`;
  }
  return `<section class="sect ${sectCls(c,2)}"><header><span class="no">2</span><h3>Routing and ownership</h3><span class="own">${esc(teamName(c.unit)||"Team")}</span></header><div class="b">${b}</div></section>`;
}

/* section 3: unit outbound call & input */
function s3Unit(c){
  const r=c.ref, owner=c.ownerId===me, editing=c.status==="unit_input_pending"&&owner;
  const calls=c.unitCalls||[];
  const cok=callsOk(c);
  const u=c.unitInput||{};
  if(["new","routed_to_unit","closed_duplicate"].includes(c.status)) return `<section class="sect lock"><header><span class="no">3</span><h3>Team outbound call and input</h3><span class="own">Case owner</span></header><div class="b"><p style="margin:0">Opens when a unit owner accepts the case.</p></div></section>`;
  const lastRework=[...(c.reviews||[])].reverse().find(x=>x.decision==="REWORK");
  const callList=calls.length?`<div class="tbl"><table><thead><tr><th>Attempt</th><th>When</th><th>Result</th><th>3CX call</th><th>Recording</th></tr></thead><tbody>${calls.map((x,i)=>`<tr><td>${i+1}</td><td>${fmt(x.at)}</td><td>${x.connected?`Connected${x.talk?", "+esc(x.talk)+"s":""}`:"Not connected"}${x.note?`<div class="sm muted">${esc(x.note)}</div>`:""}</td><td>${esc(x.callId||"—")}</td><td>${safeUrl(x.recordingUrl)?`<a href="${esc(safeUrl(x.recordingUrl))}" target="_blank" rel="noopener">Open</a>`:"—"}</td></tr>`).join("")}</tbody></table></div>`:`<p class="sm muted" style="margin:0">No call attempts logged yet.</p>`;
  let b=`${lastRework&&["rework_requested","unit_input_pending"].includes(c.status)?`<div class="callout"><b>Rework requested by ${esc(nameOf(lastRework.by))}, ${fmt(lastRework.at)}</b>${esc(lastRework.reasons)}</div>`:""}
    <div class="row"><b class="sm">Outbound calls to the client</b>${cok.ok?`<span class="flag blue">Requirement met: ${esc(cok.how)}</span>`:`<span class="flag amber">Needs a connected call with recording, or ${cfg.clocks.attempts} attempts over ${cfg.clocks.attemptDays} working days</span>`}</div>
    ${callList}`;
  if(c.status==="rework_requested"){
    b+=owner?`<label class="f"><span class="req">What will you change?</span><textarea data-d="rwPick">${esc(dv(r,"rwPick",""))}</textarea></label>${probsHtml(c,"unit_input_pending")}<div class="row"><button class="btn primary" data-act="pickRework">Pick up rework</button></div>`:`<p class="sm muted" style="margin:0">Waiting for ${esc(nameOf(c.ownerId))} to pick up the rework.</p>`;
  } else if(editing){
    b+=`<details${calls.length?"":" open"}><summary class="sm" style="cursor:pointer;font-weight:600">Log a call attempt</summary><div class="stack" style="margin-top:10px">
        <div class="g3"><label class="f"><span>When</span><input type="datetime-local" data-d="call.at" value="${esc(dv(r,"call.at",""))}"></label>
        <label class="f"><span>Connected?</span><select data-d="call.connected">${opts([{v:"yes",l:"Yes, spoke to the client"},{v:"no",l:"No answer / voicemail"}],dv(r,"call.connected","yes"))}</select></label>
        <label class="f"><span>Talk time (seconds)</span><input type="number" min="0" data-d="call.talk" value="${esc(dv(r,"call.talk",""))}"></label></div>
        <div class="g2"><label class="f"><span>3CX call history ID</span><input type="text" data-d="call.callId" value="${esc(dv(r,"call.callId",""))}"></label>
        <label class="f"><span>Recording link</span><input type="url" placeholder="https://" data-d="call.rec" value="${esc(dv(r,"call.rec",""))}"></label></div>
        <label class="f"><span>Note</span><input type="text" data-d="call.note" value="${esc(dv(r,"call.note",""))}"></label>
        <div class="row"><button class="btn sm" data-act="logCall">Log attempt</button><span class="sm muted">Automatic matching to the 3CX leg isn't connected here, so enter the call ID.</span></div></div></details>
      <div class="g2"><label class="f"><span class="req">Call outcome</span><select data-d="ui.outcome">${opts(cfg.outcomes,dv(r,"ui.outcome",u.outcome),"Choose outcome")}</select></label></div>
      ${dv(r,"ui.outcome",u.outcome)==="Client Dissatisfied / Demanded Escalation"?`<div class="callout red"><b>Escalation</b>Use “Escalate” in the side panel to send this to a department head with a reason.</div>`:""}
      <label class="f"><span class="req">What was discussed and agreed</span><textarea data-d="ui.notes">${esc(dv(r,"ui.notes",u.notes))}</textarea></label>
      <label class="f"><span class="req">Unit action summary</span><textarea data-d="ui.action">${esc(dv(r,"ui.action",u.action))}</textarea></label>
      ${probsHtml(c,"evaluator_review")}
      <div class="row"><button class="btn sm" data-act="saveUnit">Save input</button><button class="btn primary" data-act="submitUnit">Submit to evaluator</button></div>`;
  } else if(c.status==="unit_input_pending"){
    b+=`<p class="sm muted" style="margin:0">${esc(nameOf(c.ownerId))} is working on the unit input.</p>`;
  } else {
    b+=`<dl class="kv"><dt>Outcome</dt><dd>${esc(u.outcome)}</dd><dt>Discussed</dt><dd>${esc(u.notes)}</dd><dt>Action</dt><dd>${esc(u.action)}</dd><dt>Recorded by</dt><dd>${esc(nameOf(u.by))}, ${fmt(u.at)}</dd></dl>`;
  }
  return `<section class="sect ${sectCls(c,3)}"><header><span class="no">3</span><h3>Team outbound call and input</h3><span class="own">Case owner</span></header><div class="b">${b}</div></section>`;
}

/* section 4: evaluator gate */
function s4Eval(c){
  const r=c.ref, reviews=c.reviews||[];
  const past=reviews.length?`<div class="stack">${reviews.map(x=>`<div class="box"><div class="h"><span><b>${x.decision==="ACCEPT"?"Accepted":"Returned for rework"}</b> by ${esc(nameOf(x.by))}</span><span>${fmt(x.at)}</span></div>${x.reasons?`<pre>${esc(x.reasons)}</pre>`:""}</div>`).join("")}</div>`:"";
  let b="";
  if(c.status==="evaluator_review"){
    if(has("checker")){
      const why=independence(c);
      if(why.length) b=`<div class="callout red"><b>You can't review this case</b>${esc(why.join("; "))}. Another Checker must review it. Attempts are logged.</div>${past}`;
      else{
        const rca=c.rca||{}, l1=dv(r,"rca.l1",rca.l1), l2s=(cfg.rca[l1]||[]);
        const q=c.interactionQA, sug=q&&!q.none?((q.breaches||[]).length?3:q.score<=4||["dismissive","defensive"].includes(q.tone)?2:q.score<=6?1:0):0;
        b=`${q&&!q.none?`<div class="sm">Interaction QA: score <b>${esc(q.score)}</b>, tone <b>${esc(q.tone)}</b>, ${(q.breaches||[]).length} breach(es).</div>`:""}
          <dl class="kv"><dt>Calls</dt><dd>${esc(callsOk(c).how||"")}</dd><dt>Outcome</dt><dd>${esc((c.unitInput||{}).outcome)}</dd><dt>Discussed</dt><dd>${esc((c.unitInput||{}).notes)}</dd><dt>Action</dt><dd>${esc((c.unitInput||{}).action)}</dd></dl>
          <div class="gate">
            <div class="a"><h4>Accept</h4>
              <div class="g2"><label class="f"><span class="req">RCA category</span><select data-d="rca.l1">${opts(Object.keys(cfg.rca),l1,"Choose")}</select></label>
              <label class="f"><span>RCA sub-category</span>${l2s.length?`<select data-d="rca.l2">${opts(l2s,dv(r,"rca.l2",rca.l2),"Choose")}</select>`:`<input type="text" data-d="rca.l2" value="${esc(dv(r,"rca.l2",rca.l2))}">`}</label></div>
              <label class="f"><span class="req">RCA note</span><textarea data-d="rca.note">${esc(dv(r,"rca.note",rca.note))}</textarea></label>
              <label class="f"><span>Preventive action</span><input type="text" data-d="rca.prev" value="${esc(dv(r,"rca.prev",rca.preventive))}"></label>
              <div class="g2"><label class="f"><span class="req">Validity</span><select data-d="validity">${opts(VALIDITY,dv(r,"validity",c.validity),"Choose")}</select></label>
              <label class="f"><span class="req">Consequence level <span class="prop">Recorded only until D8 is signed</span></span><select data-d="level">${opts(Object.entries(CONSEQ).map(([v,l])=>({v,l:l+(+v===sug&&q&&!q.none?" (suggested)":"")})),dv(r,"level",""),"Choose")}</select></label></div>
              ${probsHtml(c,"rca_complete")}
              <button class="btn ok" data-act="accept">Accept</button></div>
            <div class="r"><h4>Return for rework</h4>
              <label class="f"><span class="req">Reasons: exactly what the unit must redo or provide</span><textarea data-d="rwReason" style="min-height:130px">${esc(dv(r,"rwReason",""))}</textarea></label>
              ${probsHtml(c,"rework_requested")}
              <button class="btn warn" data-act="rework">Return for rework</button></div>
          </div>${past}`;
      }
    } else b=`<p style="margin:0">Waiting at the evaluator gate. No complaint skips this review.</p>${past}`;
  } else if(["rca_complete","resolved"].includes(c.status)&&c.rca){
    b=`<dl class="kv"><dt>RCA</dt><dd>${esc(c.rca.l1)}${c.rca.l2?" / "+esc(c.rca.l2):""}</dd><dt>Note</dt><dd>${esc(c.rca.note)}</dd>${c.rca.preventive?`<dt>Preventive</dt><dd>${esc(c.rca.preventive)}</dd>`:""}<dt>Validity</dt><dd>${esc(c.validity)}</dd><dt>Consequence</dt><dd>${esc(CONSEQ[c.consequenceLevel||0])}</dd></dl>${past}`;
  } else b=past||`<p style="margin:0">Opens when the unit submits its input.</p>`;
  return `<section class="sect ${sectCls(c,4)}"><header><span class="no">4</span><h3>Evaluator review and RCA</h3><span class="own">Checker</span></header><div class="b">${b}</div></section>`;
}

/* section 5: controlled response & resolution */
function s5Resolve(c){
  const r=c.ref, cat=catOf(c), n=cat.complaint?5:3;
  const pub=c.channel==="Google Review"||c.channel==="Social";
  let b="";
  if(c.status==="resolved"){
    b=`${c.response?`<div class="box"><div class="h"><span><b>Controlled response</b> by ${esc(nameOf(c.response.by))}</span><span>${fmt(c.response.at)}</span></div><pre>${esc(c.response.text)}</pre></div>`:""}${c.resolution?`<dl class="kv"><dt>Resolution</dt><dd>${esc(c.resolution)}</dd></dl>`:""}
      <p class="sm muted" style="margin:0">Resolved ${fmt(c.resolvedAt)}. All clocks stopped.</p>
      ${isMgr()&&Date.now()-new Date(c.resolvedAt)<=cfg.clocks.reopenDays*864e5?`<details><summary class="sm" style="cursor:pointer;font-weight:600">Reopen</summary><div class="stack" style="margin-top:10px"><label class="f"><span class="req">Reason</span><input type="text" data-d="reopenReason" value="${esc(dv(r,"reopenReason",""))}"></label>${probsHtml(c,"unit_input_pending")}<div class="row"><button class="btn sm warn" data-act="reopen">Reopen to unit</button><span class="sm muted">Starts a new unit-action clock.</span></div></div></details>`:""}`;
  } else if(c.status==="closed_duplicate"){ return ""; }
  else if(!cat.complaint){ return ""; }
  else {
    const canDraft=isMgr()||has("maker")||has("checker");
    if(!canDraft) b=`<p style="margin:0">The Maker records the controlled response after the Checker accepts.</p>`;
    else{
      b=`${pub?`<div class="callout"><b>Public reply</b>This goes on ${esc(c.channel)}. Leave out the customer's name, contact details and case details.</div>`:""}
        <label class="f"><span>Response to the customer</span><textarea data-d="resp" style="min-height:160px"${busy[r]?" readonly":""}>${esc(dv(r,"resp",c.responseDraft))}</textarea></label>
        ${sample?`<div class="pbar"><input type="text" data-d="prompt" placeholder="Tell Claude how to change the draft" aria-label="Prompt" value="${esc(dv(r,"prompt",""))}"><button class="btn sm primary" data-act="applyPrompt"${busy[r]?" disabled":""}>Apply prompt</button></div><div class="chips">${CHIPS.map(p=>`<button class="chip" data-act="chip" data-p="${esc(p)}">${esc(p)}</button>`).join("")}</div>`:""}
        <div class="row"><button class="btn sm" data-act="saveDraft">Save draft</button>${undo[r]!=null?`<button class="btn sm" data-act="undoDraft">Undo last prompt</button>`:""}</div>
        <p class="sm muted" style="margin:0">Review every AI-refined draft. Don't admit liability, promise compensation or cite law unless verified and approved by Legal.</p>

async function saveMember(){
  const f=drafts._mem, p=[];
  const name=String(f.name||"").trim(); if(!name) p.push("Enter the person's name.");
  if((f.roles||[]).includes("team")&&!(f.teams||[]).length) p.push("A team member needs at least one team.");
  if(f.email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email)) p.push("The email address doesn't look right.");
  if(f.userId){ const dup=Object.entries(members).find(([id,m])=>id!==f.id&&m.userId===f.userId&&m.active!==false); if(dup) p.push("That sign-in is already linked to "+dup[1].name+"."); }
  f.probs=p; if(p.length){ renderProfile(); return; }
  const id=f.id||("m_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
  const prev=members[id]||null;
  const doc={name,employeeId:String(f.employeeId||"").trim(),designation:String(f.designation||"").trim(),email:String(f.email||"").trim().toLowerCase(),extension:String(f.extension||"").trim(),userId:f.userId||null,advisor:!!f.advisor,teams:f.teams||[],roles:f.roles||[],active:f.active!==false,test:!!(prev&&prev.test),createdAt:prev?prev.createdAt:iso(),updatedAt:iso(),updatedBy:me};
