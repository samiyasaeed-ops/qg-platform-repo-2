async function upload(file){
  const c=cur(); if(!c||!assets) return;
  if(file.size>20*1024*1024){ toast("Files can be up to 20 MB."); return; }
  busy[c.ref]="Uploading "+file.name; renderDetail(true);
  try{
    const ext=(file.name.split(".").pop()||"").toLowerCase();
    const typeMap={pdf:"application/pdf",png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",webp:"image/webp",gif:"image/gif",csv:"text/csv",txt:"text/plain",json:"application/json",md:"text/markdown",mp4:"video/mp4"};
    const res=await assets.upload(file,file.type?undefined:{type:typeMap[ext]});
    const a={id:res.id,name:file.name,size:res.sizeBytes,type:res.contentType,by:me,at:iso()};
    await updateCase(c.ref,{attachments:[...(c.attachments||[]),a]}); await addEvent(c.ref,"LINK",{reason:"Attached "+file.name});
    toast("File attached.");
  }catch(e){ toast(e&&e.code==="rejected_type"?"That file type isn't accepted. Use PDF, image, video or text.":"The file didn't upload. Try again."); }
  delete busy[c.ref]; renderDetail(true);
}

/* ========================= AI ========================= */
async function runQA(c){
  const r=c.ref, withText=(c.interactions||[]).filter(x=>(x.content||"").trim());
  if(!withText.length){ toast("Add the transcript, thread or email text first. Audio alone can't be audited."); return; }
  busy[r]="Auditing the original interaction. This can take up to a minute."; renderDetail(true);
  const evid=c.interactions.map((x,i)=>`#${i+1} ${QA_CHANNELS[x.channel]}${x.at?", "+x.at:""}\n${x.content||"(no transcript)"}`).join("\n\n---\n\n");
  try{
    const out=await sample.json(`${QA_PROMPT}

Response schema:
{"tone":"courteous|defensive|dismissive|exemplary","qualityScore":<integer 1-10>,"protocolBreaches":[{"breach":"<short name>","evidence":"<verbatim quote or timestamp from the evidence>"}],"coachingTips":["<tip>","<tip>"]}

Case context: ${c.title}. ${c.description}

Interaction evidence:
${evid}`,{cache:false});
    const tone=String(out.tone||"").toLowerCase(), score=Math.round(+out.qualityScore);
    if(!TONES.includes(tone)||!(score>=1&&score<=10)) throw {code:"bad_shape"};
    const s={tone,score,breaches:(Array.isArray(out.protocolBreaches)?out.protocolBreaches:[]).map(b=>({breach:String(b.breach||"").slice(0,300),evidence:String(b.evidence||"").slice(0,600)})).filter(b=>b.breach),coaching:(Array.isArray(out.coachingTips)?out.coachingTips:[]).map(String).slice(0,5),model:"claude (qa-v1)",at:iso()};
    await updateCase(r,{aiQA:s}); await addEvent(r,"AI_SUGGEST",{reason:"Interaction QA suggestion: score "+score+", tone "+tone,payload:s});
  }catch(e){ toast(e&&e.code==="rate_limited"?"Too many AI requests right now. Try again in a minute.":e&&e.code==="not_granted"?"The AI audit needs your permission. You can enter the result by hand instead.":"The AI audit didn't finish. Try again or enter the result by hand."); }
  delete busy[r]; renderDetail(true);
}
async function applyPrompt(c){
  const r=c.ref, d=drafts[r]||(drafts[r]={}), instr=String(d.prompt||"").trim();
  if(!instr){ toast("Type an instruction first, for example “Make more concise for mobile”."); return; }
  const current=String(d.resp??c.responseDraft??""), pub=c.channel==="Google Review"||c.channel==="Social", u=c.unitInput||{};
  const facts=[`Case ${c.ref}, ${catName(c.category)}, channel ${c.channel}, branch ${c.branch}.`,`Complaint: ${c.title}. ${c.description}`,
    u.outcome?`A ${teamName(c.unit)} team member called the customer. Outcome: ${u.outcome}. Discussed: ${u.notes}`:"",u.action?`Action taken: ${u.action}`:"",
    c.rca&&c.rca.preventive?`Preventive action: ${c.rca.preventive}`:"",
    pub?`This reply is public on ${c.channel}: it must not contain the customer's name, contact details, policy or case details.`:`Customer first name for a private reply: ${String((c.customer||{}).name||"").split(" ")[0]}`].filter(Boolean).join("\n");
  undo[r]=current; busy[r]="Rewriting the draft."; renderDetail(true);
  try{
    const res=await sample(`${REFINE_PROMPT}\n\nInstruction: ${instr}\nDraft: ${current.trim()?current:"(empty: write a first draft from the case facts)"}\nCase facts: ${facts}\n\nReply with only the rewritten response text, with no preamble or notes.`,{cache:false,onText:({text})=>{const ta=document.querySelector('#detail textarea[data-d="resp"]'); if(ta) ta.value=text;}});
    d.resp=res.text.trim(); d.prompt="";
    toast(res.truncated?"The rewrite was cut short. Ask for a shorter reply.":"Draft updated. Review it before saving.");
  }catch(e){ delete undo[r]; toast(e&&e.code==="rate_limited"?"Too many AI requests right now. Try again in a minute.":"The rewrite didn't finish. Your draft is unchanged."); }
  delete busy[r]; renderDetail(true);
}
async function suggestIntake(){
  const s=regState; const text=(s.title||"")+"\n"+(s.description||"");
  if(text.trim().length<10){ toast("Add a title and description first."); return; }
  s.busy=true; renderRegister();
  const cats=cfg.categories.filter(c=>c.active);
  try{
    const out=await sample.json(`Classify this customer case for an insurance brokerage. Choose the category from this list of codes only: ${cats.map(c=>c.code+" ("+c.name+")").join(", ")}.
Also score the customer's sentiment from -1 (very negative) to 1 (very positive).
Reply with only JSON: {"category":"<code>","confidence":<0-1>,"top3":[{"category":"<code>","confidence":<0-1>}],"sentiment":<-1..1>}

Case:
${text.slice(0,8000)}`,{cache:false,modelTier:"quick"});
    const valid=c=>cats.some(x=>x.code===c);
    const cat=valid(out.category)?out.category:null;
    const sent=Math.max(-1,Math.min(1,+out.sentiment||0));
    const top3=(Array.isArray(out.top3)?out.top3:[]).filter(t=>valid(t.category)).slice(0,3);
    const conf=cat?Math.max(0,Math.min(1,+out.confidence||0)):0;
    const base=cat?(cfg.categories.find(x=>x.code===cat).priority):cfg.priorities[1]||cfg.priorities[0];
    const pr=cfg.priorities, i=pr.indexOf(base), priority=sent<=-0.5&&i>0?pr[i-1]:base;
    s.ai={category:cat,confidence:conf,top3:top3.length?top3:(cat?[{category:cat,confidence:conf}]:[]),sentiment:sent,priority,at:iso()};
  }catch(e){ toast("The suggestion didn't come back. Choose the category and priority yourself."); }
  s.busy=false; renderRegister();
}
async function registerCase(){
  const s=regState, p=[];
  ["cName","channel","title","description","category","priority"].forEach(k=>{ if(!String(s[k]||"").trim()) p.push({cName:"Customer name",channel:"Channel",title:"Title",description:"Description",category:"Category",priority:"Priority"}[k]+" is required."); });
  if(s.cEmail&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s.cEmail)) p.push("The email address doesn't look right.");
  if(s.srcType&&!String(s.srcId||"").trim()) p.push("Add the source ID, or set Source to None.");
  s.probs=p; if(p.length){ renderRegister(); return; }
  s.saving=true; renderRegister();
  try{
    const ref=await nextRef(), now=iso(), cat=cfg.categories.find(x=>x.code===s.category);
    const advId=s.advisorId&&members[s.advisorId]?s.advisorId:null;
    const c={ref,status:"new",statusAt:now,channel:s.channel,branch:s.branch||cfg.branches[0],lob:s.lob||"",category:s.category,complaint:!!cat.complaint,priority:s.priority,title:s.title.trim(),description:s.description.trim(),
      customer:{name:s.cName.trim(),email:String(s.cEmail||"").trim().toLowerCase(),mobile:String(s.cMobile||"").trim(),provisional:true},
      advisor:advId?{name:members[advId].name,id:advId}:(s.advisor?{name:s.advisor.trim(),id:null}:null),
      sentiment:s.ai&&s.aiAccepted?s.ai.sentiment:null,
      ai:s.ai?{...s.ai,accepted:!!s.aiAccepted}:null,
      links:s.srcType?[{source:s.srcType,id:s.srcId.trim(),date:s.srcDate||null,by:me,at:now}]:[],
      interactions:[],unitCalls:[],actions:[],reviews:[],attachments:[],reworkCount:0,
      clocks:{ack:{start:now,due:addWH(now,cat.ackH??cfg.clocks.ackH),stop:null},...(cat.res&&cat.res.v?{resolution:{start:now,due:cat.res.u==="h"?addWH(now,cat.res.v):addWD(now,cat.res.v),stop:null}}:{})},
      ownerId:null,unit:"",openedAt:now,createdBy:me,updatedAt:now};
    await createCase(c);
    await addEvent(ref,"CREATED",{to:"new",reason:"Registered via "+c.channel});
    if(s.ai) await addEvent(ref,"AI_SUGGEST",{reason:"Intake suggestion: "+(s.ai.category?catName(s.ai.category)+" ("+Math.round(s.ai.confidence*100)+"%)":"no confident category")+", sentiment "+s.ai.sentiment.toFixed(2),payload:s.ai});
    if(s.ai&&s.aiAccepted) await addEvent(ref,"AI_ACCEPT",{reason:"Suggestions accepted"+(s.category!==s.ai.category||s.priority!==s.ai.priority?" with overrides":"")});
    regState={}; selRef=ref; queue="intake"; setView("cases"); watchEvents(ref); toast(ref+" registered.");
  }catch(e){ s.saving=false; renderRegister(); if(!(e&&e.code==="invalid_argument")) toast("The case wasn't registered. Try again."); }
}

/* ========================= admin & profile actions ========================= */
async function saveConfig(){
  const a=drafts._cfg;
  if(!a.categories.length){ toast("Keep at least one category."); return; }
  const next=clone(a); delete next._grants;
  next.units=clone(cfg.units);
  next.categories=next.categories.filter(c=>c.name.trim()).map(c=>({...c,code:c.code||c.name.trim().toUpperCase().replace(/[^A-Z0-9]+/g,"_")}));
  next.version=(cfg.version||1)+1;
  const changed=Object.keys(next).filter(k=>k!=="version"&&JSON.stringify(next[k])!==JSON.stringify(cfg[k]));
  const g=null;
  try{
    if(changed.length){
      if(mode==="db"){ await db.doc("config/settings").set(next); } else { cfg=next; }
      await addLog("config_events",{version:next.version,changed,before:Object.fromEntries(changed.map(k=>[k,cfg[k]])),after:Object.fromEntries(changed.map(k=>[k,next[k]]))});
    }
    drafts._cfg=null; toast(changed.length||g?"Configuration saved"+(changed.length?" (version "+next.version+")":"")+".":"Nothing changed.");
    if(mode==="local") renderAll();
  }catch(e){ writeErr(e); }
}
async function auditExtract(){
  const from=$("#exFrom").value, to=$("#exTo").value;
  if(!from||!to||from>to){ toast("Choose a valid period."); return; }
  const fromIso=new Date(from+"T00:00:00+04:00").toISOString(), toIso=new Date(to+"T23:59:59+04:00").toISOString();
  const inPeriod=cases.filter(c=>c.openedAt>=fromIso&&c.openedAt<=toIso);
  if(!inPeriod.length){ toast("No cases were opened in that period."); return; }
  let evs=[]; try{ evs=await allEventsSince(fromIso); }catch(_){ toast("The event history couldn't be read. Try again."); return; }
  const refs=new Set(inPeriod.map(c=>c.ref));
  const q=v=>{v=v==null?"":String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const head=["case_ref","category","complaint","priority","channel","lob","unit","branch","status","owner","opened_at","acknowledged_at","resolved_at","ack_due","ack_breached","unit_action_due","unit_action_breached","rework_count","resolution_due","resolution_breached","escalated","rca_l1","rca_l2","rca_note","validity","consequence_level","event_at","event_type","event_from","event_to","event_by","event_reason"];
  const br=k=>{const s=clockState(k);return s?(s.s==="breached"||s.s==="over"?"Y":"N"):"";};
  const rows=[head.join(",")];
  inPeriod.forEach(c=>{
    const ck=c.clocks||{};
    const base=[c.ref,catName(c.category),catOf(c).complaint?"Y":"N",c.priority,c.channel,c.lob,teamName(c.unit),c.branch,SL[c.status],c.ownerId?nameOf(c.ownerId).replace(" (you)",""):"",c.openedAt,c.acknowledgedAt||"",c.resolvedAt||"",(ck.ack||{}).due||"",br(ck.ack),(ck.unitAction||{}).due||"",br(ck.unitAction),c.reworkCount||0,(ck.resolution||{}).due||"",br(ck.resolution),c.escalation&&c.escalation.active?"Y":"N",(c.rca||{}).l1||"",(c.rca||{}).l2||"",(c.rca||{}).note||"",c.validity||"",c.consequenceLevel??""];
    const ce=evs.filter(e=>e.caseRef===c.ref).sort((a,b)=>a.at.localeCompare(b.at));
    (ce.length?ce:[{}]).forEach(e=>rows.push([...base,e.at||"",e.type||"",e.from||"",e.to||"",e.by?nameOf(e.by).replace(" (you)",""):"",e.reason||""].map(q).join(",")));
  });
  try{
    await downloads.save({filename:`alfred-care-audit-${from}-to-${to}.csv`,data:rows.join("\n")});
    await addLog("extracts",{from,to,cases:inPeriod.length});
  }catch(e){ if(!(e&&e.code==="declined")) toast("The file couldn't be saved."); }
}

/* ========================= events wiring ========================= */
function wire(){
  document.querySelector(".rail").addEventListener("click",e=>{const b=e.target.closest("[data-view]"); if(b) setView(b.dataset.view);});
  $("#regBtn").addEventListener("click",()=>setView("register"));
  $("#nowPage").addEventListener("click",e=>{
    const t=e.target.closest("[data-goq]"); if(t){ queue=t.dataset.goq; setView("cases"); return; }
    const s=e.target.closest("[data-sel]"); if(s){ selRef=s.dataset.sel; watchEvents(selRef); setView("cases"); }
  });
  $("#ql").addEventListener("click",e=>{const b=e.target.closest("[data-q]"); if(!b) return; queue=b.dataset.q; renderQueues(); renderList();});
  $("#items").addEventListener("click",e=>{const b=e.target.closest("[data-sel]"); if(!b) return; selRef=b.dataset.sel; watchEvents(selRef); renderList(); renderDetail(true); $("#detail").scrollTop=0; if(innerWidth<=760) scrollTo(0,0);});
  $("#q").addEventListener("input",e=>{qText=e.target.value; renderList();});
  $("#fCat").addEventListener("change",e=>{fCat=e.target.value; renderList();});
  $("#fUnit").addEventListener("change",e=>{fUnit=e.target.value; renderList();});
  const det=$("#detail");
  const track=e=>{
    const el=e.target.closest("[data-d]"), c=cur(); if(!el||!c) return;
    const d=drafts[c.ref]||(drafts[c.ref]={});
    d[el.dataset.d]=el.type==="checkbox"?el.checked:el.value;
    if(e.type==="change"&&["ui.outcome","rca.l1","unit"].includes(el.dataset.d)) renderDetail(true);
  };
  det.addEventListener("input",track); det.addEventListener("change",track);
  det.addEventListener("change",e=>{ if(e.target.matches("[data-act-file]")&&e.target.files[0]){ upload(e.target.files[0]); e.target.value=""; } });
  det.addEventListener("click",e=>{const b=e.target.closest("[data-act]"); if(!b) return; e.preventDefault(); onAct(b.dataset.act,b);});
  det.addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target.matches('[data-d="prompt"]')){ e.preventDefault(); const c=cur(); if(c) applyPrompt(c); } });
  det.addEventListener("focusout",()=>setTimeout(()=>{ if(pendingDetail&&!(det.contains(document.activeElement)&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName))) renderDetail(true); },0));
  const reg=$("#regPage");
  const rtrack=e=>{const el=e.target.closest("[data-r]"); if(el) regState[el.dataset.r]=el.value;};
  reg.addEventListener("input",rtrack); reg.addEventListener("change",rtrack);
  reg.addEventListener("click",e=>{
    const b=e.target.closest("[data-ract]"); if(!b) return; e.preventDefault();
    const a=b.dataset.ract, s=regState;
    if(a==="suggest") suggestIntake();
    if(a==="pickCat"){ s.category=b.dataset.v; renderRegister(); }
    if(a==="acceptAi"){ if(s.ai.category&&s.ai.confidence>=0.6) s.category=s.ai.category; s.priority=s.ai.priority; s.aiAccepted=true; renderRegister(); toast("Suggestions applied. You can still change them."); }
    if(a==="create") registerCase();
    if(a==="reset"){ regState={}; renderRegister(); }
  });
  const prof=$("#profilePage");
  const ptrack=e=>{
    const el=e.target;
    if(el.dataset.tf!=null){ const t=drafts._teams[+el.dataset.tf]; t[el.dataset.f]=el.type==="checkbox"?el.checked:el.value; }
    const f=drafts._mem; if(!f) return;
    if(el.dataset.mf) f[el.dataset.mf]=el.type==="checkbox"?el.checked:el.value;
    if(el.dataset.mrole){ const r=el.dataset.mrole; f.roles=el.checked?[...new Set([...(f.roles||[]),r])]:(f.roles||[]).filter(x=>x!==r); }
  };
  prof.addEventListener("input",ptrack); prof.addEventListener("change",ptrack);
  prof.addEventListener("click",e=>{
    const tc=e.target.closest("[data-mteam]"); if(tc&&drafts._mem){ const f=drafts._mem,id=tc.dataset.mteam; f.teams=(f.teams||[]).includes(id)?f.teams.filter(x=>x!==id):[...(f.teams||[]),id]; renderProfile(); return; }
    const b=e.target.closest("[data-xact]"); if(!b) return; const a=b.dataset.xact;
    if(a==="newMem"){ drafts._mem={id:null,roles:[],teams:[],active:true}; renderProfile(); $("#memForm")?.scrollIntoView({block:"start"}); }
    if(a==="editMem"){ const m=members[b.dataset.id]; drafts._mem={...clone(m),id:b.dataset.id}; renderProfile(); $("#memForm")?.scrollIntoView({block:"start"}); }
    if(a==="cancelMem"){ drafts._mem=null; renderProfile(); }
    if(a==="saveMem") saveMember();
    if(a==="addSelf"){ drafts._mem={id:null,name:meName||"",roles:["admin"],teams:[],active:true,userId:uid}; renderProfile(); $("#memForm")?.scrollIntoView({block:"start"}); }
    if(a==="seed") seedTestPeople();
    if(a==="addTeam"){ drafts._teams.push({id:"t-"+Date.now().toString(36),name:"",lob:"",headId:"",active:true}); renderProfile(); }
    if(a==="delTeam"){ const t=drafts._teams[+b.dataset.i];
      if(t&&cases.some(c=>tid(c.unit)===t.id&&OPEN(c.status))){ toast("That team has open cases. Reroute or close them first, or mark the team inactive."); return; }
      if(t&&Object.values(members).some(m=>(m.teams||[]).includes(t.id))){ toast("Move this team's members first, or mark the team inactive."); return; }
      drafts._teams.splice(+b.dataset.i,1); renderProfile(); }
    if(a==="saveTeams") saveTeams();
  });
  $("#meBox").addEventListener("change",e=>{ if(e.target.id!=="actAs") return; actingAs=e.target.value||null; try{ sessionStorage.setItem("care-acting",actingAs||""); }catch(_){} Object.keys(problems).forEach(k=>delete problems[k]); syncMe(); queue="open"; renderAll(); toast(actingAs?"Now acting as "+members[actingAs].name+".":"Back to yourself."); });
  $("#testBar").addEventListener("click",e=>{ if(e.target.id!=="stopAct") return; actingAs=null; try{ sessionStorage.removeItem("care-acting"); }catch(_){} syncMe(); renderAll(); });
  const adm=$("#adminPage");
  const atrack=e=>{
    const a=drafts._cfg; if(!a) return; const el=e.target;
    if(el.id==="exFrom") drafts._exFrom=el.value;
    if(el.id==="exTo") drafts._exTo=el.value;
    if(el.dataset.ac!=null){ const c=a.categories[+el.dataset.ac], f=el.dataset.f;
      if(f==="resV"||f==="resU"){ c.res=c.res||{v:null,u:"d"}; if(f==="resV") c.res.v=el.value===""?null:+el.value; else c.res.u=el.value; if(c.res.v==null) c.res=null; }
      else if(f==="ackH") c.ackH=el.value===""?null:+el.value;
      else c[f]=el.type==="checkbox"?el.checked:el.value; }
    if(el.dataset.ak) a.clocks[el.dataset.ak]=Math.max(0,+el.value||0);
    if(el.dataset.aw!=null){ const i=+el.dataset.aw, f=el.dataset.f;
      if(f==="on"){ a.calendar.week[i]=el.checked?{o:"09:00",c:"17:00"}:null; renderAdmin(); }
      else if(a.calendar.week[i]) a.calendar.week[i][f]=el.value; }
    if(el.dataset.au!=null) a.units[+el.dataset.au][el.dataset.f]=el.value;
    if(el.dataset.alist){ const k=el.dataset.alist;
      if(k==="holidays") a.calendar.holidays=lines(el.value).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x));
      else if(k==="rca"){ const o={}; lines(el.value).forEach(l=>{const [h,...t]=l.split(":"); o[h.trim()]=t.join(":").split(",").map(x=>x.trim()).filter(Boolean);}); a.rca=o; }
      else a[k]=[...new Set(lines(el.value))]; }
  };
  adm.addEventListener("input",atrack); adm.addEventListener("change",atrack);
  adm.addEventListener("click",e=>{
    const b=e.target.closest("[data-aact]"); if(!b) return; const a=drafts._cfg;
    const act=b.dataset.aact;
    if(act==="extract") return auditExtract();
    if(act==="save") return saveConfig();
    if(act==="discard"){ drafts._cfg=null; renderAdmin(); return; }
    if(act==="addCat"){ a.categories.push({code:"",name:"New category",complaint:false,regulatory:false,priority:a.priorities[0],ackH:null,res:null,active:true}); renderAdmin(); }
    if(act==="addUnit"){ a.units.push({name:"",headId:""}); renderAdmin(); }
    if(act==="delUnit"){ const u=a.units[+b.dataset.i]; if(u&&cases.some(c=>c.unit===u.name&&OPEN(c.status))){ toast("That unit has open cases. Reroute them first."); return; } a.units.splice(+b.dataset.i,1); renderAdmin(); }
  });
}

/* ========================= boot ========================= */
setInterval(()=>{ if(document.hidden) return; if(view==="now") renderNow(); if(view==="cases"){ renderQueues(); if(!$("#items").matches(":hover")) renderList(); } },60000);
async function boot(){
  try{ actingAs=sessionStorage.getItem("care-acting")||null; }catch(_){}
  syncMe(); wire(); renderAll();
  const use=n=>(window.claude&&window.claude.use?window.claude.use(n):Promise.resolve(null)).catch(()=>null);
  [db,user,sample,downloads,assets]=await Promise.all([use("db"),use("user"),use("sample"),use("downloads"),use("assets")]);
  if(user){ try{ const m=await user.me(); uid=m.id; meName=m.name; meAvatar=m.avatarUrl; isOwner=!!(m.isOwner||m.canEdit); if(uid&&m.name) names[uid]=m.name; }catch(_){} }
  if(db&&uid){
    mode="db";
    db.doc("config/settings").onSnapshot(s=>{ if(s.exists){ const d=s.data(); cfg=deepMerge(clone(DEFAULT_CFG),d); cfg.units=(d.units||DEFAULT_CFG.units).map(u=>u.id?u:{...u,id:"t-"+String(u.name).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""),active:true}); cfg.categories=d.categories||cfg.categories; cfg.rca=d.rca||cfg.rca; } if(!typingIn("#profilePage")) drafts._teams=null; renderAll(); },()=>{});
    db.collection("members").onSnapshot(s=>{ members={}; s.docs.forEach(d=>members[d.id]=d.data()); syncMe(); renderAll(); },()=>{});
    db.collection("people").onSnapshot(s=>{ people={}; s.docs.forEach(d=>people[d.id]=d.data()); renderAll(); },()=>{});
    db.collection("cases").onSnapshot(s=>{ cases=s.docs.map(d=>d.data()); loaded=true; renderAll(); },()=>{ loaded=true; const b=$("#banner"); b.hidden=false; b.textContent="Cases couldn't load. Reload the page to try again."; renderAll(); });
    try{ await db.doc("people/"+uid).set({seenAt:iso()}); }catch(_){}
  } else {
    uid=uid||"local-user"; isOwner=true; loaded=true; mode="local"; people[uid]={seenAt:iso()};
    const b=$("#banner"); b.hidden=false; b.textContent="Nothing is being saved in this view. Open the published page while signed in to keep a shared case register.";
    syncMe(); renderAll();
  }
  setTimeout(()=>{ if(mode!=="db") return; const b=$("#banner"); if(!b.hidden) return;
    if(!persona()&&!realAdmin()){ b.hidden=false; b.textContent="You don't have access yet. Ask a Q&G Admin to add you in Access and link your sign-in."; }
    else if(realAdmin()&&!Object.keys(members).length){ b.hidden=false; b.innerHTML='Start in <button class="btn link" id="goAcc">Access</button>: add your teams and people, or create test people to try every role.'; const g=$("#goAcc"); if(g) g.onclick=()=>{ b.hidden=true; setView("profile"); }; }
  },2500);
}
function typingIn(sel){ const el=$(sel); return el&&el.contains(document.activeElement)&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName); }
boot();
})();
