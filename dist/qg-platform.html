<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Q&amp;G Platform · Alfred Holdings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --chrome:#10212B; --chrome-2:#162B37; --chrome-ink:#AFC0C8; --chrome-hi:#FFFFFF;
  --paper:#F3F5F5; --surface:#FFFFFF; --sunk:#EAEFF0; --ink:#13212A; --muted:#5B6B73; --line:#D7DEE0; --line-2:#E7ECED;
  --cx:#2554A3; --cx-soft:#E1E9F6; --qa:#1D7A52; --qa-soft:#DFF0E7; --gr:#7A3E9D; --gr-soft:#EFE4F5; --lib:#5B6B73; --lib-soft:#E7ECED;
  --red:#B4302A; --red-soft:#F8E1DF; --amber:#9A5B0B; --amber-soft:#F7EAD5; --focus:#2563B8;
  --font:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --chrome:#0A151C; --chrome-2:#11202A; --chrome-ink:#93A6AF; --paper:#121C22; --surface:#18252D; --sunk:#1E2D36; --ink:#E4ECEF; --muted:#9AABB3; --line:#2B3B44; --line-2:#22313A;
  --cx:#7FA6EA; --cx-soft:#1B2B47; --qa:#5BC495; --qa-soft:#163428; --gr:#C59BE0; --gr-soft:#2E2138; --lib:#9AABB3; --lib-soft:#22313A; --red:#F08A80; --red-soft:#3D1F1C; --amber:#E2A657; --amber-soft:#3A2A14; --focus:#8DB4F5; color-scheme:dark; } }
:root[data-theme="dark"]{
  --chrome:#0A151C; --chrome-2:#11202A; --chrome-ink:#93A6AF; --paper:#121C22; --surface:#18252D; --sunk:#1E2D36; --ink:#E4ECEF; --muted:#9AABB3; --line:#2B3B44; --line-2:#22313A;
  --cx:#7FA6EA; --cx-soft:#1B2B47; --qa:#5BC495; --qa-soft:#163428; --gr:#C59BE0; --gr-soft:#2E2138; --lib:#9AABB3; --lib-soft:#22313A; --red:#F08A80; --red-soft:#3D1F1C; --amber:#E2A657; --amber-soft:#3A2A14; --focus:#8DB4F5; color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:14.5px/1.5 var(--font);display:flex;flex-direction:column;overflow:hidden;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}

.bar{background:var(--chrome);color:var(--chrome-ink);display:flex;align-items:center;gap:14px;padding:0 16px;height:50px;flex:none}
.brand{display:flex;align-items:center;gap:10px;color:var(--chrome-hi);font-weight:700;white-space:nowrap}
.brand small{font-weight:500;color:var(--chrome-ink);font-size:13px}
.mark{width:20px;height:20px;display:grid;grid-template-columns:1fr 1fr;gap:2px}.mark i{border-radius:2px}.mark i:nth-child(1),.mark i:nth-child(4){background:#7FA6EA}.mark i:nth-child(2),.mark i:nth-child(3){background:#5BC495}
#menuBtn{display:none;background:none;border:0;color:var(--chrome-hi);padding:6px;margin-left:-6px}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap}
.av{width:26px;height:26px;border-radius:50%;background:#2B3D48;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px}

.layout{flex:1;display:flex;min-height:0}
#rail{width:236px;flex:none;background:var(--chrome-2);color:var(--chrome-ink);overflow:auto;padding:10px 8px 24px}
#rail .grp{font-size:12px;font-weight:600;color:#7F949E;padding:16px 10px 4px}
#rail button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 10px;color:var(--chrome-ink);font-size:14px;font-weight:500}
#rail button:hover{background:rgba(255,255,255,.06);color:var(--chrome-hi)}
#rail button[aria-current="page"]{background:rgba(255,255,255,.1);color:var(--chrome-hi);box-shadow:inset 3px 0 0 var(--accent-hi,#7FA6EA)}
#rail button b{font-size:11.5px;min-width:20px;text-align:center;padding:0 6px;border-radius:9px;background:rgba(255,255,255,.12);color:#fff}
#rail button b.red{background:#B4302A}
#scrim{display:none}
main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
#banner{background:var(--amber-soft);border-left:4px solid var(--amber);padding:8px 14px;font-size:14px}
#sechead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;padding:18px 28px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
#sechead h1{font-size:22px;line-height:1.2;margin:0;letter-spacing:-.015em;font-weight:800}
#sechead p{margin:3px 0 0;color:var(--muted);font-size:13.5px;max-width:75ch}
#content{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
#frameHost{flex:1;position:relative}
.qaframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--paper)}
.wrap{max-width:1240px;padding:20px 28px 64px}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent,var(--ink));color:var(--accent-on,var(--paper))}
.tools{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:4px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent,var(--ink));border-color:var(--accent,var(--ink));color:var(--accent-on,var(--paper))}
.cnt{font-weight:500;opacity:.75;margin-left:2px}.cnt.red{color:var(--red);opacity:1;font-weight:700}
.chip[aria-pressed="true"] .cnt.red{color:#FFB4AC}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.row.between{justify-content:space-between}.row.nowrap{flex-wrap:nowrap}
.grow{flex:1 1 240px;min-width:0}
input,select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 9px;min-width:0;max-width:100%}
input[type=checkbox],input[type=radio]{padding:0;width:16px;height:16px;accent-color:var(--cx)}
textarea{width:100%;resize:vertical}
textarea.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
input:disabled,select:disabled,textarea:disabled{background:var(--sunk);color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 13px;font-weight:600;font-size:13.5px;text-decoration:none;display:inline-block;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent,var(--ink));border-color:var(--accent,var(--ink));color:var(--accent-on,var(--paper))}
.btn.danger{color:var(--red);border-color:var(--red-soft)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:wait}
.linkbtn{background:none;border:0;padding:0;color:var(--accent,var(--cx));font-weight:600;text-decoration:underline;text-underline-offset:2px;text-align:left}
.inline{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}

.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px;margin-bottom:16px}
.tbl.sm{margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:8px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 11px;border-bottom:1px solid var(--line-2);vertical-align:middle;white-space:nowrap}
td.wrap{white-space:normal;min-width:220px} td.clip{max-width:320px;overflow:hidden;text-overflow:ellipsis}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
td.n{text-align:right} .sep{border-left:1px solid var(--line-2)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:10px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.tag.red{background:var(--red-soft);color:var(--red)}.tag.amb{background:var(--amber-soft);color:var(--amber)}.tag.ok{background:var(--qa-soft);color:var(--qa)}.tag.cx{background:var(--cx-soft);color:var(--cx)}.tag.qa{background:var(--qa-soft);color:var(--qa)}
.muted{color:var(--muted)} .hint{color:var(--muted);font-size:13px;margin:4px 0 10px;max-width:80ch}
.lead{color:var(--muted);margin:2px 0 14px;max-width:80ch}
.emptybox{border:1px dashed var(--line);border-radius:8px;padding:22px;color:var(--muted);background:var(--surface)}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:8px}
.h2{font-size:20px;margin:0 0 4px;letter-spacing:-.01em;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.h3{font-size:16px;margin:18px 0 8px}
.callout{border-left:3px solid var(--cx);background:var(--cx-soft);padding:8px 12px;border-radius:4px;margin:8px 0;font-size:13.5px}
.callout.amb{border-color:var(--amber);background:var(--amber-soft)}

.form{display:flex;flex-direction:column;gap:12px;max-width:920px}
.form.inset,.inset{background:var(--sunk);border-radius:8px;padding:12px;margin:10px 0}
details.inset>summary{cursor:pointer;font-weight:600}
.f{display:flex;flex-direction:column;gap:4px;min-width:0;border:0;padding:0;margin:0}
.f>span,.f>legend{font-size:12.5px;font-weight:600;color:var(--muted);padding:0}
.req::after{content:" *";color:var(--red)}
.radio{display:inline-flex;gap:6px;align-items:center;font-size:14px}
.g2,.g3,.g4{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g2 .span{grid-column:1/-1}
.split{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,1fr);gap:28px}

.casehead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-bottom:12px}
.due{text-align:right;font-size:13.5px}
.casegrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:12px}
.stage>header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line-2)}
.stage .no{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12.5px;background:var(--sunk);color:var(--muted);flex:none}
.stage h3{font-size:15px;margin:0}
.stage .own{font-size:12.5px;color:var(--muted)}
.stage .st{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted)}
.stage .b{padding:12px 14px}
.stage.done .no{background:var(--qa);color:#fff}.stage.done .st{color:var(--qa)}
.stage.active{border-color:var(--cx);box-shadow:0 0 0 1px var(--cx)}.stage.active .no{background:var(--cx);color:#fff}.stage.active .st{color:var(--cx)}
.stage.todo .b,.stage.skip .b{color:var(--muted)}
.kv{display:grid;grid-template-columns:minmax(140px,220px) 1fr;gap:5px 14px;margin:0}
.kv dt{color:var(--muted);font-size:13px}.kv dd{margin:0}
.desc{white-space:pre-wrap;background:var(--sunk);padding:10px 12px;border-radius:6px;margin:10px 0 0}
.timeline{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;position:sticky;top:12px;max-height:80vh;overflow:auto}
.timeline h3{font-size:14px;margin:0 0 8px}
.timeline ol{list-style:none;margin:0;padding:0}
.timeline li{border-left:2px solid var(--line);padding:0 0 12px 12px;position:relative;font-size:13px}
.timeline li::before{content:"";position:absolute;left:-5px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--cx)}
.timeline li b{display:block}.timeline li span{display:block}.timeline li small{color:var(--muted)}
ul.plain{list-style:none;margin:0;padding:0}ul.plain li{padding:6px 0;border-bottom:1px solid var(--line-2)}
.assign{list-style:none;padding:0;margin:0}.assign li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line-2)}.assign span{color:var(--muted);font-size:13px}
.feed{border:1px solid var(--amber);background:var(--amber-soft);border-radius:8px;padding:12px 14px;margin-bottom:16px}
.feed li{border-color:rgba(0,0,0,.08)}

.attn{border-left:4px solid var(--red);background:var(--surface);padding:10px 16px;margin-bottom:22px;border-radius:4px}
.attn h2{margin:0 0 4px}.attn ul{margin:0;padding-left:18px}.attn li{padding:2px 0}
.tgroup{margin-bottom:22px}
.tgroup h2{font-size:14px;margin:0 0 8px;display:flex;align-items:center;gap:8px;color:var(--c)}
.tgroup h2::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--c)}
.tgroup.rrg{--c:#B7791F}.tgroup.cx{--c:var(--cx)}.tgroup.qa{--c:var(--qa)}.tgroup.gr{--c:var(--gr)}.tgroup.lib{--c:var(--lib)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));border-top:2px solid var(--c);background:var(--surface);border-radius:0 0 6px 6px;border-left:1px solid var(--line);border-bottom:1px solid var(--line)}
.tile{text-align:left;background:none;border:0;border-right:1px solid var(--line);padding:12px 14px 14px;display:flex;flex-direction:column;gap:2px}
.tile:hover{background:var(--sunk)}
.tile .tl{font-size:13px;font-weight:600}
.tile b{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.tile .ts{font-size:12.5px;color:var(--muted)}
.tile.warn b{color:var(--red)}
.sect{margin-top:8px}
.meter{display:inline-flex;align-items:center;gap:8px}.meter i{display:block;height:6px;border-radius:3px;background:var(--line-2);width:64px;position:relative;overflow:hidden}.meter i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--c)}
ol.flow{counter-reset:f;list-style:none;padding:0;margin:0 0 10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
ol.flow li{counter-increment:f;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px}
ol.flow li b::before{content:counter(f) ". ";color:var(--cx)}
ol.flow li span{font-size:13px}ol.flow li small{color:var(--muted);font-size:12px}
.prose{max-width:76ch;line-height:1.6}.prose h3{font-size:17px;margin:20px 0 6px}.prose h4{font-size:15px;margin:16px 0 4px}.prose h5{font-size:14px}.prose p{margin:0 0 10px}.prose ul,.prose ol{margin:0 0 10px;padding-left:22px}.prose li{margin:2px 0}
.pbmeta{font-size:13px;color:var(--muted);margin-bottom:10px}
.figs4{display:grid;grid-template-columns:repeat(4,1fr);border-top:2px solid var(--ink);margin:12px 0 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.figs4>div{padding:12px 14px;border-right:1px solid var(--line-2)}.figs4 b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em}.figs4 span{font-size:12.5px;color:var(--muted)}.figs4 .warn b{color:var(--red)}
tr[aria-selected="true"] td{background:var(--cx-soft)}
.qlist{list-style:none;padding:0;margin:0 0 10px;counter-reset:q}
.qitem{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--cx);border-radius:6px;padding:10px 12px;margin-bottom:8px;display:flex;flex-direction:column;gap:6px}
.qitem.parked{border-left-color:var(--amber)}.qitem.answered{border-left-color:var(--qa)}
.ans{margin:0;white-space:pre-wrap;background:var(--sunk);padding:8px 10px;border-radius:4px}
@media (max-width:820px){ .figs4{grid-template-columns:1fr 1fr} }
.vpick{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:12.5px}
.vpick select:disabled{opacity:1;cursor:default}
.vpick select{background:var(--chrome-2);color:#fff;border:1px solid #2F4552;border-left:4px solid var(--scope,#2F4552);padding:5px 8px;font-weight:600}
.who{margin-left:12px}
.bar{border-bottom:3px solid var(--scope,transparent)}
.vchip{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;color:#fff;background:var(--vc)}
.scope{display:inline-block;vertical-align:middle;font-size:12px;font-weight:700;padding:2px 9px;border-radius:12px;border:1.5px solid var(--vc);color:var(--vc);margin-left:8px;letter-spacing:0}
.vsplit{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.dlog{list-style:none;padding:0;margin:12px 0}.dlog li{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin-bottom:8px}.dlog p{margin:4px 0 0}
body[data-venture] #sechead{background:linear-gradient(var(--accent-soft),var(--accent-soft)) top/100% 4px no-repeat,var(--surface);box-shadow:inset 0 4px 0 var(--accent)}
body[data-venture] .stage.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}body[data-venture] .stage.active .no{background:var(--accent)}body[data-venture] .stage.active .st{color:var(--accent)}
body[data-venture] .tile:hover,body[data-venture] tr.click:hover td{background:var(--accent-soft)}
body[data-venture] .figs4{border-top-color:var(--accent)}
body[data-venture] input:focus,body[data-venture] select:focus,body[data-venture] textarea:focus{outline:2px solid var(--accent);outline-offset:0}
#rail{border-right:1px solid var(--accent-line,transparent)}
.bv{display:inline-block;background:var(--vc);color:#fff;font-weight:700;padding:2px 9px;border-radius:4px;font-size:12.5px}
.vstep{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent,var(--ink));border-radius:6px;padding:10px 12px;margin:0 0 14px;max-width:920px}
.vstep>span:first-child{font-size:12.5px;font-weight:600;color:var(--muted)}
.vstep.pick{flex-direction:column;align-items:flex-start}.vstep.pick .hint{margin:0}
.vbtn{border-left:4px solid var(--vc)}
.swatch{display:flex;gap:6px;flex-wrap:wrap}.swatch span{color:#fff;font-size:12px;font-weight:600;padding:6px 10px;border-radius:4px}
.stamps{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:12.5px;color:var(--muted);padding:6px 14px;border-bottom:1px solid var(--line-2);background:var(--sunk)}
.stamps.flat{padding:0;border:0;background:none;margin:2px 0 8px}
.stamps time{color:var(--ink);font-weight:600}
.stamps .dot{opacity:.5}
.secstamp{margin:4px 0 0!important}
td time{white-space:nowrap}
ol.flow li small.actual{color:var(--ink);font-weight:600}
#alertHost{position:fixed;inset:0;z-index:60;background:rgba(10,15,20,.45);display:grid;place-items:center;padding:16px}
.alertbox{background:var(--surface);border-radius:10px;max-width:560px;width:100%;padding:18px 20px;border-top:5px solid var(--red);box-shadow:0 20px 50px rgba(0,0,0,.3);max-height:85vh;overflow:auto}
.alertbox h2{margin:0 0 6px;font-size:19px;color:var(--red)}.alertbox ul{list-style:none;padding:0;margin:10px 0}.alertbox li{padding:7px 0;border-bottom:1px solid var(--line-2)}
.btn.call{background:var(--qa);border-color:var(--qa);color:#fff}
.notes{border-bottom:1px solid var(--line-2);padding-bottom:10px;margin-bottom:10px}.notes h3{font-size:14px;margin:0 0 6px}.notes ol{list-style:none;padding:0;margin:8px 0 0}.notes li{background:var(--sunk);border-radius:6px;padding:6px 8px;margin-bottom:6px;font-size:13px}.notes li small{display:block;color:var(--muted)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.thumbs figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px;font-size:12px}.thumbs img{width:100%;height:110px;object-fit:cover;border-radius:4px;display:block}.thumbs figcaption{margin-top:4px;word-break:break-word}
.filecard{display:grid;place-items:center;height:110px;background:var(--sunk);border-radius:4px;font-weight:700;color:var(--muted);text-decoration:none}
.csatscale{gap:6px}.csatscale label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:13px;background:var(--surface)}
.csatscale label:has(input:checked){border-color:var(--accent,var(--ink));box-shadow:0 0 0 1px var(--accent,var(--ink))}
.csatpill{display:inline-block;font-weight:700;font-size:12px;padding:1px 8px;border-radius:10px;background:var(--sunk)}
.csatpill.cs1,.csatpill.cs2{background:var(--red-soft);color:var(--red)}.csatpill.cs3{background:var(--amber-soft);color:var(--amber)}.csatpill.cs4,.csatpill.cs5{background:var(--qa-soft);color:var(--qa)}
.csatbox{border-top:1px solid var(--line-2);margin-top:10px;padding-top:8px}.csatbox h4{margin:0 0 4px;font-size:14px}
.timeline li .was{color:var(--muted);font-size:12px}
.sub4{font-size:14px;margin:14px 0 6px}
.ups{list-style:none;padding:0;margin:0 0 10px}.ups li{border-left:3px solid var(--line);padding:4px 10px;margin-bottom:6px;font-size:13.5px}.ups li.ready{border-color:var(--amber)}.ups li.route{border-color:var(--accent,var(--cx))}.ups small{display:block;color:var(--muted)}
tr.win td{background:var(--qa-soft)}
.linkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:12px}
.linkcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent,var(--ink));border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}.linkcard p{margin:0;color:var(--muted);font-size:13.5px}
.rrhead{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent,var(--ink));border-radius:8px;padding:12px 14px;margin-top:10px}
.phases{list-style:none;display:flex;flex-wrap:wrap;gap:4px;padding:0;margin:8px 0}.phases li{font-size:12px;font-weight:600;padding:3px 10px;border-radius:12px;background:var(--sunk);color:var(--muted)}.phases li.done{background:var(--qa-soft);color:var(--qa)}.phases li.cur{background:var(--accent,var(--ink));color:#fff}
tr.inel td{background:var(--red-soft);color:var(--muted)}
.nomcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:10px}.scorer{gap:10px;margin:6px 0}
.addwrap{position:relative}.addmenu{position:absolute;right:0;top:calc(100% + 6px);z-index:15;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.15);width:320px;padding:6px}
.addmenu button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:8px 10px}.addmenu button:hover{background:var(--accent-soft,var(--sunk))}.addmenu span{font-size:12.5px;color:var(--muted)}
.imppanel{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent,var(--ink));border-radius:8px;padding:12px 14px;margin:0 0 16px}
.rawbox summary{cursor:pointer;font-weight:600}.rawbox .kv{margin-top:8px}
.bulk td{padding:4px 6px}.bulk input,.bulk select{width:100%;min-width:84px;padding:5px 6px;font-size:13px}.bulk td:nth-child(2) input{min-width:130px}.bulk .dupcell{position:sticky;right:0;background:inherit}.bulk tr.dup td{background:var(--red-soft)}.bulk tr.maybe td{background:var(--amber-soft)}.bulk .dupcell{min-width:220px;font-size:12.5px}
.dupgroup{background:var(--surface);border:1px solid var(--amber);border-radius:8px;padding:10px 14px;margin-bottom:12px}
.respbox,.hist{border-top:1px solid var(--line-2);margin-top:10px;padding-top:8px}.respbox h4{margin:0 0 4px;font-size:14px}.hist h3{font-size:14px;margin:0 0 6px}
.timeline li.sys::before{background:var(--muted)}
.linkcode{background:var(--sunk);padding:4px 8px;border-radius:4px;font-size:12.5px;word-break:break-all}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px;max-width:min(560px,90vw);z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.25)}

@media (max-width:1100px){ .casegrid{grid-template-columns:1fr} .timeline{position:static;max-height:none} .split{grid-template-columns:1fr} }
@media (max-width:820px){
  #menuBtn{display:block}
  #rail{position:fixed;top:calc(50px + env(safe-area-inset-top,0px));bottom:0;left:0;z-index:30;transform:translateX(-100%);transition:transform .18s}
  body.navopen #rail{transform:none}
  body.navopen #scrim{display:block;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35)}
  .g3,.g4{grid-template-columns:1fr 1fr} .wrap{padding:16px 14px 48px} #sechead{padding:14px}
  .brand small,.who .nm,.vpick span{display:none}
}
@media (max-width:520px){ .g2,.g3,.g4{grid-template-columns:1fr} .kv{grid-template-columns:1fr} .kv dt{margin-top:6px} }
@media (prefers-reduced-motion:reduce){ #rail{transition:none} }
</style>
</head>

<header class="bar">
  <button id="menuBtn" aria-label="Menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Q&amp;G Platform <small id="brandV">Alfred Holdings</small></div>
  <label class="vpick"><span>Venture</span><select id="vsel" aria-label="Venture"></select></label>
  <div class="who" id="who"></div>
</header>
<div class="layout">
  <nav id="rail" aria-label="Sections"></nav>
  <div id="scrim"></div>
  <main>
    <div id="banner" hidden></div>
    <div id="sechead"></div>
    <div id="content"></div>
    <div id="frameHost" hidden></div>
  </main>
</div>
<div id="toast" role="status" hidden></div>
<div id="alertHost" hidden></div>

function mdLite(src){
  const lines=String(src||"").split("\n"); let html="", list=null;
  const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  const close=()=>{ if(list){ html+=`</${list}>`; list=null; } };
  for(const raw of lines){ const l=raw.trimEnd();
    if(/^#{1,3}\s/.test(l)){ close(); const n=l.match(/^#+/)[0].length; html+=`<h${n+2}>${inline(l.replace(/^#+\s/,""))}</h${n+2}>`; continue; }
    if(/^\s*[-*]\s/.test(l)){ if(list!=="ul"){ close(); html+="<ul>"; list="ul"; } html+=`<li>${inline(l.replace(/^\s*[-*]\s/,""))}</li>`; continue; }
    if(/^\s*\d+\.\s/.test(l)){ if(list!=="ol"){ close(); html+="<ol>"; list="ol"; } html+=`<li>${inline(l.replace(/^\s*\d+\.\s/,""))}</li>`; continue; }
    close(); if(l.trim()) html+=`<p>${inline(l)}</p>`;
  }
  close(); return html;
}

function stageTimes(c){
  const i=c.intake||{}, lm=c.lm||{}, r=c.review||{}, cl=c.closure||{}, rets=(lm.returns||[]), lastRet=rets.length?rets[rets.length-1].at:null;
  const closedAtIntake=c.status==="closed"&&!i.routedAt;
  return {
    1:{start:c.receivedAt,end:c.createdAt,startLabel:"Received",endLabel:"Registered"},
    2:{start:c.createdAt,end:i.routedAt||(closedAtIntake?cl.internalAt:null)},
    3:{start:lastRet&&(!lm.submittedAt||lastRet<lm.submittedAt)?lastRet:i.routedAt,end:lm.submittedAt,first:i.routedAt},
    4:{start:lm.submittedAt,end:r.at},
    5:{start:cl.externalAt||r.at,end:cl.internalAt},
    6:{start:(c.dispute||{}).at,end:(c.dispute||{}).decidedAt}
  };
}
function stampLine(t,state,c){
  if(!t||!t.start) return "";
  const s=ts(t.start), e=ts(t.end), parts=[`${esc(t.startLabel||"Started")} ${stampCell(s)}`];
  if(!isNaN(e)) parts.push(`${esc(t.endLabel||"Finished")} ${stampCell(e)}`, `took ${esc(fmtTat(workHoursBetween(s,e,S.cfg)))}`);
  else if(state==="active") parts.push(`open for ${esc(fmtTat(workHoursBetween(s,nowMs(),S.cfg)))}`, `due ${stampCell(dueOf(c))}`);
  if(t.first&&ts(t.first)!==s) parts.push(`first routed ${stampCell(t.first)}`);
  return `<div class="stamps">${parts.join('<span class="dot">·</span>')}</div>`;
}
function sect(n,title,state,body,owner,times,c){ return `<section class="stage ${state}"><header><span class="no">${n}</span><h3>${esc(title)}</h3>${owner?`<span class="own">${esc(owner)}</span>`:""}<span class="st">${state==="done"?"Done":state==="active"?"In progress":state==="skip"?"Not needed":"Not started"}</span></header>${times?stampLine(times,state,c):""}<div class="b">${body}</div></section>`; }

function stageState(c,idx){

  const pos={intake:0,with_lm:1,qg_review:2,consequence:4,ready_internal:4,dispute:5,closed:9}[c.status];
  if(idx===5) return c.dispute?(c.status==="dispute"?"active":"done"):"skip";
  if(idx===4){ if(c.status==="closed") return (c.review||{}).consequence&&c.review.consequence!=="None"?"done":"skip"; return ["consequence","ready_internal","dispute"].includes(c.status)?"active":"todo"; }

        <label class="f"><span class="req">Call date</span><input type="date" data-d="${k}" data-f="valDate" value="${esc(dv(k,"valDate",todayD()))}" min="${todayD()}" max="${todayD()}"></label>
        <label class="f"><span class="req">Call time</span><input type="time" data-d="${k}" data-f="valTime" value="${esc(dv(k,"valTime",""))}"></label></div>
        <label class="f"><span class="req">What the customer confirmed</span><textarea rows="2" data-d="${k}" data-f="valOutcome">${esc(dv(k,"valOutcome",""))}</textarea></label>`:""}
      <div class="g3"><label class="f"><span class="req">Root cause</span><select data-d="${k}" data-f="rootCause">${opts(pick("rootCauses"),dv(k,"rootCause",""),"Choose")}</select></label>
        <label class="f"><span class="req">Closure reason</span><select data-d="${k}" data-f="closureReason">${opts(pick("closureReasons"),dv(k,"closureReason","Resolved"))}</select></label></div>
      <div class="g3"><label class="f"><span class="req">Validity</span><select data-d="${k}" data-f="verdict">${opts(pick("validity"),dv(k,"verdict",""),"Choose")}</select></label>
        <label class="f"><span class="req">Consequence</span><select data-d="${k}" data-f="consequence">${opts(pick("consequences"),cons,"Choose")}</select></label>
        ${cons&&cons!=="None"?`<label class="f"><span class="req">Applies to</span><select data-d="${k}" data-f="consequenceStaffId">${opts(staffFor(c.venture).map(p=>({v:p.id,l:p.name})),dv(k,"consequenceStaffId",c.staffId||""),"Choose person")}</select></label>`:""}</div>
      ${cons&&cons!=="None"?`<label class="f"><span class="req">Consequence detail for the line manager</span><textarea rows="2" data-d="${k}" data-f="consequenceNote">${esc(dv(k,"consequenceNote",""))}</textarea></label>`:""}
      <fieldset class="f"><legend>Other internal actions (never shared with the customer)</legend><div class="row">${pick("internalActions").map(a=>`<label class="radio"><input type="checkbox" data-d="${k}" data-f="internalActions" data-multi="${esc(a)}"${(dv(k,"internalActions",[])||[]).includes(a)?" checked":""}> ${esc(a)}</label>`).join("")}</div></fieldset>
      <label class="f"><span>Internal action detail</span><input data-d="${k}" data-f="internalNote" value="${esc(dv(k,"internalNote",""))}" placeholder="For example, refresher on renewal disclosure for the team"></label>
      <label class="f"><span class="req">Resolution and actions for the customer (shared with them)</span><textarea rows="2" data-d="${k}" data-f="finalSummary">${esc(dv(k,"finalSummary",""))}</textarea></label>
      <div class="g3"><label class="f"><span class="req">Business outcome</span><select data-d="${k}" data-f="businessOutcome">${opts(BIZ,dv(k,"businessOutcome",""),"Choose")}</select></label>
        <label class="f"><span>Value at stake (AED, optional)</span><input type="number" min="0" step="1" data-d="${k}" data-f="businessValue" value="${esc(dv(k,"businessValue",""))}"></label>
        <label class="f"><span>Business outcome note</span><input data-d="${k}" data-f="businessNote" value="${esc(dv(k,"businessNote",""))}" placeholder="For example, renewed policy, cancelled with provider"></label></div>
      ${responseBlock(c,k)}
      ${csatForm(k,c)}
      ${csatLinkBlock(k,c)}
      <div class="row"><button class="btn primary" data-act="cxExternal" data-ref="${k}">Close for the customer (external closure)</button></div>
      <details class="inset"><summary>Return to line manager instead</summary><label class="f"><span class="req">What needs to be redone</span><textarea rows="2" data-d="${k}" data-f="returnReason">${esc(dv(k,"returnReason",""))}</textarea></label><button class="btn" data-act="cxReturn" data-ref="${k}">Return to line manager</button></details>
      </div>`;
  } else if(r.at){
    s4=kv([["Line manager's call assessed",yn(r.lmCallAssessed)],["Findings in place",yn(r.findingsInPlace)],["Resolution meets the ask",yn(r.resolutionAligned)],["Notes",esc(r.lmCallNotes)],
      ["Validation",r.path==="validated"?`Called the customer, call ${esc(r.valCallRef)} on ${esc(fmtD(r.valDate))} at ${esc(r.valTime)}. ${esc(r.valOutcome)}`:"Reviewed the record without a call"],
      ["Linked QA evaluation",r.evalId?`<button class="linkbtn" data-act="openEval" data-id="${esc(r.evalId)}">${esc(r.evalId)}</button>`:""],
      ["Business outcome",r.businessOutcome?bizTag(r.businessOutcome)+(r.businessValue?" · AED "+esc(Number(r.businessValue).toLocaleString("en-GB")):"")+(r.businessNote?" · "+esc(r.businessNote):""):""],
      ["Root cause",esc(r.rootCause||"")],["Closure reason",esc(r.closureReason||"")],["Internal actions",esc([...(r.internalActions||[]),r.internalNote].filter(Boolean).join("; "))+((r.internalActions||[]).length||r.internalNote?' <span class="tag">Internal only</span>':"")],
      ["Satisfaction link",r.csatLink?(r.csatLink.sent?"Sent"+(r.csatLink.method?" by "+esc(r.csatLink.method):""):"Not sent: "+esc(r.csatLink.reason||"")):""],
      ["Validity",esc(r.verdict)],["Consequence",esc(r.consequence)+(r.consequenceStaffId?" for "+esc(personName(r.consequenceStaffId)):"")],["Consequence detail",esc(r.consequenceNote)],["Final resolution",esc(r.finalSummary)],["Assessed by",esc(r.byName||"")+" on "+esc(fmtDT(r.at))]]);
  } else s4=`<p class="muted">After the line manager submits.</p>`;

  // 5 closure + consequence
  let s5="";
  if(cl.externalAt) s5+=kv([["External closure",esc(fmtDT(cl.externalAt))+" by "+esc(cl.externalByName||"")]]);
  if(["consequence","ready_internal"].includes(c.status)||c.consequenceAck){
    s5+=`<div class="stamps flat"><span class="tag ok">Closed for the customer</span><span class="dot">·</span><span class="tag amb">Internal: pending ${esc(r.consequence)} for ${esc(personName(r.consequenceStaffId))}</span></div>`;
  }
  if(c.status==="consequence"&&act){
    s5+=`<div class="callout"><b>Consequence to action: ${esc(r.consequence)}</b> for ${esc(personName(r.consequenceStaffId))}. Routed to ${esc(personName(i.lmId))} pending this action. ${esc(r.consequenceNote)}</div>
    <div class="form"><label class="f"><span class="req">What you did, or why you dispute it</span><textarea rows="3" data-d="${k}" data-f="ackNote">${esc(dv(k,"ackNote",""))}</textarea></label>
    <div class="row"><button class="btn primary" data-act="cxAck" data-ref="${k}">Confirm consequence actioned</button><button class="btn" data-act="cxDispute" data-ref="${k}">Dispute the consequence</button></div></div>`;
  } else if(c.consequenceAck) s5+=kv([[c.consequenceAck.action==="ack"?"Consequence actioned":"Disputed",esc(c.consequenceAck.note)+" ("+esc(c.consequenceAck.byName||"")+", "+esc(fmtDT(c.consequenceAck.at))+")"]]);
  if(c.status==="ready_internal"&&act) s5+=`<div class="callout ok"><b>Internal action confirmed.</b> Ready for Q&G to close the case in full.</div><div class="row"><button class="btn primary" data-act="cxInternal" data-ref="${k}">Close internally, with validity ${esc(r.verdict)}</button></div><p class="hint">Internal closure completes the case. The line manager and their superior get the closure email.</p>`;
  if(cl.internalAt) s5+=kv([["Internal closure",esc(fmtDT(cl.internalAt))+" by "+esc(cl.internalByName||"")]]);
  if(cl.externalAt) s5+=`<div class="csatbox"><h4>Customer satisfaction (CSAT)</h4>${csatView(c)}${isQG()&&(!c.csat||c.csat.status!=="Captured")?`<details class="inset"><summary>${c.csat?"Update CSAT":"Record CSAT"}</summary>${csatForm("csat-"+c.ref,c)}<button class="btn sm primary" data-act="cxCsat" data-ref="${esc(c.ref)}">Save CSAT</button></details>`:""}</div>`;
  if(!s5) s5=`<p class="muted">After Q&G's assessment.</p>`;

  // 6 dispute
  let s6="";
  if(c.dispute){
    s6=kv([["Line manager's verbatim",esc(c.dispute.verbatim)],["Raised",esc(fmtDT(c.dispute.at))]]);
    if(c.status==="dispute"&&act) s6+=`<div class="form"><label class="f"><span class="req">Decision</span><select data-d="${k}" data-f="decision">${opts(["Uphold the consequence","Amend the consequence","Withdraw the consequence"],dv(k,"decision",""),"Choose")}</select></label>
      ${dv(k,"decision","")==="Amend the consequence"?`<label class="f"><span class="req">Amended consequence</span><select data-d="${k}" data-f="amended">${opts(pick("consequences").filter(x=>x!=="None"),dv(k,"amended",""),"Choose")}</select></label>`:""}
      <label class="f"><span class="req">Rationale</span><textarea rows="2" data-d="${k}" data-f="decisionNote">${esc(dv(k,"decisionNote",""))}</textarea></label>
      <button class="btn primary" data-act="cxDecide" data-ref="${k}">Record decision and close</button></div>`;
    else if(c.dispute.decision) s6+=kv([["Decision",esc(c.dispute.decision)+(c.dispute.amended?": "+esc(c.dispute.amended):"")],["Rationale",esc(c.dispute.decisionNote)],["Decided by",esc(c.dispute.decidedByName||"")+" on "+esc(fmtDT(c.dispute.decidedAt))]]);
  }

  const others=dupMatches(c.venture,c.mobile,c.dealRef,c.ref);
  const tl=`<aside class="timeline">${notesBlock(c)}${others.length?`<div class="callout amb" style="margin-bottom:10px"><b>${others.length} other open case${others.length>1?"s":""} for this customer</b></div>`:""}${customerHistory(c)}<h3>Case log</h3><ol>${[...(c.timeline||[])].reverse().map(t=>`<li class="${t.sys||t.by==="system"?"sys":""}"><b>${esc(t.ev)}</b>${t.sys||t.by==="system"?' <span class="tag">System activity</span>':""}${t.note?`<span>${esc(t.note)}</span>`:""}<small>${esc(t.byName||"System")}, ${esc(fmtDT(t.at))}</small></li>`).join("")}</ol></aside>`;
  return head+`<div class="casegrid"><div>
    ${sect(1,"Intake","done",s1,"Registered",ST_T[1],c)}
    ${sect(2,"Q&G first review and routing",stageState(c,0),s2,"Q&G",ST_T[2],c)}
    ${sect(3,"Line manager resolution",stageState(c,1),s3,i.lmId?personName(i.lmId):"Line manager",ST_T[3],c)}
    ${sect(4,"Q&G assessment",stageState(c,2),s4,"Q&G",ST_T[4],c)}
    ${sect(5,"Closure and consequence management",c.status==="closed"?"done":stageState(c,4),s5,"Q&G and line manager",ST_T[5],c)}
    ${c.dispute?sect(6,"Dispute decision",stageState(c,5),s6,"Chief Q&G",ST_T[6],c):""}
  </div>${tl}</div>`;
}

/* ---- actions ---- */
function need(cond,msg,list){ if(!cond) list.push(msg); }
async function cxAction(act,ref,el){
  if(["cxNote","cxDial","cxNoConnect","cxOpenOther","cxDupNote"].includes(act)) return cxSideAction(act,ref,el);
  if(act==="cxCsat") return saveCsat(ref);
  if(act==="cxFollowUp") return startFollowUp(ref);
  if(act==="cxCopyLink"){ try{ await navigator.clipboard.writeText(cxc("csatLink")); toast("Link copied."); }catch(_){ toast("Copy the link from the box."); } return; }
  if(["cxRespDraft","cxRespApprove","cxRespNone","cxRespPosted"].includes(act)){ const cc=S.cases.find(x=>x.ref===ref); if(cc) await respAction(act,cc); return; }
  if(act==="cxRecall"){
    const cc=S.cases.find(x=>x.ref===ref); if(!cc) return;
    if(!(S.admin||isQG())) return toast("Only Q&G can recall a case.");
    if(cc.status!=="with_lm") return toast("Only a case currently with the line manager can be recalled.");
    const why=prompt("Why is "+cc.ref+" being recalled to Q&G? For example, routed to the wrong queue, or the line manager's action is incomplete."); if(!why||!why.trim()) return;
    const i=cc.intake||{};
    const n=await moveCase(cc,"intake",{recalls:[...(cc.recalls||[]),{from:i.teamId,fromLm:i.lmId,at:nowMs(),by:S.uid,byName:S.meName,why:why.trim()}]},"Recalled to Q&G",why.trim()); if(!n) return;
    sendMail({to:[emailOf(i.lmId)],cc:[emailOf(i.superiorId)],subject:`Recalled to Q&G: ${cc.ref}`,lines:[`${cc.ref} has been pulled back to Q&G by ${S.meName}, and is no longer in your queue.`,`Reason: ${why.trim()}`],ref:cc.ref,kind:"recall"});
    return toast(cc.ref+" recalled to Q&G.");
  }
  if(act==="cxConvert"){
    const cc=S.cases.find(x=>x.ref===ref); if(!cc) return;
    if(!(S.admin||isQG())) return toast("Only Q&G can convert a callback.");
    if(!isCallback(cc)) return toast("Only a callback request can be converted.");
    if(cc.status==="closed") return toast("This case is already closed.");
    if(!confirm("Convert "+cc.ref+" from a callback request to a complaint? The reference, call log and full history stay as they are; this just changes how it's handled from here.")) return;
    const conv={at:nowMs(),by:S.uid,byName:S.meName,fromType:cc.type};
    if(await patch("mod/cx/cases/"+ref,{type:"Complaint",convertedFrom:[...(cc.convertedFrom||[]),conv],updatedAt:nowMs(),timeline:[...(cc.timeline||[]),ev("Converted to Complaint","From "+cc.type+", by "+S.meName)]})){
      await addAudit("case",ref,"Converted to Complaint",{type:cc.type},{type:"Complaint"},S.meName);
      S.sel.callbacks=null; S.sel.complaints=ref; go("complaints"); toast(ref+" converted to a complaint.");
    }
    return;
  }
  if(act==="cxReopen"){ const cc=S.cases.find(x=>x.ref===ref); if(!cc||!isQG()) return; const why=prompt("Why is this case being reopened?"); if(!why||!why.trim()) return;
    await moveCase(cc,"qg_review",{closure:{},closureHistory:[...(cc.closureHistory||[]),{...(cc.closure||{}),reopenedAt:nowMs(),reopenedBy:S.meName,why:why.trim()}]},"Reopened by Q&G",why.trim()); return toast("Reopened for Q&G review."); }
  if(act==="cxClassify"){ const cc=S.cases.find(x=>x.ref===ref); if(!cc||!isQG()) return; const d=draft("cl-"+ref);
    const part={}; ["requestSubtype","priority","staffId"].forEach(f=>{ if(d[f]!==undefined) part[f]=d[f]; }); Object.assign(part,classifyValues(d,cc));
    if(part.staffId!==undefined) part.staffTeamId=part.staffId?((asgAt(S.staff[part.staffId],dateOf(cc.receivedAt))||{}).teamId||null):null;
    if(!Object.keys(part).length) return toast("Nothing changed.");
    if(await patch("mod/cx/cases/"+ref,{...part,updatedAt:nowMs(),timeline:[...(cc.timeline||[]),ev("Classification updated",Object.entries(part).filter(([k])=>k!=="staffTeamId").map(([k,v])=>k==="staffId"?"staff: "+personName(v):k+": "+v).join("; "))]})){ delete S.drafts["cl-"+ref]; toast("Saved."); } return; }
  if(act==="cxNoMatch"){ const cc=S.cases.find(x=>x.ref===ref); if(!cc||!isQG()) return; const on=el.dataset.v==="on";
    await patch("mod/cx/cases/"+ref,{noMatchSince:on?nowMs():null,updatedAt:nowMs(),timeline:[...(cc.timeline||[]),ev(on?"No valid match in CRM yet":"Match found in CRM",on?"Stays in Draft; closes automatically after "+cxc("draftAutoCloseDays")+" days if still unmatched":"")]}); return; }
  const c=S.cases.find(x=>x.ref===ref); if(!c) return;
  if(!canAct(c)){ toast("This stage isn't yours to action."); return; }
  const d=draft(ref), p=[];
  if(act==="cxQAttempt"){
    if(pendingFor(c,"qg").length===0&&false) return;
    const tm=d.qTime, cid=String(d.qCall||"").trim(); if(!tm||!cid||!d.qOutcome) return toast("Add the time, call ID and outcome.");
    const qa=[...(c.qgAttempts||[]),{date:todayD(),time:tm,callId:cid,outcome:d.qOutcome,by:S.uid,byName:S.meName,at:nowMs()}];
    await patch("mod/cx/cases/"+ref,{qgAttempts:qa,...(await clearPending(c,"qg")),stageStartedAt:c.stageStartedAt||nowMs(),updatedAt:nowMs(),timeline:[...(c.timeline||[]),ev("Q&G call attempt "+qa.length,d.qOutcome+", call "+cid)]});
    ["qTime","qCall","qOutcome"].forEach(f=>delete d[f]); return;
  }
  if(act==="cxRoute"){
    const contacted=d.contacted||((c.qgAttempts||[]).length?"yes":"");
    need(String(d.comment||"").trim(),"your assessment",p); need(contacted,"whether Q&G contacted the customer",p);
    const qa=(c.qgAttempts||[]), reachedA=qa.find(a=>a.outcome==="Reached");
    if(contacted==="yes"){ need(qa.length,"at least one logged Q&G call attempt",p); need(reachedA||qa.length>=3,"the customer reached, or three attempts",p); need(qa.every(a=>a.date===todayD()),"Q&G call attempts dated today",p); }
    if(pendingFor(c,"qg").length) p.push("the outcome of the call you started");
    d.contacted=contacted; const lastA=reachedA||qa[qa.length-1]; if(lastA){ d.callRef=lastA.callId; d.contactDate=lastA.date; d.contactTime=lastA.time; }
    const t=S.teams[d.teamId]; need(t,"the team to route to",p); if(t&&t.lob!==c.lob) return lobMismatch(t,c);
    const tg=t?routeTargets(t,c.staffId,d.handlerId||null):null; if(t) need(tg&&tg.lmId,"who handles it ("+t.name+" has no line manager set)",p);
    if(p.length) return toast("Add "+p.join(", ")+".");
    const me=meStaff();
    const intake={comment:d.comment.trim(),contacted:d.contacted,callRef:d.callRef||"",contactDate:d.contacted==="yes"?(d.contactDate||todayD()):"",contactTime:d.contacted==="yes"?(d.contactTime||dLocal(nowMs()).toISOString().slice(11,16)):"",
      teamId:t.id,lmId:tg.lmId,superiorId:tg.superiorId,routedBy:me?me.id:null,routedByName:S.meName,routedAt:nowMs(),routeNote:tg.note};
    const n=await moveCase(c,"with_lm",{intake,noMatchSince:null},"Routed to "+t.name,"Handled by "+personName(tg.lmId)+(tg.note?". "+tg.note:"")); if(!n) return;
    if(S.admin&&!t.lineManagerId&&tg.lmId&&(d.setLm??true)){ if(await patch("mod/core/teams/"+t.id,{lineManagerId:tg.lmId,updatedAt:nowMs()})) await addAudit("team",t.id,"Line manager set",{lineManagerId:null},{lineManagerId:tg.lmId},"While routing "+c.ref+": "+personName(tg.lmId)); }
    delete S.drafts[ref];
    sendMail({to:[emailOf(tg.lmId)],cc:[emailOf(tg.superiorId)],subject:`New case submitted to you: ${c.ref} (${t.name})`,lines:[`Ticket ${c.ref} (${caseLine(c)}) has been submitted to you by Q&G and is in your queue.`,`Customer key: ${c.dealRef?"deal "+c.dealRef:maskMobile(c.mobile)}. Source: ${c.source}.`,`Q&G assessment: ${intake.comment}`,`Call the customer (up to three attempts), agree a resolution and submit it on the platform by ${fmtDT(dueOf(n))}.`],ref,kind:"routed"});
    return toast("Routed to "+personName(tg.lmId)+".");
  }
  if(act==="cxCloseDup"){
    const why=prompt("Why is this intake being closed? For example, duplicate of CX-2026-000012.");
    if(!why||!why.trim()) return;
    await moveCase(c,"closed",{closure:{externalAt:nowMs(),externalByName:S.meName,internalAt:nowMs(),internalByName:S.meName,reason:why.trim()}},"Closed at intake",why.trim());
    return toast("Closed.");
  }
  if(act==="cxAttempt"){
    d.aDate=d.aDate||todayD(); need(d.aDate,"the date",p); need(d.aTime,"the time",p); need(String(d.aCall||"").trim(),"the call ID",p); need(d.aOutcome,"the outcome",p);
    if(d.aDate&&d.aDate>todayD()) p.push("a date that isn't in the future");
    if(d.aOutcome&&d.aOutcome!=="Reached"&&!d.aEmail) p.push("confirmation that you emailed the customer after the missed call");
    if(p.length) return toast("Add "+p.join(", ")+".");
    const attempts=[...((c.lm||{}).attempts||[]),{date:d.aDate,time:d.aTime,callId:d.aCall.trim(),outcome:d.aOutcome,emailSent:d.aOutcome!=="Reached"?!!d.aEmail:null,emailSubject:String(d.aEmailSubject||"").trim(),by:S.uid,byName:S.meName,at:nowMs()}];
    await patch("mod/cx/cases/"+ref,{...(await clearPending(c,"lm")),lm:{...(c.lm||{}),attempts},stageStartedAt:c.stageStartedAt||nowMs(),timeline:[...(c.timeline||[]),ev("Call attempt "+attempts.length,d.aOutcome+", call "+d.aCall.trim())],updatedAt:nowMs()});
    ["aDate","aTime","aCall","aOutcome","aEmail","aEmailSubject"].forEach(f=>delete d[f]);
    if(attempts.length>=3&&!attempts.some(a=>a.outcome==="Reached")&&cxc("notReachableAutoClose")){
      const fresh=S.cases.find(x=>x.ref===ref)||c, now=nowMs(), i=c.intake||{};
      const part={status:"closed",stageAt:now,updatedAt:now,lm:{...(c.lm||{}),attempts,reached:false,submittedAt:now,submittedBy:(meStaff()||{}).id||null,findings:(c.lm||{}).findings||"Customer not reachable after three call attempts, each followed by an email."},
        closure:{externalAt:now,internalAt:now,externalByName:"Platform",internalByName:"Platform",reason:"Customer not reachable",auto:true},review:{...(c.review||{}),closureReason:"Customer not reachable"},
        timeline:[...((fresh&&fresh.timeline)||c.timeline||[]),sysEv("Closed automatically: customer not reachable","Three call attempts, each followed by an email to the customer")]};
      if(await patch("mod/cx/cases/"+ref,part)){
        sendMail({to:c.assigneeId&&emailOf(c.assigneeId)?[emailOf(c.assigneeId)]:qgEmails(),cc:[emailOf(i.lmId)],subject:`Closed, customer not reachable: ${c.ref}`,lines:[`${c.ref} closed automatically after three unsuccessful call attempts, each followed by an email to the customer.`,"Q&G can review it and reopen it if needed."],ref,kind:"closed"});
        toast("Third attempt logged. The case closed automatically as customer not reachable.");
      }
    }
    return;
  }
  if(act==="cxResolve"){
    const lm={...(c.lm||{})}, atts=lm.attempts||[], reached=atts.some(a=>a.outcome==="Reached");
    if(reached) need(String(d.resolution??lm.resolution??"").trim(),"the resolution agreed",p);
    else { need(atts.length>=3,"three call attempts",p); need(String(d.emailSubject??lm.emailSubject??"").trim(),"the email subject line",p); }
    need(String(d.findings??lm.findings??"").trim(),"your findings",p);
    if(pendingFor(c,"lm").length) p.push("the outcome of the call you started");
    if(p.length) return toast("Add "+p.join(", ")+".");
    const me=meStaff();
    Object.assign(lm,{resolution:String(d.resolution??lm.resolution??"").trim(),emailSubject:String(d.emailSubject??lm.emailSubject??"").trim(),sharedWithQG:!!(d.sharedWithQG??lm.sharedWithQG),findings:String(d.findings??lm.findings).trim(),submittedAt:nowMs(),submittedBy:me?me.id:null,reached});
    const n=await moveCase(c,"qg_review",{lm},"Submitted as resolved by line manager",reached?"Customer reached":"Not reached after three attempts; emailed the customer"); if(!n) return;
    delete S.drafts[ref];
    const i=c.intake||{};
    sendMail({to:i.routedBy&&emailOf(i.routedBy)?[emailOf(i.routedBy)]:qgEmails(),cc:i.routedBy?qgEmails():[],subject:`Ready for Q&G review: ${c.ref}`,lines:[`${personName(i.lmId)} submitted ${c.ref} as resolved.`,reached?`Resolution agreed: ${lm.resolution}`:`The customer couldn't be reached after three attempts. Email sent: “${lm.emailSubject}”.`,`Please assess it by ${fmtDT(dueOf(n))}.`],ref,kind:"lm_resolved"});
    return toast("Submitted to Q&G.");
  }
  if(act==="cxReturn"){
    if(!String(d.returnReason||"").trim()) return toast("Say what needs to be redone.");
    const lm={...(c.lm||{}),submittedAt:null,returns:[...((c.lm||{}).returns||[]),{at:nowMs(),by:S.uid,reason:d.returnReason.trim()}]};
    const n=await moveCase(c,"with_lm",{lm},"Returned to line manager",d.returnReason.trim()); if(!n) return;
    const i=c.intake||{}; delete S.drafts[ref];
    sendMail({to:[emailOf(i.lmId)],cc:[emailOf(i.superiorId)],subject:`Returned by Q&G: ${c.ref}`,lines:[`Q&G returned ${c.ref} for more work.`,`Reason: ${lm.returns[lm.returns.length-1].reason}`,`Please resubmit by ${fmtDT(dueOf(n))}.`],ref,kind:"returned"});
    return toast("Returned to the line manager.");
  }
  if(act==="cxExternal"){
    ["lmCallAssessed","findingsInPlace","resolutionAligned"].forEach(f=>need(d[f],"all three assessment answers",p));
    need(d.path,"how Q&G validated",p);
    if(d.path==="validated"){ need(String(d.valCallRef||"").trim(),"the validation call ID",p); need((d.valDate||todayD())===todayD(),"today's date for the validation call",p); need(d.valTime,"the validation call time",p); need(String(d.valOutcome||"").trim(),"what the customer confirmed",p); }
    need(d.verdict,"the case validity",p); need(d.consequence,"the consequence",p);
    if(d.consequence&&d.consequence!=="None"){ need(d.consequenceStaffId||c.staffId,"who the consequence applies to",p); need(String(d.consequenceNote||"").trim(),"the consequence detail",p); }
    need(String(d.finalSummary||"").trim(),"the resolution and actions for the customer",p);
    if(isUpheld(d.verdict)||flagOf(c.type)==="Complaint") need(d.rootCause,"the root cause",p);
    if((c.type==="Negative review"||/Google|Trustpilot/i.test(c.source||""))){ const rr=c.reviewResponse||{}; need(rr.approvedAt||rr.notNeeded,"a Q&G-approved response to the review, or confirmation that none is needed",p); }
    if(cxc("csatLinkRequired")) need(d.csatLinkSent||String(d.csatLinkReason||"").trim(),"confirmation the customer satisfaction link was sent, or why not",p);
    need(d.businessOutcome,"the business outcome (retained, lost or not applicable)",p);
    const cs=csatFromDraft(d,p);
    if(p.length) return toast("Add "+[...new Set(p)].join(", ")+".");
    const review={lmCallAssessed:d.lmCallAssessed,findingsInPlace:d.findingsInPlace,resolutionAligned:d.resolutionAligned,lmCallNotes:d.lmCallNotes||"",evalId:d.evalId||"",path:d.path,
      valCallRef:d.valCallRef||"",valDate:d.path==="validated"?(d.valDate||todayD()):"",valTime:d.valTime||"",valOutcome:d.valOutcome||"",verdict:d.verdict,consequence:d.consequence,
      consequenceStaffId:d.consequence!=="None"?(d.consequenceStaffId||c.staffId):null,consequenceNote:d.consequenceNote||"",finalSummary:d.finalSummary.trim(),rootCause:d.rootCause||"",closureReason:d.closureReason||"Resolved",internalActions:d.internalActions||[],internalNote:String(d.internalNote||"").trim(),csatLink:{sent:!!d.csatLinkSent,reason:String(d.csatLinkReason||"").trim(),method:d.csatLinkMethod||"",at:nowMs()},businessOutcome:d.businessOutcome,businessValue:d.businessValue?Number(d.businessValue):null,businessNote:String(d.businessNote||"").trim(),by:S.uid,byName:S.meName,at:nowMs()};
    const closure={...(c.closure||{}),externalAt:nowMs(),externalBy:S.uid,externalByName:S.meName};
    review.csatAt=nowMs(); const csatDoc={...cs,at:nowMs(),by:S.uid,byName:S.meName};
    if(pendingFor(c,"val").length&&review.path!=="validated") return toast("You started a validation call. Choose “Called the customer to validate” and log it, or mark it as not connected.");
    const i=c.intake||{};
    closure.reason=review.closureReason;
    if(review.consequence==="None"){
      closure.internalAt=nowMs(); closure.internalByName=S.meName;
      const n=await moveCase(c,"closed",{review,closure,csat:csatDoc,pendingCalls:pendingFor(c).filter(x=>x.purpose!=="val")},"Closed externally and internally","Validity: "+review.verdict+". No consequence."); if(!n) return;
      delete S.drafts[ref];
      sendMail({to:[emailOf(i.lmId)],cc:[emailOf(i.superiorId)],subject:`Closed: ${c.ref} (${review.verdict.toLowerCase()})`,lines:[`Q&G closed ${c.ref}.`,`Validity: ${review.verdict}. No consequence applies.`,`Final resolution: ${review.finalSummary}`],ref,kind:"closed"});
      return toast("Case closed.");
    }
    const n=await moveCase(c,"consequence",{review,closure,csat:csatDoc,pendingCalls:pendingFor(c).filter(x=>x.purpose!=="val")},"External closure; consequence relayed",review.consequence+" for "+personName(review.consequenceStaffId)); if(!n) return;
    delete S.drafts[ref];
    await logBreachFromCase(n);
    sendMail({to:[emailOf(i.lmId)],cc:[emailOf(i.superiorId)],subject:`Consequence to action: ${c.ref}`,lines:[`Q&G closed ${c.ref} for the customer. Validity: ${review.verdict}.`,`Consequence: ${review.consequence} for ${personName(review.consequenceStaffId)}.`,`Detail: ${review.consequenceNote}`,`Confirm it's actioned, or dispute it with your reasons, by ${fmtDT(dueOf(n))}. The case closes internally once this is done.`],ref,kind:"consequence"});
    return toast("Closed for the customer. Consequence sent to the line manager.");
  }
  if(act==="cxAck"||act==="cxDispute"){
    const note=String(d.ackNote||"").trim(); if(!note) return toast(act==="cxAck"?"Say what was done.":"Give your reasons for the dispute.");
    const ack={action:act==="cxAck"?"ack":"dispute",note,by:S.uid,byName:S.meName,at:nowMs()};
    if(act==="cxAck"){
      const n=await moveCase(c,"ready_internal",{consequenceAck:ack},"Consequence actioned by line manager",note); if(!n) return;
      delete S.drafts[ref];
      sendMail({to:qgEmails(),subject:`Ready for internal closure: ${c.ref}`,lines:[`${S.meName} confirmed the consequence for ${c.ref} is actioned.`,`Note: ${note}`],ref,kind:"ack"});
      return toast("Sent to Q&G for internal closure.");
    }
    const n=await moveCase(c,"dispute",{consequenceAck:ack,dispute:{verbatim:note,at:nowMs(),by:S.uid}},"Consequence disputed",note); if(!n) return;
    delete S.drafts[ref];
    sendMail({to:chiefEmails(),cc:qgEmails(),subject:`Consequence disputed: ${c.ref}`,lines:[`${S.meName} disputed the consequence on ${c.ref}.`,`Their verbatim: ${note}`,`The Chief Q&G decides: uphold, amend or withdraw.`],ref,kind:"dispute"});
    return toast("Dispute sent to the Chief Q&G.");
  }
  if(act==="cxInternal"){
    const n=await moveCase(c,"closed",{closure:{...(c.closure||{}),internalAt:nowMs(),internalBy:S.uid,internalByName:S.meName}},"Internal closure",""); if(!n) return;
    const i=c.intake||{};
    sendMail({to:[emailOf(i.lmId)],cc:[emailOf(i.superiorId)],subject:`Closed internally: ${c.ref}`,lines:[`${c.ref} is now fully closed on the platform.`],ref,kind:"closed"});
    return toast("Case closed.");
  }
  if(act==="cxDecide"){
    need(d.decision,"the decision",p); if(d.decision==="Amend the consequence") need(d.amended,"the amended consequence",p); need(String(d.decisionNote||"").trim(),"the rationale",p);
    if(p.length) return toast("Add "+p.join(", ")+".");
    const dispute={...c.dispute,decision:d.decision,amended:d.amended||"",decisionNote:d.decisionNote.trim(),decidedBy:S.uid,decidedByName:S.meName,decidedAt:nowMs()};
    const review={...c.review}; if(d.decision==="Amend the consequence") review.consequence=d.amended; if(d.decision==="Withdraw the consequence") review.consequence="None";
    const n=await moveCase(c,"closed",{dispute,review,closure:{...(c.closure||{}),internalAt:nowMs(),internalBy:S.uid,internalByName:S.meName}},"Dispute decided; internal closure",d.decision+". "+d.decisionNote.trim()); if(!n) return;
    delete S.drafts[ref];
    const i=c.intake||{};
    sendMail({to:[emailOf(i.lmId)],cc:[emailOf(i.superiorId),...qgEmails()],subject:`Dispute decided: ${c.ref}`,lines:[`The Chief Q&G decided: ${d.decision}${d.amended?" to "+d.amended:""}.`,`Rationale: ${d.decisionNote.trim()}`,`${c.ref} is now closed.`],ref,kind:"decision"});
    return toast("Decision recorded. Case closed.");
  }
}
async function uploadCorrespondence(ref,file){

/* ---- reminders & escalation (runs in Q&G/admin sessions with Gmail) ---- */
async function sweep(){
  if(DB&&(isQG()||S.admin)) { try{ await recordTatBreaches(); }catch(e){ logError("sweep","Time limit check failed",null,e); } try{ await autoCloseDrafts(); }catch(e){ logError("sweep","Draft auto-closure failed",null,e); } }
  if(!DB||!MCP||!(isQG()||S.admin)) return;
  try{
    const lock=await DB.doc("mod/sys/locks/sweeper").acquire({holder:S.uid+"-"+SESSION,ttlMs:240000});
    if(!lock.acquired) return;
  }catch(e){ return; }
  const every=(S.cfg.reminderEveryHours||24)*3600e3;
  for(const c of S.cases){
    if(!isOpenCase(c)) continue;
    const due=dueOf(c); if(due==null||due>nowMs()) continue;
    if(c.lastReminderAt&&nowMs()-c.lastReminderAt<every) continue;
    const rc=stageRecipients(c), n=(c.reminderCount||0)+1;
    const escalate=["with_lm","consequence"].includes(c.status);
    const started=!!c.stageStartedAt;
    const ok=await sendMail({to:rc.to,cc:[...rc.cc,...(escalate?qgEmails():[])],subject:`${escalate?"Escalation":"Reminder"} ${n}: ${c.ref} is pending your action`,
      lines:[`${c.ref} (${caseLine(c)}) has been at “${ST[c.status]}” since ${fmtDT(c.stageAt)} and was due by ${fmtDT(due)}.`,started?"Work has started but the stage isn't complete.":"No action has been recorded on it yet.",`Please action it on the platform.`],ref:c.ref,kind:"reminder"});
    await patch("mod/cx/cases/"+c.ref,{reminderCount:n,lastReminderAt:nowMs(),escalated:escalate||c.escalated||false,timeline:[...(c.timeline||[]),{at:nowMs(),by:"system",byName:"Platform",ev:(escalate?"Escalation ":"Reminder ")+n+(ok?" sent":rc.to.filter(Boolean).length?" failed":" not sent"),note:rc.to.filter(Boolean).length?"To "+rc.to.filter(Boolean).join(", "):(["intake","qg_review","ready_internal"].includes(c.status)?"No one to send it to: mark your Q&G team as kind “Q&G team” in Staff list, or set a Q&G owner on the case.":"No one to send it to: set the team's line manager in Staff list.")}]});
  }
}

const digits=m=>String(m||"").replace(/\D/g,"");

function callBtn(c,purpose){ const h=dialHref(c.mobile); return h?`<a class="btn call" href="${esc(h)}" data-act="cxDial" data-ref="${esc(c.ref)}" data-purpose="${purpose}">Call ${esc(maskMobile(c.mobile))} via 3CX</a>`:`<span class="hint" style="margin:0">No mobile number on this case, so it can't be dialled from here. Call through 3CX and log the attempt below.</span>`; }
const pendingFor=(c,purpose)=>(c.pendingCalls||[]).filter(x=>!purpose||x.purpose===purpose);
function pendingBanner(c,purpose){ const p=pendingFor(c,purpose); if(!p.length) return "";

async function cxSideAction(act,ref,el){

    return; }
  if(act==="cxDial"){ const purpose=el.dataset.purpose, now=nowMs(), hhmm=dLocal(now).toISOString().slice(11,16), d=draft(ref);
    if(purpose==="qg"){ d.qTime=hhmm; d.contacted="yes"; } else if(purpose==="lm"){ d.aDate=todayD(); d.aTime=hhmm; } else if(purpose==="val"){ d.valDate=todayD(); d.valTime=hhmm; d.path="validated"; }

  if(act==="cxNoConnect"){ const x=(c.pendingCalls||[]).find(y=>y.id===el.dataset.id); if(!x) return;
    const rest=(c.pendingCalls||[]).filter(y=>y.id!==x.id), at={date:dateOf(x.at),time:dLocal(x.at).toISOString().slice(11,16),callId:"Not connected",outcome:"Not connected",by:S.uid,byName:S.meName,at:nowMs()};

    await patch("mod/cx/cases/"+ref,p); return toast("Recorded as not connected."); }
}

/* target resolution time per case type, end to end, in working hours */
const targetHrs=c=>Number((cxc("targetTat")||{})[c.type])||null;
function targetDue(c){ const h=targetHrs(c); return h?addWorkHours(ts(c.receivedAt||c.createdAt),h,S.cfg):null; }
function withinTarget(c){ const d=targetDue(c); if(!d) return null; const end=c.status==="closed"?ts((c.closure||{}).internalAt||(c.closure||{}).externalAt):nowMs(); return end<=d; }
function targetLine(c){ const d=targetDue(c); if(!d) return ""; const ok=withinTarget(c);
  return c.status==="closed"?`<span class="tag ${ok?"ok":"red"}">${ok?"Resolved within target":"Resolved after target"}</span>`:`<span class="${d<nowMs()?"tag red":"muted"}">Target resolution ${d<nowMs()?"passed ":""}${esc(fmtDT(d))}</span>`; }

const isUpheld=v=>/^Valid|^Partially valid/i.test(String(v||""));

const flagOf=t=>isComplaintType(t)?"Complaint":/^Service|Callback/.test(t||"")?"Service":t==="Internal"?"Internal":"Complaint";
function ticketStatus(c){
  if(c.status==="closed"){ const r=(c.closure||{}).reason||""; return ["Duplicate","No valid match found","Rejected"].includes(r)||/duplicate|invalid/i.test(r)?"Rejected":"Closed"; }
  if(c.status==="intake") return c.stageStartedAt||(c.intake||{}).comment?"Work in progress":"Draft";

/* routing target: never the person the complaint is about */
const LM_ROLES=["line_manager","team_lead","head"];
function teamMembersToday(team){ return staffList().filter(p=>(asgAt(p)||{}).teamId===team.id); }
function lmCandidates(team){ return teamMembersToday(team).filter(p=>(p.roles||[]).some(r=>LM_ROLES.includes(r))); }
function routeTargets(team,staffId,chosen){
  if(!team) return null;

/* request types the business handles directly go straight to the LOB manager */

  const t=teams[0], tg=routeTargets(t,c.staffId); if(!tg.lmId) return c;

/* sweeper: drafts with no valid match close after the set number of days */
async function autoCloseDrafts(){
  const days=cxc("draftAutoCloseDays"); if(!days) return;

/* the CEM plan's success measures, for the period shown in Reports */
function successMeasures(list){
  const closed=list.filter(c=>c.status==="closed"), tgt=closed.filter(c=>withinTarget(c)!==null);
  const t=closed.filter(c=>(c.closure||{}).internalAt).map(c=>workHoursBetween(ts(c.receivedAt||c.createdAt),ts(c.closure.internalAt),S.cfg));
  const comp=list.filter(c=>isComplaintType(c.type)), rep=comp.filter(isRepeat);
  const gr=list.filter(c=>c.type==="Negative review"||/Google/i.test(c.source||"")), grOk=gr.filter(c=>(c.reviewResponse||{}).approvedAt||(c.reviewResponse||{}).notNeeded);
  const cs=list.filter(c=>c.csat&&c.csat.status==="Captured").map(c=>c.csat.score);

function classifyValues(d,base){

function moves(teamId,fromDate,toDate){

/* ================= Staff list: add many people at once, catch duplicates ================= */
function lev(a,b){ a=norm(a); b=norm(b); if(a===b) return 0; const m=a.length,n=b.length; if(!m||!n) return Math.max(m,n); let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; } return prev[n]; }
const nameKey=s=>norm(s).replace(/[^a-z ]/g,"").split(" ").filter(Boolean).sort().join(" ");
function dupOf(row,exceptId){
  const out=[];
  for(const p of Object.values(S.staff)){ if(p.id===exceptId) continue;
    if(row.email&&p.email&&norm(p.email)===norm(row.email)) out.push({p,why:"same work email",hard:true});
    else if(row.employeeId&&p.employeeId&&norm(p.employeeId)===norm(row.employeeId)) out.push({p,why:"same employee ID",hard:true});
    else if(row.name&&p.name&&(nameKey(p.name)===nameKey(row.name))) out.push({p,why:"same name",hard:false});
    else if(row.name&&p.name&&row.name.length>4&&lev(p.name,row.name)<=2) out.push({p,why:"very similar name",hard:false}); }
  return out;
}

/* review possible duplicates already in the list */
function dupGroups(){
  const ps=Object.values(S.staff), seen=new Set(), groups=[];
  for(const p of ps){ if(seen.has(p.id)) continue;
    const m=dupOf(p,p.id).filter(x=>!(p.notDupWith||[]).includes(x.p.id)&&!(x.p.notDupWith||[]).includes(p.id));
    if(m.length){ const g=[p,...m.map(x=>x.p)].filter((x,i,a)=>a.findIndex(y=>y.id===x.id)===i); g.forEach(x=>seen.add(x.id)); groups.push({g,why:m.map(x=>x.why)}); } }
  return groups;
}

    const recV=r?(recVenture(r)||""):formVenture(k);
    if(!r&&!recV) return toast("Choose the venture first.");
    for(const [name,,t] of def.fields) if(t==="lob"&&out[name]&&recV&&vOfLob(out[name])!==recV) out[name]="";
    if(miss.length) return toast("Add "+miss.join(", ")+".");
    if(r){
      const status=d.status||r.status; out.assigneeId=d.assigneeId??r.assigneeId??null; out.venture=r.venture||vOfLob(out.lob)||"";
      const changed=Object.keys(out).filter(f=>JSON.stringify(out[f]??"")!==JSON.stringify(r[f]??""));
      if(status!==r.status) changed.push("status");
      if(!changed.length) return toast("Nothing changed.");
      const note=status!==r.status?"Status: "+r.status+" → "+status+(changed.length>1?"; edited "+changed.filter(f=>f!=="status").join(", "):""):"Edited "+changed.join(", ");
      const before=Object.fromEntries(changed.map(f=>[f,f==="status"?r.status:(r[f]??"")]));
      const extra=def.final.includes(status)&&!def.final.includes(r.status)?{closedAt:nowMs()}:!def.final.includes(status)&&r.closedAt?{closedAt:null}:{};
      if(!await patch("mod/reg/records/"+r.id,{...out,...extra,status,updatedAt:nowMs(),history:[...(r.history||[]),{at:nowMs(),byName:S.meName,note:out.assigneeId!==(r.assigneeId||null)?note+"; owner "+personName(out.assigneeId):note,before}]})) return;
      if(out.assigneeId&&out.assigneeId!==(r.assigneeId||null)) notifyAssigned(out.assigneeId,r.ref||r.id,NAVMAP[sec].label);
      delete S.drafts[k]; return toast("Saved.");
    }
    const ref=await nextRef(def.prefix);
    out.assigneeId=d.assigneeId??(meStaff()&&isQG()?meStaff().id:null);
    out.venture=recV;
    const doc={id:ref,ref,section:sec,...out,status:def.statuses[0],updatedAt:nowMs(),createdAt:nowMs(),createdBy:S.uid,createdByName:S.meName,history:[{at:nowMs(),byName:S.meName,note:"Created"}]};
    if(!await put("mod/reg/records/"+ref,doc)) return;
    await addAudit("record",ref,"Created",null,null,sec);
    if(out.assigneeId&&(!meStaff()||out.assigneeId!==meStaff().id)) notifyAssigned(out.assigneeId,ref,NAVMAP[sec].label);
    delete S.drafts[k]; S.sel[sec]=ref; render(); return toast(ref+" added.");
  }
  if(act==="trackBreach"||act==="trackAll"){
    const items=act==="trackAll"?breachCandidates():breachCandidates().filter(x=>x.key===el.dataset.id);
    for(const it of items){ await put("mod/reg/records/"+it.key,{...it.doc,id:it.key,ref:it.key.toUpperCase(),createdAt:nowMs(),createdBy:S.uid,createdByName:S.meName,history:[{at:nowMs(),byName:S.meName,note:"Tracked from QA evaluation "+it.doc.sourceRef}]}); }
    return toast(items.length+" breach"+(items.length===1?"":"es")+" added to the tracker.");
  }
}
function breachCandidates(){
  const tracked=new Set(recsOf("breaches").map(r=>r.id)), out=[];
  for(const e of evalsV()){
    if(!["pending_review","confirmed","published"].includes(e.status)) continue;
    const staff=Object.values(S.staff).find(p=>(e.advisorEmail&&norm(p.email)===norm(e.advisorEmail))||p.qaAdvisorId===e.advisorId||p.id===e.advisorId);
    const lobKey=(e.ventureId||"insurancemarket")+"|"+e.lob;
    const src=/email/i.test(e.channel||"")?"Email evaluation":"Call evaluation";
    const base={section:"breaches",date:dateOf(e.interactionDate||e.createdAt),source:src,sourceRef:e.callId||e.id,staffId:staff?staff.id:null,staffIdTeam:staff?((asgAt(staff,dateOf(e.interactionDate||e.createdAt))||{}).teamId||null):null,lob:lobKey,status:"Open",advisorName:e.advisorName||""};
    if(e.hasFatalError){ const key="qa-"+String(e.id).toLowerCase()+"-fatal"; if(!tracked.has(key)) out.push({key,e,label:"Fatal error"+(e.fatalErrorCode?" "+e.fatalErrorCode:""),doc:{...base,breachType:"Fatal error"+(e.fatalErrorCode?" "+e.fatalErrorCode:""),severity:"Critical",description:e.fatalErrorReason||""}}); }
    (e.policyBreaches||[]).forEach((b,ix)=>{ const key="qa-"+String(e.id).toLowerCase()+"-"+ix; if(!tracked.has(key)) out.push({key,e,label:b.ruleTitle||"Policy breach",doc:{...base,breachType:b.ruleTitle||"Policy breach",severity:SEV.includes(b.severity)?b.severity:"Medium",description:[b.transcriptQuote&&"“"+b.transcriptQuote+"”",b.policySnippet].filter(Boolean).join(" ")}}); });
  }
  return out;
}
function breachFeed(){
  const c=breachCandidates(); if(!c.length) return "";

async function routeAction(act,el){
  const sec=el.dataset.k, r=S.recs.find(x=>x.id===el.dataset.id); if(!r) return;
  const k="rt-"+r.id, d=draft(k), rt=routeOf(r), ref=r.ref||r.id, owner=r.assigneeId;
  const hist=note=>[...(r.history||[]),{at:nowMs(),byName:S.meName,note}];
  if(act==="regRoute"){
    if(!isQG()) return toast("Only Q&G routes findings.");
    const t=S.teams[d.teamId||(rt&&rt.teamId)], hop=d.hopId||(rt&&rt.hopId)||vInfo(recVenture(r)).headOfProductId||(t&&t.lineManagerId);
    if(!t||!hop) return toast("Choose the team and the Head of Product.");
    const route={teamId:t.id,hopId:hop,superiorId:t.superiorId||null,routedAt:nowMs(),routedBy:S.uid,routedByName:S.meName,dueDate:d.dueDate||addDays(todayD(),3)};
    const msg=String(d.msg||"").trim();
    if(!await patch("mod/reg/records/"+r.id,{route,status:"Routed to team",updatedAt:nowMs(),updates:[...(r.updates||[]),{kind:"route",text:"Routed to "+t.name+" ("+personName(hop)+")"+(msg?": "+msg:""),at:nowMs(),by:S.uid,byName:S.meName}],history:hist("Routed to "+t.name+", "+personName(hop))})) return;
    sendMail({to:[emailOf(hop)],cc:[emailOf(t.superiorId),emailOf(owner)],subject:`New ${REG[sec].noun} submitted to you: ${ref}`,lines:[`Q&G has submitted ${ref} to ${t.name} for action.`,[r.journey||r.product||"",r.priority||""].filter(Boolean).join(" · "),r.defects?`Defects found: ${r.defects}`:"",msg?`Message from Q&G: ${msg}`:"",`Please share your update on the platform by ${fmtD(route.dueDate)}. Q&G will retest once you mark it fixed, and only Q&G closes it.`].filter(Boolean),ref,kind:"route"});
    delete S.drafts[k]; return toast("Routed to "+personName(hop)+". They've been emailed.");
  }
  if(act==="regUpdate"||act==="regReady"){
    if(!(isHop(r)||isQG())) return toast("Only the team it was routed to, or Q&G, can update it.");
    const text=String(d.update||"").trim(); if(!text) return toast(act==="regReady"?"Describe the fix before marking it ready.":"Write the update first.");
    const status=act==="regReady"?"Ready for retest":(r.status==="Routed to team"||r.status==="Retest failed"?"Fix in progress":r.status);
    if(!await patch("mod/reg/records/"+r.id,{status,updatedAt:nowMs(),updates:[...(r.updates||[]),{kind:act==="regReady"?"ready":"update",text,at:nowMs(),by:S.uid,byName:S.meName}],history:hist((act==="regReady"?"Marked ready for retest: ":"Update: ")+text.slice(0,120))})) return;
    if(!isQG()||isHop(r)) sendMail({to:owner&&emailOf(owner)?[emailOf(owner)]:qgEmails(),subject:`${act==="regReady"?"Ready for Q&G retest":"Team update"}: ${ref}`,lines:[`${S.meName} ${act==="regReady"?"marked "+ref+" as fixed and ready for Q&G retest":"posted an update on "+ref}.`,text],ref,kind:"route_update"});
    delete d.update; return toast(act==="regReady"?"Sent to Q&G for retest.":"Update posted.");
  }
  if(act==="regRetest"){
    if(!isQG()) return toast("Only Q&G retests.");
    const res=d.result, notes=String(d.notes||"").trim(); if(!res||!notes) return toast("Add the retest result and what you found.");
    if(res==="Pass"&&!d.satisfied) return toast("Tick that Q&G has retested and is satisfied, to close it.");
    const retest={result:res,notes,at:nowMs(),by:S.uid,byName:S.meName}, status=res==="Pass"?"Closed":"Retest failed";
    if(!await patch("mod/reg/records/"+r.id,{status,closedAt:res==="Pass"?nowMs():null,retests:[...(r.retests||[]),retest],updatedAt:nowMs(),history:hist("Q&G retest "+(res==="Pass"?"passed; closed":"failed")+": "+notes.slice(0,120))})) return;
    if(rt) sendMail({to:[emailOf(rt.hopId)],cc:[emailOf(rt.superiorId)],subject:`${res==="Pass"?"Closed after Q&G retest":"Retest failed, action needed"}: ${ref}`,lines:[res==="Pass"?`Q&G retested ${ref} and is satisfied. It is now closed.`:`Q&G retested ${ref} and the issue is still there. Please fix it and update the platform.`,`Q&G findings: ${notes}`],ref,kind:"retest"});
    delete S.drafts[k]; return toast(res==="Pass"?"Closed after retest.":"Retest failed. Sent back to the team.");
  }
}

function qgStaff(date){ return staffList(date).filter(p=>{ const t=teamOf(p,date); return t&&t.kind==="qg"; }); }
function qgOpts(sel){ return opts(qgStaff().map(p=>({v:p.id,l:p.name})).concat(sel&&!qgStaff().some(p=>p.id===sel)?[{v:sel,l:personName(sel)}]:[]),sel||"","Unassigned"); }
const dayHours=()=>{ const [a,b]=[S.cfg.work.start,S.cfg.work.end].map(t=>{ const [h,m]=t.split(":").map(Number); return h+m/60; }); return Math.max(1,b-a); };
const fmtTat=h=>h==null?"–":h<dayHours()?(Math.round(h*10)/10)+" working hrs":(Math.round(h/dayHours()*10)/10)+" working days";
const QG_STAGES=["intake","qg_review","ready_internal"];

/* One list of everything Q&G owns, whatever section it lives in */
function workItems(){
  const out=[];
  const keep=x=>inV(x);
  for(const c of S.cases){
    if(!keep(c.venture)) continue;
    const done=c.status==="closed";
    const atQG=QG_STAGES.includes(c.status);
    if(!done&&!atQG) { out.push({kind:"case",id:c.ref,sec:isCallback(c)?"callbacks":"complaints",title:c.ref+" · "+(c.subject||c.type),assignee:c.assigneeId||null,state:"waiting",stage:ST[c.status],created:c.createdAt,due:dueOf(c),doneAt:null}); continue; }
    out.push({kind:"case",id:c.ref,sec:isCallback(c)?"callbacks":"complaints",title:c.ref+" · "+(c.subject||c.type),assignee:c.assigneeId||null,state:done?"done":"open",stage:ST[c.status],created:c.createdAt,due:done?null:dueOf(c),doneAt:done?ts((c.closure||{}).internalAt):null});
  }
  for(const r of S.recs){
    const def=REG[r.section]; if(!def||r.section==="controls"||!keep(recVenture(r))) continue;
    const done=def.final.includes(r.status);
    out.push({kind:"rec",id:r.id,sec:r.section,title:(r.ref||r.id)+" · "+(r[def.cols[2]]||r[def.cols[1]]||def.noun),assignee:r.assigneeId||null,state:done?"done":"open",stage:r.status,created:r.createdAt,due:!done&&r.due?localToMs(r.due,S.cfg.work.end):null,doneAt:done?(r.closedAt||r.updatedAt||null):null});
  }
  for(const t of S.tasks){
    const done=t.status==="Done", gone=t.status==="Cancelled"; if(gone||(S.venture&&t.venture&&t.venture!==S.venture)) continue;
    out.push({kind:"task",id:t.id,sec:t.section||"",title:t.title,assignee:t.assigneeId||null,state:done?"done":"open",stage:t.status,created:t.createdAt,due:!done&&t.due?localToMs(t.due,S.cfg.work.end):null,doneAt:done?t.doneAt:null,task:t});
  }
  return out;
}
const isOver=i=>i.state==="open"&&i.due&&i.due<nowMs();
const tatOf=i=>i.doneAt&&i.created?workHoursBetween(i.created,i.doneAt,S.cfg):null;

const avg=a=>{ a=a.filter(x=>x!=null&&!isNaN(x)); return a.length?a.reduce((s,x)=>s+x,0)/a.length:null; };

/* ---- Team workload (Chief Q&G / admin) ---- */

async function trashAction(act,el){
  if(act==="trashSt"){ S.ui.trash.st=el.dataset.v; return; }
  if(act!=="trashRestore"||!S.admin) return;
  const id=el.dataset.id;
  if(el.dataset.src==="qa"){
    const t=S.qaTrash.find(x=>x.id===id); if(!t||!t.evaluation) return toast("This evaluation can't be restored from here. Use Reports & extraction in the QA tool.");
    if(S.evals.some(e=>e.id===t.id)) return toast("An evaluation with that ID already exists.");
    const now=nowMs(), doc={...t.evaluation,updatedAt:now,updatedBy:S.uid,auditTrail:[...(t.evaluation.auditTrail||[]),{at:now,by:S.uid,field:"status",from:"deleted",to:t.evaluation.status,reason:"Restored from the platform Recycle bin",role:"admin"}]};
    if(!await put("mod/qa/evaluations/"+t.id,doc)) return;
    try{ await DB.doc("mod/qa/trash/"+t.id).delete(); }catch(_){}
    await addAudit("recycle",t.id,"Restored QA evaluation",null,null,t.callId||t.id); return toast((t.callId||t.id)+" restored.");
  }
  const t=S.trash.find(x=>x.id===id); if(!t) return;
  if(t.kind==="record"){
    const ex=await DB.doc(t.path).get(); if(ex.exists) return toast("A record with that reference already exists, so it wasn't overwritten.");
    const data={...t.data,updatedAt:nowMs(),history:[...((t.data&&t.data.history)||[]),{at:nowMs(),byName:S.meName,note:"Restored from the Recycle bin"}]};
    if(!await put(t.path,data)) return;
  } else if(t.kind==="file"){
    const r=S.recs.find(x=>x.id===t.recordId); if(!r) return toast("The record this file belonged to is in the Recycle bin. Restore the record first.");
    if(!await patch("mod/reg/records/"+r.id,{files:[...(r.files||[]),t.file],updatedAt:nowMs(),history:[...(r.history||[]),{at:nowMs(),byName:S.meName,note:"Restored file "+t.file.name}]})) return;
  }
  await patch("mod/sys/trash/"+id,{restoredAt:nowMs(),restoredBy:S.uid,restoredByName:S.meName});
  await addAudit("recycle",id,"Restored",null,null,t.title); toast("Restored.");
}
