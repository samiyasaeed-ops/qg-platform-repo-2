/* ================= Turnaround targets, over-time alerts and performance ================= */
const TAT_DEFAULTS={appreciations:10,reviews:10,spotchecks:30,breaches:30,noncompliance:50,rca:50,mystery:30,journey:30,product:50,task:20,evalHandlingMin:45,evalReview:10,evalPublish:10};
const tatCfg=()=>({...TAT_DEFAULTS,...(S.cfg.tat||{})});
const staffByUid=uid=>uid?(Object.values(S.staff).find(p=>p.userId===uid)||(uid===S.uid?meStaff():null)):null;
function managerOf(staffId){ const p=S.staff[staffId]; if(p&&p.managerId&&p.managerId!==staffId) return p.managerId; const t=p&&teamOf(p); if(!t) return null; return t.lineManagerId&&t.lineManagerId!==staffId?t.lineManagerId:(t.superiorId||null); }
const monthOf=ms=>dateOf(ms).slice(0,7);
const minsBetween=(a,b)=>(ts(b)-ts(a))/60000;
const fmtMin=m=>m==null||isNaN(m)?"–":m<60?Math.round(m)+" min":(Math.round(m/6)/10)+" hrs";

/* QA evaluation timeline, from the evaluation's own audit trail */
function evalTimes(e){
  const st=(e.auditTrail||[]).filter(t=>t.field==="status");
  const firstTo=to=>{ const x=st.find(t=>to.includes(t.to)); return x?x.at:null; };
  const submitted=e.submittedAt||firstTo(["pending_review","confirmed"])||(e.status!=="draft"?e.createdAt:null);
  const queued=st.some(t=>t.to==="pending_review");
  const reviewed=queued?(e.reviewedAt||firstTo(["confirmed"])):null;
  const published=firstTo(["published"])||e.sentAt||e.emailSentAt||null;
  return {started:e.startedAt||null,submitted,queued,reviewStarted:e.reviewStartedAt||null,reviewed,published,
    handlingMin:e.startedAt&&submitted?minsBetween(e.startedAt,submitted):null,
    waitHrs:queued&&submitted?workHoursBetween(ts(submitted),ts(e.reviewStartedAt||reviewed||nowMs()),S.cfg):null,
    reviewHrs:queued&&submitted?workHoursBetween(ts(submitted),ts(reviewed||nowMs()),S.cfg):null,
    reviewerMin:e.reviewStartedAt&&reviewed?minsBetween(e.reviewStartedAt,reviewed):null,
    publishHrs:published&&(reviewed||submitted)?workHoursBetween(ts(reviewed||submitted),ts(published),S.cfg):null,
    totalHrs:submitted&&published?workHoursBetween(ts(e.startedAt||submitted),ts(published),S.cfg):null};
}

/* Every Q&G activity measured against its target, one row per item and stage */
function tatChecks(){
  const T=tatCfg(), out=[];
  for(const c of S.cases){
    if(!inV(c.venture)) continue;
    const owner=c.assigneeId||null, i=c.intake||{};
    const qgStage=["intake","qg_review","ready_internal"].includes(c.status), lmStage=["with_lm","consequence"].includes(c.status);
    if(c.status!=="closed"){ const due=dueOf(c); if(due&&due<nowMs()){ const who=qgStage?owner:lmStage?i.lmId:null;
      out.push({key:"case:"+c.ref+":"+c.status+":"+(c.stageAt||0),kind:"case",ref:c.ref,sec:isCallback(c)?"callbacks":"complaints",venture:c.venture,staffId:who,activity:ST[c.status],title:c.ref+" · "+(c.subject||c.type),target:S.cfg.sla[STAGE_SLA[c.status]],actual:workHoursBetween(c.stageAt||c.createdAt,nowMs(),S.cfg),open:true}); } }
  }
  for(const c of S.cases){ if(!inV(c.venture)||c.status==="closed") continue; const d=targetDue(c); if(!d||d>nowMs()) continue;
    out.push({key:"caseT:"+c.ref,kind:"case",ref:c.ref,sec:isCallback(c)?"callbacks":"complaints",venture:c.venture,staffId:c.assigneeId||null,activity:"Target resolution time ("+c.type+")",title:c.ref+" · "+(c.subject||c.type),target:targetHrs(c),actual:workHoursBetween(ts(c.receivedAt||c.createdAt),nowMs(),S.cfg),open:true}); }
  for(const r of S.recs){
    const def=REG[r.section]; if(!def||!inV(recVenture(r))) continue;
    const tgt=T[r.section]; if(!tgt) continue;
    const done=def.final.includes(r.status), end=done?(r.closedAt||r.updatedAt):nowMs(), act=workHoursBetween(r.createdAt,end,S.cfg);
    if(act>tgt) out.push({key:"rec:"+r.id,kind:"rec",ref:r.ref||r.id,id:r.id,sec:r.section,venture:recVenture(r),staffId:r.assigneeId||null,activity:NAVMAP[r.section].label,title:(r.ref||r.id),target:tgt,actual:act,open:!done});
  }
  for(const t of S.tasks){
    if(t.status==="Cancelled"||(S.venture&&t.venture&&t.venture!==S.venture)) continue;
    const done=t.status==="Done", end=done?t.doneAt:nowMs();
    const over=t.due?ts(end)>localToMs(t.due,S.cfg.work.end):workHoursBetween(t.createdAt,end,S.cfg)>T.task;
    if(over) out.push({key:"task:"+t.id,kind:"task",id:t.id,ref:t.title,sec:t.section||"",venture:t.venture||"",staffId:t.assigneeId,activity:"Task",title:t.title,target:t.due?null:T.task,actual:workHoursBetween(t.createdAt,end,S.cfg),open:!done,dueDate:t.due});
  }
  for(const e of evalsV()){
    const x=evalTimes(e), ev=staffByUid(e.createdBy||e.evaluatorId), rv=e.reviewerId?staffByUid(e.reviewerId):null, v=e.ventureId||"insurancemarket";
    if(x.handlingMin!=null&&x.handlingMin>T.evalHandlingMin) out.push({key:"evalh:"+e.id,kind:"eval",id:e.id,ref:e.callId||e.id,sec:/email/i.test(e.channel||"")?"emails":"calls",venture:v,staffId:ev&&ev.id,activity:"Evaluation handling",title:(e.callId||e.id),targetMin:T.evalHandlingMin,actualMin:x.handlingMin,open:false});
    if(x.queued&&x.reviewHrs!=null&&x.reviewHrs>T.evalReview) out.push({key:"evalr:"+e.id,kind:"eval",id:e.id,ref:e.callId||e.id,sec:"calls",venture:v,staffId:rv?rv.id:null,activity:"Review",title:(e.callId||e.id),target:T.evalReview,actual:x.reviewHrs,open:!x.reviewed});
  }
  return out;
}
const tatText=b=>b.targetMin!=null?`${fmtMin(b.actualMin)} against ${fmtMin(b.targetMin)}`:b.target!=null?`${fmtTat(b.actual)} against ${fmtTat(b.target)}`:`past due date ${fmtD(b.dueDate)}`;

/* Record new breaches, email the member and their manager (runs in the sweeper) */
async function recordTatBreaches(){
  if(!DB||!(isQG()||S.admin)) return;
  const known=new Set(S.tatLog.map(x=>x.key));
  for(const b of tatChecks()){
    if(known.has(b.key)||!b.staffId) continue;
    const mgr=managerOf(b.staffId);
    const doc={key:b.key,kind:b.kind,ref:b.ref,refId:b.id||b.ref,sec:b.sec,venture:b.venture,staffId:b.staffId,managerId:mgr,activity:b.activity,title:b.title,target:b.target??null,targetMin:b.targetMin??null,actual:b.actual??null,actualMin:b.actualMin??null,dueDate:b.dueDate||"",month:monthOf(nowMs()),detectedAt:nowMs(),memberAckAt:null,managerAckAt:null};
    const id=b.key.replace(/[^a-zA-Z0-9_-]/g,"_").slice(0,180);
    if(!await put("mod/perf/tat/"+id,doc)) continue;
    known.add(b.key);
    sendMail({to:[emailOf(b.staffId)],cc:[emailOf(mgr)],subject:`Time limit passed: ${b.title}`,lines:[`${b.activity} for ${b.title} has gone past its time limit: ${tatText(b)}.`,`This is recorded on ${personName(b.staffId)}'s Q&G performance for ${monthOf(nowMs())}.`,b.open?"Please action it now.":"It has been completed late."],ref:b.ref,kind:"tat"});
  }
}

/* Pop-up alert for the member and their manager */
let alertShownKey="";
function myAlerts(){
  const me=meStaff(); if(!me) return [];
  return S.tatLog.filter(x=>(x.staffId===me.id&&!x.memberAckAt)||(x.managerId===me.id&&!x.managerAckAt)).sort((a,b)=>b.detectedAt-a.detectedAt);
}
function showAlerts(force){
  const list=myAlerts(), host=$("#alertHost"); if(!host) return;
  const key=list.map(x=>x.key).join("|");
  if(!list.length){ host.hidden=true; host.innerHTML=""; return; }
  if(!force&&key===alertShownKey&&!host.hidden) return;
  alertShownKey=key;
  const me=meStaff();
  host.innerHTML=`<div class="alertbox" role="alertdialog" aria-modal="true" aria-labelledby="alertT"><h2 id="alertT">Time limit passed</h2>
   <p>${list.length} item${list.length>1?"s have":" has"} gone past the time allowed. Each one is recorded on the person's Q&G performance for the month.</p>
   <ul>${list.slice(0,8).map(x=>`<li><b>${esc(x.title)}</b> <span class="muted">${esc(x.activity)}${x.staffId!==me.id?" · "+esc(personName(x.staffId)):""}</span><br><span class="tag red">${esc(tatText(x))}</span> <button class="linkbtn" data-act="alertOpen" data-key="${esc(x.key)}">Open</button></li>`).join("")}</ul>
   ${list.length>8?`<p class="hint">${list.length-8} more in Team workload.</p>`:""}
   <div class="row"><button class="btn primary" data-act="alertAck">Acknowledge</button><button class="btn" data-act="alertLater">Remind me later</button></div></div>`;
  host.hidden=false; const b=host.querySelector(".btn.primary"); if(b) b.focus();
}
async function alertAction(act,el){
  const host=$("#alertHost");
  if(act==="alertLater"){ host.hidden=true; return; }
  if(act==="alertAck"){ const me=meStaff(); for(const x of myAlerts()){ const id=x.key.replace(/[^a-zA-Z0-9_-]/g,"_").slice(0,180); await patch("mod/perf/tat/"+id,x.staffId===me.id?{memberAckAt:nowMs()}:{managerAckAt:nowMs()}); } host.hidden=true; return toast("Acknowledged."); }
  if(act==="alertOpen"){ const x=S.tatLog.find(y=>y.key===el.dataset.key); host.hidden=true; if(!x) return;
    if(x.kind==="case"){ S.sel[x.sec]=x.ref; return go(x.sec); }
    if(x.kind==="rec"){ S.sel[x.sec]=x.refId; return go(x.sec); }
    if(x.kind==="task"){ S.sel.task=x.refId; return go("mywork"); }
    if(x.kind==="eval") return openEvalInQA(x.refId); }
}

function buildWorkbook(ventureId){

  add("About",[{"Platform":"Q&G Platform · Alfred Holdings","Scope":ventureId?vInfo(ventureId).name:"All ventures, one set of sheets per venture","Generated (Dubai time)":fmtX(nowMs()),"Generated by":S.meName}]);
  for(const v of vs){
    const c=v.code||v.id.slice(0,3).toUpperCase();
    add(c+" Cases",caseRows(S.cases.filter(x=>x.venture===v.id)));

    add(c+" Recognition",S.rrEntries.filter(e=>e.venture===v.id).map(e=>{ const p=S.rrProgs.find(x=>x.id===e.programmeId)||{}; return {"Programme":p.name||"","Cycle":p.cycle||"","Group":rrGroup(p,e.groupId).name,"Person":personName(e.staffId),"Team":teamName(e.staffTeamId),"Sales":e.sales,"Claims managed":e.claimsManaged,"SLA %":e.slaPct,"Verified reviews":e.reviews,"Q&G score":RR_CRIT.reduce((s,[k])=>s+Number((e.scores||{})[k]||0),0)||"","Final result":e.finalResult||"","Disqualified":e.disqualified?e.disqualified.reason:"","Last updated":fmtX(e.updatedAt)}; }));
    add(c+" Time limit breaches",S.tatLog.filter(x=>x.venture===v.id).map(x=>({"Detected":fmtX(x.detectedAt),"Person":personName(x.staffId),"Manager":x.managerId?personName(x.managerId):"","Activity":x.activity,"Item":x.title,"Time":tatText(x),"Month":x.month})));
  }
  if(!ventureId){
    add("Staff",Object.values(S.staff).map(p=>({"Name":p.name,"Employee ID":p.employeeId,"Email":p.email,"Designation":p.designation,"Roles":(p.roles||[]).map(roleLabel).join(", "),"Team today":teamName((asgAt(p)||{}).teamId),"Team history":(p.assignments||[]).map(a=>teamName(a.teamId)+" "+a.from+" to "+(a.to||"present")).join("; "),"Last updated":fmtX(p.updatedAt)})));
    add("Teams",Object.values(S.teams).map(t=>({"Team":t.name,"Venture":vInfo(t.venture).name,"LOB":t.lob,"Kind":t.kind,"Line manager":personName(t.lineManagerId),"Superior":personName(t.superiorId),"Active":t.active===false?"No":"Yes"})));
    add("Tasks",S.tasks.map(t=>({"Task":t.title,"Venture":t.venture?vInfo(t.venture).name:"Group-wide","Assigned to":personName(t.assigneeId),"Status":t.status,"Due":t.due,"Created":fmtX(t.createdAt),"Done":fmtX(t.doneAt)})));
    add("Regulations",S.regs.map(r=>({"Title":r.title,"Authority":r.regulator,"Reference":r.refNo,"Status":r.status,"Effective":r.effective,"Applies to":(r.ventures||[]).join(", ")})));
    add("SOPs",S.sops.map(s=>({"Title":s.title,"Venture":s.venture||"all","Category":s.category,"Status":s.status,"Version":s.versions.length,"Last published":fmtX(s.versions[s.versions.length-1].at)})));
    add("Open questions",S.questions.map(q=>({"Section":(NAVMAP[q.section]||{label:"Platform-wide"}).label,"Question":q.q,"Status":q.status,"Answer":q.answer||"","Raised":fmtX(q.askedAt)})));
  }
  return wb;
}
async function downloadBackup(){
  if(!DOWNLOADS) return toast("Downloads aren't available in this view.");
  try{ const wb=buildWorkbook(S.venture); const b64=XLSX.write(wb,{bookType:"xlsx",type:"base64"});
    const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    await DOWNLOADS.save({filename:`QG-Platform-${S.venture?vInfo(S.venture).code+"-":""}${todayD()}.xlsx`,data:new Blob([bytes],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})});
  }catch(e){ if(e&&e.code==="cancelled") return; toast(e.message||"The download didn't start."); }
}
async function driveBackup(auto){
  if(!MCP){ if(!auto) toast("Google Drive isn't connected in your session."); return false; }
  const day=todayD(), files=[];
  try{
    const sets=[["",`QG-Platform-backup-${day}-ALL.xlsx`],...ventures().map(v=>[v.id,`QG-Platform-backup-${day}-${v.code}.xlsx`])];
    for(const [v,title] of sets){
      const b64=XLSX.write(buildWorkbook(v),{bookType:"xlsx",type:"base64"});
      const res=await MCP.callTool("Google Drive","create_file",{title,base64Content:b64,contentMimeType:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",disableConversionToGoogleType:true,parentId:driveFolder()});
      const p=(res&&res.payload)||{}; files.push({title,id:p.id||"",url:p.viewUrl||""});
    }
    await put("mod/sys/backups/"+day,{day,at:nowMs(),by:S.uid,byName:S.meName,auto:!!auto,files,status:"done"});
    if(!auto) toast(files.length+" backup files saved to Drive.");
    return true;
  }catch(e){
    await logError("backup",(auto?"Daily":"Manual")+" backup to Google Drive failed",{op:"driveBackup"},e);
    if(!auto) toast("The backup failed. It's in the error report.");
    return false;
  }
}
async function dailyBackupCheck(){
  if(!DB||!MCP||!S.admin||!window.XLSX) return;
  const day=todayD();
  if(S.backups.some(b=>b.day===day&&b.status==="done")) return;
  try{ const l=await DB.doc("mod/sys/locks/backup").acquire({holder:S.uid+"-"+SESSION,ttlMs:300000}); if(!l.acquired) return; }catch(_){ return; }

function impAuto(fields,headers){

    if(!f) f=fields.find(x=>!used.has(x.k)&&nh.length>3&&(norm(x.l).includes(nh)||nh.includes(norm(x.l))));
    if(!f){ const stop=new Set(["of","the","a","an","to","in","on","for","and","or","by","date"]), tok=x=>new Set(norm(x).replace(/[^a-z0-9 ]/g," ").split(" ").filter(w=>w&&!stop.has(w))), ht=tok(h);

/* ================= Rewards & recognition: programmes per venture (IM Service Stars rules) ================= */
const RR_PHASES=[["live","Live"],["closed","Closed"],["validation","Q&G validation"],["appeals","Appeals window"],["final","Final"]];
const RR_CRIT=[["client","Client experience"],["internal","Internal support"],["volumes","Volumes managed"],["accuracy","Accuracy and turnaround"],["extra","Going the extra mile"]];
const ORD=n=>n+(["th","st","nd","rd"][((n%100)-20)%10]||["th","st","nd","rd"][n%100]||"th");
const rrProgs=()=>S.rrProgs.filter(p=>inV(p.venture)).sort((a,b)=>String(b.start).localeCompare(String(a.start)));
const rrEntries=pid=>S.rrEntries.filter(e=>e.programmeId===pid);
const rrBounds=p=>[localToMs(p.start,"00:00"),localToMs(p.end,"23:59")+60000];
const inCycle=(p,t)=>{ const [a,b]=rrBounds(p), x=ts(t); return x>=a&&x<b; };
const rrGroup=(p,id)=>(p.groups||[]).find(g=>g.id===id)||{name:"Unknown group",track:"advisor",winners:1};
const canNominate=()=>S.admin||isQG()||Object.values(S.teams).some(t=>meStaff()&&(t.lineManagerId===meStaff().id||t.superiorId===meStaff().id));
const UPHELD=["Valid","Partially valid"];

/* platform-derived facts for one person in a cycle */
function rrFacts(p,staffId){
  const person=S.staff[staffId]||{}, cases=S.cases.filter(c=>c.venture===p.venture&&inCycle(p,c.receivedAt||c.createdAt));
  const neg=cases.filter(c=>c.type==="Negative review"&&(c.staffId===staffId||(c.review||{}).consequenceStaffId===staffId));
  const cmp=cases.filter(c=>c.type!=="Negative review"&&!isCallback(c)&&(c.staffId===staffId||(c.review||{}).consequenceStaffId===staffId));
  const upheld=l=>l.filter(c=>isUpheld((c.review||{}).verdict));
  const pending=l=>l.filter(c=>!(c.review||{}).verdict&&c.status!=="closed");
  const openCons=[...S.recs.filter(r=>r.section==="breaches"&&r.staffId===staffId&&r.status!=="Closed"&&r.consequence&&r.consequence!=="None"),
    ...S.cases.filter(c=>["consequence","dispute"].includes(c.status)&&(c.review||{}).consequenceStaffId===staffId)];
  const rev=S.recs.filter(r=>r.section==="reviews"&&r.staffId===staffId&&["4","5"].includes(String(r.rating))&&r.date>=p.start&&r.date<=p.end);
  const verified=rev.filter(r=>r.verified==="yes");
  const qa=S.evals.filter(e=>(e.ventureId||"insurancemarket")===p.venture&&inCycle(p,e.interactionDate||e.createdAt)&&((person.email&&norm(e.advisorEmail)===norm(person.email))||norm(e.advisorName)===norm(person.name)));
  return {neg:upheld(neg),negPending:pending(neg),cmp:upheld(cmp),cmpPending:pending(cmp),cons:openCons,reviewsLogged:rev.length,reviewsVerified:verified.length,qaAvg:qa.length?Math.round(qa.reduce((s,e)=>s+Number(e.totalScore||0),0)/qa.length*10)/10:null,qaN:qa.length};
}
function rrClean(p,e){
  const f=rrFacts(p,e.staffId), o=e.cleanOverride||{};
  const fails=[];
  if(f.neg.length&&!o.neg) fails.push("review");
  if(f.cmp.length&&!o.cmp) fails.push("complaint");
  if((f.cons.length||e.openHR)&&!o.cons) fails.push("HR");
  return {ok:!fails.length,fails,f};
}
const val=(e,f,auto)=>e[f]===""||e[f]==null?auto:Number(e[f]);

/* standings for one group, following the programme rules */
function rrStandings(p,g){
  const list=rrEntries(p.id).filter(e=>e.groupId===g.id);
  const rows=list.map(e=>{ const c=rrClean(p,e), reviews=val(e,"reviews",c.f.reviewsVerified), qa=val(e,"qaScore",c.f.qaAvg);
    let why=null;
    if(e.disqualified) why="Disqualified (fair play)";
    else if(!c.ok) why="Not eligible ("+c.fails[0]+")";
    else if(g.track==="claims"&&Number(e.slaPct||0)<(g.minSla||90)) why="Not eligible: SLA";
    else if(g.track==="claims"&&Number(e.claimsManaged||0)<(g.minClaims||20)) why="Below minimum claims";
    else if(g.track!=="support"&&reviews<(g.minReviews||5)) why=`Below minimum (${reviews} of ${g.minReviews||5} verified reviews)`;
    return {e,c,reviews,qa,why,sales:Number(e.sales||0),claims:Number(e.claimsManaged||0),sla:Number(e.slaPct||0),rps:Number(e.sales||0)?reviews/Number(e.sales):0,conv:Number(e.claimsManaged||0)?reviews/Number(e.claimsManaged):0,total:RR_CRIT.reduce((s,[k])=>s+Number((e.scores||{})[k]||0),0)};
  });
  const el=rows.filter(r=>!r.why);
  if(g.track==="advisor"){ const mR=Math.max(0,...el.map(r=>r.reviews)), mP=Math.max(0,...el.map(r=>r.rps)); el.forEach(r=>r.score=Math.round(((mR?0.5*r.reviews/mR:0)+(mP?0.5*r.rps/mP:0))*100)/100); }
  const key=g.track==="advisor"?[r=>r.score,r=>r.rps,r=>r.reviews,r=>r.qa??-1]:g.track==="claims"?[r=>Math.round(r.conv*10000),r=>r.reviews,r=>r.sla,r=>r.claims]:[r=>r.total,r=>Number((r.e.scores||{}).client||0),r=>Number((r.e.scores||{}).volumes||0),r=>Number((r.e.scores||{}).accuracy||0)];
  const cmp=(a,b)=>{ for(let i=0;i<key.length;i++){ const d=key[i](b)-key[i](a); if(d) return {d,i}; } return {d:0,i:-1}; };
  el.sort((a,b)=>cmp(a,b).d);
  el.forEach((r,i)=>{
    if(i===0){ r.rank=1; return; }
    const c=cmp(el[i-1],r);
    if(c.i===-1){ r.rank=el[i-1].rank; r.joint=el[i-1].joint=true; }
    else { r.rank=i+1; if(c.i>0){ el[i-1].tieWin=true; r.tieLose=true; } }
  });
  return {el,inel:rows.filter(r=>r.why)};
}
function rrResult(p,g,r){
  const win=r.rank<=(g.winners||1)&&(g.track!=="support"||(r.e.panel!=="not_selected"));
  const fin=p.phase==="final";
  if(g.track==="support"&&fin) return r.e.panel==="selected"?`<b>${esc(g.name)} Support Star</b>`:`Rank ${r.rank}`;
  const tie=r.joint?" (joint)":r.tieWin?" (wins tie)":r.tieLose?" (loses tie)":"";
  if(win) return fin?`<b>Winner, ${ORD(r.rank)}${tie}</b>`:`<span class="tag amb">Provisional ${ORD(r.rank)}${tie}</span>`;
  return `Rank ${r.rank}${tie}`;
}

async function rrUpload(pid,file){

  let added=0, updated=0; const miss=[];

    const person=byName(g("Name")), grp=(p.groups||[]).find(x=>norm(x.name)===norm(g("Group")));
    if(!person||!grp||grp.track==="support"){ miss.push(String(g("Name")||"(blank)")); continue; }
    const ex=rrEntries(p.id).find(x=>x.groupId===grp.id&&x.staffId===person.id), num=k=>{ const v=g(k); return v===""?(ex?ex[k.replace(/ /g,"")]:""):Number(String(v).replace("%","")); };
    const doc={...(ex||{}),id:ex?ex.id:rid("rre-"),programmeId:p.id,venture:p.venture,groupId:grp.id,track:grp.track,staffId:person.id,staffTeamId:(asgAt(person)||{}).teamId||null,
      sales:g("Sales")===""?(ex?ex.sales:""):Number(g("Sales")),claimsManaged:g("Claims managed")===""?(ex?ex.claimsManaged:""):Number(g("Claims managed")),slaPct:g("SLA %")===""?(ex?ex.slaPct:""):Number(String(g("SLA %")).replace("%","")),reviews:g("Verified reviews")===""?(ex?ex.reviews:""):Number(g("Verified reviews")),qaScore:g("QA score")===""?(ex?ex.qaScore:""):Number(g("QA score")),
      updatedAt:nowMs(),createdAt:ex?ex.createdAt:nowMs(),history:[...((ex&&ex.history)||[]),{at:nowMs(),byName:S.meName,note:"Figures uploaded from "+file.name}]};
    if(await put("mod/rr/entries/"+doc.id,doc)) ex?updated++:added++; }
  toast(`${added} added, ${updated} updated${miss.length?`; ${miss.length} rows skipped (name or group not matched: ${miss.slice(0,3).join(", ")}${miss.length>3?"…":""})`:""}.`);
}

  const calls=ev.filter(e=>!/email/i.test(e.channel||"")), mails=ev.filter(e=>/email/i.test(e.channel||""));
  const avgS=a=>a.length?Math.round(a.reduce((s,e)=>s+Number(e.totalScore||0),0)/a.length*10)/10:null;
  const open=sec=>recsOf(sec).filter(r=>!REG[sec].final.includes(r.status)).length;
  const recent=sec=>recsOf(sec).filter(r=>(r.date||"")>=from30).length;
  const cx=cxCases("complaints"), cb=cxCases("callbacks");
  return {
    complaints:[cx.filter(isOpenCase).length,cx.filter(c=>isOpenCase(c)&&overdue(c)).length],
    csat:(()=>{ const sc=[...cx,...cb].filter(c=>c.csat&&c.csat.status==="Captured"&&ts(c.csat.at)>=from).map(c=>c.csat.score); return [sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length*10)/10:null,sc.length]; })(),

    callbacks:[cb.filter(isOpenCase).length,cb.filter(c=>isOpenCase(c)&&overdue(c)).length],

    breaches:[open("breaches"),breachCandidates().length],

    rr:(()=>{ const pr=rrProgs().filter(x=>x.phase!=="final"); const en=pr.flatMap(x=>rrEntries(x.id)); return [en.filter(e=>e.track!=="support").length,pr.length,en.filter(e=>e.track==="support").length,pr.map(x=>(RR_PHASES.find(p=>p[0]===x.phase)||[])[1]).filter(Boolean).join(", "),en.filter(e=>{ const x=pr.find(y=>y.id===e.programmeId); return x&&!rrClean(x,e).ok; }).length]; })(),
    journeyRet:[recsOf("journey").filter(r=>r.status==="Ready for retest").length],noncompliance:[open("noncompliance")],rca:[open("rca")],product:[open("product")],

}

async function errAction(act,el){
  const e=S.errors.find(x=>x._id===el.dataset.id); if(!e) return;
  if(act==="errResolve"){ const why=prompt("How was it resolved?","Handled manually"); if(why===null) return; await DB.doc("mod/sys/errors/"+e._id).update({status:"resolved",resolution:why,resolvedAt:nowMs(),resolvedBy:S.meName}); return; }
  if(act==="errRetry"){
    let ok=false;
    try{
      if(e.kind==="email") ok=await deliver(e.payload);
      else if(e.kind==="write"){ const r=DB.doc(e.payload.path); if(e.payload.op==="delete") await r.delete(); else if(e.payload.op==="update") await r.update(e.payload.data); else await r.set(e.payload.data); ok=true; }
      else if(e.kind==="sync"){ if(e.payload.op==="syncAdvisor"&&S.staff[e.payload.staffId]){ await syncAdvisor(S.staff[e.payload.staffId]); ok=true; } else if(e.payload.op==="importQA"){ await staffAction("importQA",{dataset:{}}); ok=true; } }
    }catch(err){ ok=false; }
    if(ok){ await DB.doc("mod/sys/errors/"+e._id).update({status:"resolved",resolution:"Run again by "+S.meName,resolvedAt:nowMs()}); toast("Done."); }
    else toast("It failed again. A new entry has been logged.");
  }
}

async function cfgSave(){
  const d=draft("cfg"), c=clone(S.cfg), lines=s=>String(s).split("\n").map(x=>x.trim()).filter(Boolean);
  if(d.days) c.work.days=d.days.map(Number).sort();
  if(d.start) c.work.start=d.start; if(d.end) c.work.end=d.end;
  if("holidays" in d){ const h=lines(d.holidays); if(h.some(x=>!/^\d{4}-\d\d-\d\d$/.test(x))) return toast("Holidays must be dates like 2026-12-02."); c.work.holidays=h; }
  for(const f of ["intake","lm","qgReview","consequence","dispute"]) if(("sla."+f) in d) c.sla[f]=Math.max(1,Number(d["sla."+f])||c.sla[f]);
  if(d.reminderEveryHours) c.reminderEveryHours=Math.max(1,Number(d.reminderEveryHours));
  c.cx={...(c.cx||{})};
  for(const key of Object.keys(d).filter(x=>x.startsWith("cx."))){ const f=key.slice(3), v=d[key];
    if(f==="targetTat"){ const o={}; lines(v).forEach(l=>{ const i=l.lastIndexOf(":"); if(i>0){ const n=Number(l.slice(i+1)); if(n>0) o[l.slice(0,i).trim()]=n; } }); c.cx[f]=o; }
    else if(f==="complaintTaxonomy"){ const o={}; lines(v).forEach(l=>{ const [t,rest]=l.split(":"); if(t&&t.trim()) o[t.trim()]=(rest||"").split(",").map(x=>x.trim()).filter(Boolean); }); c.cx[f]=o; }
    else if(f==="csatLink"){ if(v&&!/^https?:\/\//i.test(v.trim())) return toast("The satisfaction link should start with https://"); c.cx[f]=v.trim(); }
    else if(f==="draftAutoCloseDays") c.cx[f]=Math.max(1,Number(v)||30);
    else if(f==="notReachableAutoClose") c.cx[f]=v==="yes";
    else c.cx[f]=lines(v); }
  c.tat={...(c.tat||{})}; for(const key of Object.keys(d).filter(x=>x.startsWith("tat."))) c.tat[key.slice(4)]=Math.max(1,Number(d[key])||TAT_DEFAULTS[key.slice(4)]);
  if("dialFormat" in d){ if(!d.dialFormat.includes("{number}")) return toast("The dial link needs {number} where the number goes."); c.dialFormat=d.dialFormat.trim(); }
  if("dialPrefix" in d) c.dialPrefix=d.dialPrefix.trim(); if("backupFolderId" in d) c.backupFolderId=d.backupFolderId.trim();
  if("sources" in d) c.sources=lines(d.sources); if("caseTypes" in d) c.caseTypes=lines(d.caseTypes); if("consequences" in d) c.consequences=lines(d.consequences);
  if(!c.caseTypes.includes("Callback request")) c.caseTypes.push("Callback request");
  if(c.consequences[0]!=="None") c.consequences=["None",...c.consequences.filter(x=>x!=="None")];
  if(c.work.start>=c.work.end) return toast("The day must end after it starts.");
  if(!await put("mod/core/config/main",c)) return;
  await addAudit("settings","main","Settings saved",null,null,Object.keys(d).join(", "));
  delete S.drafts.cfg; toast("Settings saved.");
}

function onField(e,commit){
  const el=e.target;
  if(el.dataset.bulk!==undefined){ bulkInput(el); if(commit) bulkRefresh(); return; }
  if(el.dataset.ui){ const [k,f]=el.dataset.ui.split("."); (S.ui[k]||(S.ui[k]={}))[f]=el.value; clearTimeout(onField.t); onField.t=setTimeout(()=>render(),el.type==="search"?250:0); return; }
  if(!el.dataset.d) return;
  const d=draft(el.dataset.d), f=el.dataset.f;
  if(el.dataset.multi!==undefined){ const base=()=>{ if(el.dataset.d==="cfg") return S.cfg.work.days.map(String); if(el.dataset.d.startsWith("rg-")){ const r=S.regs.find(x=>"rg-"+x.id===el.dataset.d); return r?r.ventures||[]:["all"]; } if(f==="internalActions") return []; const id=el.dataset.d.slice(2), p=S.staff[id]; if(f==="ventureAccess") return (p&&p.ventureAccess)||[]; return (p&&p.roles)||(el.dataset.d==="p-new"?["advisor"]:[]); };
    const cur=new Set((d[f]??base()).map(String)); el.checked?cur.add(el.dataset.multi):cur.delete(el.dataset.multi); d[f]=[...cur]; }
  else if(el.type==="checkbox") d[f]=el.checked;
  else if(el.type==="radio"){ if(el.checked) d[f]=el.value; }
  else d[f]=el.value;
  const c=S.cases.find(x=>x.ref===el.dataset.d); if(c&&canAct(c)&&!c.stageStartedAt&&commit) markStarted(c);
  if(commit&&(el.tagName==="SELECT"||el.type==="radio"||el.type==="checkbox"||((f==="mobile"||f==="dealRef")&&String(el.dataset.d).startsWith("new-")))) setTimeout(()=>render(true),0);
}

function lastActivity(sec){
  const up=x=>[x.updatedAt,x.createdAt,x.at];
  if(sec==="complaints"||sec==="callbacks") return lastOf(cxCases(sec).map(up));
  if(REG[sec]) return lastOf(recsOf(sec).map(up));
  if(sec==="links") return lastOf(S.links.map(up));
  if(sec==="lists") return lastOf(S.audit.filter(a=>a.entity==="lists").map(a=>a.at));
  if(sec==="rr") return lastOf(S.rrEntries.map(up),S.rrProgs.map(p=>(p.history||[]).map(h=>h.at)));
  if(sec==="calls"||sec==="emails") return lastOf(evalsV().filter(e=>(sec==="emails")===/email/i.test(e.channel||"")).map(e=>[e.updatedAt,e.createdAt]));
  if(sec==="sops") return lastOf(S.sops.flatMap(s=>(s.versions||[]).map(v=>v.at)));
  if(sec==="regulations") return lastOf(regsV().map(up));
  if(sec==="staff"||sec==="structure") return lastOf(Object.values(S.staff).map(up),Object.values(S.teams).map(up));
  if(sec==="mywork"||sec==="team") return lastOf(S.tasks.map(up),S.cases.map(up),S.recs.map(up));
  if(sec==="questions") return lastOf(S.questions.map(q=>[q.askedAt,q.answeredAt,q.parkedAt,q.reopenedAt]));
  if(sec==="guide") return lastOf(S.designlog.map(e=>e.at),((S.playbooks.guide||{}).versions||[]).map(v=>v.at));
  if(sec==="trash") return lastOf(S.trash.map(t=>[t.deletedAt,t.restoredAt]),S.qaTrash.map(t=>t.deletedAt));
  if(sec==="errors") return lastOf(S.errors.map(up)); if(sec==="outbox") return lastOf(S.outbox.map(up)); if(sec==="audit") return lastOf(S.audit.map(up));
  if(sec==="home") return lastOf(S.cases.map(up),S.recs.map(up),S.evals.map(e=>[e.updatedAt,e.createdAt]),S.tasks.map(up));
  return NaN;
}
